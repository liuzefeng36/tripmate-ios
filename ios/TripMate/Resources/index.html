    TM.ledger = TM.ledger || {};
    TM.ledger.monthKeyOf = monthKeyOf;
    TM.ledger.statsOf = statsOf;
    TM.ledger.monthSeries = monthSeries;
  }
})();

/* ===== 60-health.js ===== */
/* ==========================================================================
 * 60-health.js · 健康节奏
 * 页面：#/health 健康概览、#/load-detail 负荷明细、#/goals 健康目标
 * 数据：TM.store.health() / computeLoad() / setHealthGoal() /
 *       toggleHealthReminder() / logHealthMetric() / addSchedule()
 * ========================================================================== */
(function () {
  'use strict';

  const TM = window.TM;

  const GOALS = [
    { type: 'steps', name: '每日步数', icon: 'steps', unit: '步', def: 8000, step: 1000, color: '--primary' },
    { type: 'water', name: '每日饮水', icon: 'water', unit: '毫升', def: 1600, step: 200, color: '--green' },
    { type: 'sleep', name: '每日睡眠', icon: 'moon', unit: '小时', def: 8, step: 0.5, color: '--purple' },
    { type: 'stand', name: '久坐起身', icon: 'stand', unit: '次', def: 8, step: 1, color: '--orange' }
  ];
  const REMINDERS = [
    { key: 'sedentary', name: '久坐提醒', desc: '连续静坐 60 分钟，建议 3 分钟拉伸' },
    { key: 'water', name: '饮水提醒', desc: '每 2 小时一次，会议中静默' },
    { key: 'sleep', name: '睡眠提醒', desc: '次日首个日程早于 8:00 时倒推入睡时间' },
    { key: 'meal', name: '用餐提醒', desc: '日程跨越 12:00 或 18:00 时预留用餐' }
  ];
  const BLOCKS = [
    { key: 'stretch', name: '午间拉伸', hm: '12:30', min: 15, icon: 'walk', desc: '12:30–12:45 · 15 分钟' },
    { key: 'walk', name: '傍晚散步', hm: '18:30', min: 30, icon: 'walk', desc: '18:30–19:00 · 30 分钟' },
    { key: 'rest', name: '睡前放松', hm: '21:30', min: 30, icon: 'moon', desc: '21:30–22:00 · 30 分钟' }
  ];

  /* ---------- 工具 ---------- */
  function util() { return (TM && TM.util) || {}; }
  function esc(s) {
    if (util().esc) return TM.util.esc(s);
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function icon(name, size) { return (TM && typeof TM.icon === 'function') ? TM.icon(name, size || 20) : ''; }
  function toast(msg, opts) { if (TM.ui && TM.ui.toast) TM.ui.toast(msg, opts); }
  function go(hash) { if (TM.ui && TM.ui.go) TM.ui.go(hash); }
  function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function head(opts) {
    if (TM.ui && TM.ui.head) return TM.ui.head(opts);
    return '<header class="scr-head"><div class="scr-title">' + esc(opts.title) + '</div></header>';
  }
  function empty(ic, title, desc, action) {
    if (TM.ui && TM.ui.empty) return TM.ui.empty(ic, title, desc, action || '');
    return '<div class="card card--dashed center">' + esc(title) + '</div>';
  }

  function healthData() {
    try {
      const h = TM.store && TM.store.health ? TM.store.health() : null;
      if (h && typeof h === 'object') return h;
    } catch (e) { /* ignore */ }
    return { goals: {}, metrics: {}, reminders: {} };
  }

  function goalOf(h, type) {
    const meta = GOALS.filter(function (g) { return g.type === type; })[0];
    const v = h.goals ? Number(h.goals[type]) : 0;
    return { value: isFinite(v) && v > 0 ? v : meta.def, unit: meta.unit };
  }

  function metricOf(h, type) {
    if (!h.metrics) return 0;
    const v = Number(h.metrics[type]);
    return isFinite(v) ? v : 0;
  }

  function reminderOn(h, key) {
    if (!h.reminders) return false;
    return !!h.reminders[key];
  }

  function loadOf(dateKey) {
    try {
      if (TM.store && typeof TM.store.computeLoad === 'function') {
        const l = TM.store.computeLoad(dateKey);
        if (l && typeof l.index === 'number') return l;
      }
    } catch (e) { /* ignore */ }
    return { index: 0, level: '轻松', tone: 'blue', factors: [], minutes: 0, meetings: 0 };
  }

  function loadColor(load) {
    const map = { green: '--green', blue: '--primary', orange: '--orange', red: '--red' };
    const tone = map[load && load.tone] || '';
    if (tone) return 'var(' + tone + ')';
    const byLevel = { '轻松': '--green', '适中': '--primary', '偏高': '--orange', '过载': '--red' };
    return 'var(' + (byLevel[load && load.level] || '--primary') + ')';
  }

  function cssVar(name) {
    try {
      const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || '';
    } catch (e) { return ''; }
  }

  function ring(value, size, opts) {
    if (TM.ui && TM.ui.ring) {
      try { return TM.ui.ring(value, size, opts || {}); } catch (e) { /* ignore */ }
    }
    return '';
  }

  function fmtHour(h) {
    const n = Math.round((Number(h) || 0) * 10) / 10;
    return (n % 1 === 0 ? String(n) : n.toFixed(1)) + 'h';
  }

  function fmtNum(n) {
    const v = Number(n) || 0;
    return v.toLocaleString('zh-CN');
  }

  function fmtGoalVal(type, v) {
    const n = Number(v) || 0;
    if (type === 'sleep') return (n % 1 === 0 ? String(n) : n.toFixed(1));
    if (type === 'water') return fmtNum(n);
    return fmtNum(n);
  }

  function crossCity(load) {
    if (!load || !Array.isArray(load.factors)) return false;
    const f = load.factors.filter(function (x) { return x.label && x.label.indexOf('跨城') >= 0; })[0];
    return !!(f && String(f.detail).indexOf('跨城') >= 0 && String(f.detail).indexOf('同城') < 0);
  }

  /* 本周（周一至周日）每天的日程时长 */
  function weekSeries() {
    const today = new Date();
    const wd = (today.getDay() + 6) % 7;
    const monday = TM.time.addDays(TM.time.startOfDay(today), -wd);
    const out = [];
    for (let i = 0; i < 7; i++) {
      const d = TM.time.addDays(monday, i);
      const key = TM.time.key(d);
      let list = [];
      try { list = TM.store.schedulesOfDay(key) || []; } catch (e) { list = []; }
      const min = list.reduce(function (sum, s) { return sum + Math.max(0, TM.time.diffMin(s.end, s.start)); }, 0);
      out.push({
        date: d, key: key,
        weekday: TM.time.fmt(d, 'weekday'),
        hours: Math.round(min / 6) / 10,
        count: list.length,
        isToday: key === TM.time.todayKey()
      });
    }
    return out;
  }

  /* 健康时间块：今天该时刻已过则放到明天 */
  function blockTime(hm) {
    const now = new Date();
    let start = TM.time.at(TM.time.todayKey(), hm);
    if (start.getTime() < now.getTime()) start = TM.time.addDays(start, 1);
    return start;
  }

  function insertBlock(cfg, dateStart) {
    const start = dateStart || blockTime(cfg.hm);
    const end = TM.time.addMin(start, cfg.min);
    let sc = null;
    try {
      sc = TM.store.addSchedule({
        title: '健康时间块 · ' + cfg.name,
        location: '',
        start: start,
        end: end,
        category: 'health',
        status: 'confirmed',
        source: 'manual',
        note: '由健康节奏插入的休息时间块，冲突检测中按软约束处理'
      });
    } catch (e) { toast('插入失败，请稍后重试'); return; }
    if (!sc) { toast('插入失败，请稍后重试'); return; }
    if (TM.ui && TM.ui.haptic) TM.ui.haptic();
    toast('已插入「' + cfg.name + '」' + TM.time.fmt(start, 'md') + ' ' + TM.time.fmt(start, 'hm'), {
      action: {
        label: '撤销',
        onClick: function () {
          try { TM.store.removeSchedule(sc.id); } catch (e) { /* ignore */ }
          toast('已撤销健康时间块');
        }
      }
    });
    if (TM.ui && TM.ui.closeOverlay) TM.ui.closeOverlay();
  }

  /* 弹层选择（全局绑定一次） */
  let overlayBound = false;
  function bindOverlay() {
    if (overlayBound) return;
    const root = document.getElementById('overlay-root');
    if (!root) return;
    root.addEventListener('click', function (e) {
      const el = e.target.closest('[data-hl-block]');
      if (!el) return;
      const cfg = BLOCKS.filter(function (b) { return b.key === el.getAttribute('data-hl-block'); })[0];
      if (cfg) insertBlock(cfg);
    });
    overlayBound = true;
  }

  /* 事件分发：#screen 每次 render 都是新节点，节点变化时重新绑定（每个节点只绑一次） */
  let boundRoot = null;
  let pageTest = null;
  let pageFn = null;
  function bindRootOnce() {
    const el = document.getElementById('screen');
    if (!el || el === boundRoot) return;
    boundRoot = el;
    el.addEventListener('click', function (e) {
      if (!pageFn) return;
      const path = location.hash.split('?')[0];
      if (pageTest && !pageTest.test(path)) return;
      pageFn(e);
    });
  }
  function page(test, fn) {
    pageTest = test;
    pageFn = fn;
    bindRootOnce();
  }

  /* ==========================================================================
   * 1. #/health 健康概览
   * ========================================================================== */
  TM.screens.register('health', {
    route: /^#\/health\/?$/i,
    render: function () {
      const h = healthData();
      const load = loadOf();
      const hours = Math.round((load.minutes || 0) / 6) / 10;
      const cross = crossCity(load) ? 1 : 0;
      const levelColor = loadColor(load);
      const series = weekSeries();
      const weekTotal = Math.round(series.reduce(function (a, s) { return a + s.hours; }, 0) * 10) / 10;
      const maxHours = Math.max.apply(null, series.map(function (s) { return s.hours; }).concat([8]));
      const hotDays = series.filter(function (s) { return s.hours > 10; });

      /* 负荷卡 */
      const loadCard = '<div class="card hl-loadcard">' +
        '<div class="hl-ringwrap">' +
        ring(clamp(load.index, 0, 100), 148, {
          color: loadColor(load),
          track: 'var(--bg)',
          label: String(load.index),
          sub: load.level
        }) +
        '</div>' +
        '<div class="hl-loadstats">' +
        '<div class="hl-loadstat"><b>' + (load.meetings || 0) + '</b><span>会议 / 工作</span></div>' +
        '<div class="hl-loadstat"><b>' + fmtHour(hours) + '</b><span>日程时长</span></div>' +
        '<div class="hl-loadstat"><b>' + cross + '</b><span>跨城</span></div>' +
        '</div>' +
        '<div class="hl-loadlevel" style="--hl-c:' + levelColor + '">' +
        '<span class="hl-leveldot"></span>今日负荷：' + esc(load.level) +
        '<span class="hl-levelhint">0–34 轻松 · 35–59 适中 · 60–79 偏高 · 80–100 过载</span>' +
        '</div>' +
        '<button class="hl-detailbtn" type="button" data-act="load-detail">查看构成明细' + icon('chevron', 15) + '</button>' +
        '</div>';

      /* 健康提醒 */
      const remList = '<div class="list hl-remlist">' + REMINDERS.map(function (r) {
        const on = reminderOn(h, r.key);
        return '<div class="li hl-remrow">' +
          '<div class="li-main"><div class="li-t">' + esc(r.name) + '</div><div class="li-s">' + esc(r.desc) + '</div></div>' +
          '<div class="li-r"><button class="switch switch--blue' + (on ? ' switch--on' : '') + '" type="button" role="switch" aria-checked="' + (on ? 'true' : 'false') + '" aria-label="' + esc(r.name) + '" data-act="toggle-rem" data-key="' + r.key + '"></button></div>' +
          '</div>';
      }).join('') + '</div>';

      /* 本周趋势 */
      const chart = '<div class="card hl-trendcard">' +
        '<div class="hl-chart" role="img" aria-label="本周每日日程时长柱状图">' +
        series.map(function (s) {
          const hgt = Math.max(6, Math.round(s.hours / maxHours * 96));
          const hot = s.hours > 10;
          return '<div class="hl-barcol' + (s.isToday ? ' hl-barcol--now' : '') + (hot ? ' hl-barcol--hot' : '') + '">' +
            '<div class="hl-barval">' + (s.hours > 0 ? fmtHour(s.hours) : '·') + '</div>' +
            '<div class="hl-bartrack"><i style="height:' + hgt + 'px"></i></div>' +
            '<div class="hl-barlbl">' + esc(s.weekday.slice(1)) + '</div>' +
            '</div>';
        }).join('') + '</div>' +
        '<div class="hl-tip muted small">' +
        (hotDays.length
          ? '提示：' + hotDays.map(function (s) { return s.weekday; }).join('、') + '日程超过 10 小时，已触发负荷提醒。'
          : '本周日程时长共 ' + fmtHour(weekTotal) + '，暂未出现超过 10 小时的高负荷日。') +
        '</div>' +
        '</div>';

      /* 健康目标完成度 */
      const goalRows = GOALS.map(function (g) {
        const goal = goalOf(h, g.type);
        const val = metricOf(h, g.type);
        const pctv = goal.value > 0 ? Math.round(val / goal.value * 100) : 0;
        const done = val >= goal.value;
        return '<div class="li hl-goalrow">' +
          '<span class="hl-goalicon" style="--hl-c:var(' + g.color + ')">' + icon(g.icon, 18) + '</span>' +
          '<div class="li-main">' +

        '<div class="scr-body">' + body + '</div>' +
        '</section>';

    mount: function (root) {
      function inputOf(type) {
        return root.querySelector('.hl-goalnum[data-type="' + type + '"]');
      }

      page(/^#\/goals(\?|$)/i, function (e) {
        const el = e.target.closest('[data-act]');
        if (!el || !root.contains(el)) return;
        const act = el.getAttribute('data-act');

        if (act === 'step') {
          const type = el.getAttribute('data-type');
          const d = Number(el.getAttribute('data-d')) || 0;
          const meta = GOALS.filter(function (g) { return g.type === type; })[0];
          const input = inputOf(type);
          if (!input) return;
          const cur = Number(input.value) || 0;
          const step = type === 'water' ? (cur >= 800 ? 200 : 1) : meta.step;
          const next = Math.max(0, Math.round((cur + d * step) * 10) / 10);
          input.value = String(next);
        } else if (act === 'save-goal') {
          let changed = 0;
          GOALS.forEach(function (g) {
            const input = inputOf(g.type);
            if (!input) return;
            const v = Number(input.value);
            if (!isFinite(v) || v <= 0) return;
            try { TM.store.setHealthGoal(g.type, v); changed += 1; } catch (err) { /* ignore */ }
          });
          if (changed) toast('健康目标已保存');
          else toast('请填写大于 0 的目标值');
          if (TM.ui && TM.ui.back) TM.ui.back();
        }
      });
    }
  });
})();

/* 70-ai.js —— 小行 AI：对话页、建议中心、周报复盘 */
(function () {
  'use strict';

  const TM = window.TM;
  if (!TM || !TM.screens) return;

  const U = TM.util;
  const T = TM.time;
  const E = function (v) { return U.esc(v === null || v === undefined ? '' : String(v)); };
  const IC = function (n, s) { return TM.icon ? (TM.icon(n, s) || '') : ''; };
  const toast = function (m, o) { return TM.ui.toast(m, o); };
  const money = function (n) { return U.money(Number(n) || 0); };

  function S() { return TM.store || {}; }
  function safe(fn, fb) { try { return fn(); } catch (e) { return fb; } }
  function now() { return T.now(); }
  function fmtFull(d) { return T.fmt(d, 'full') + ' ' + T.fmt(d, 'time'); }
  function fmtOld(d) { return T.fmt(d, 'full') + ' ' + T.fmt(d, 'time'); }
  function locName(loc) {
    if (!loc) return '';
    if (typeof loc === 'string') return loc;
    return loc.name || loc.title || loc.address || '';
  }
  function isMeeting(title) {
    return /会|评审|汇报|沟通|电话|面试|约见|例会|讨论|洽谈|拜访/.test(String(title || ''));
  }
  function hours(min) { return Math.round((Number(min) || 0) / 6) / 10; }

  /* ---------------- 时间范围 ---------------- */
  function weekMonday(offset) {
    const n = now();
    const base = T.startOfDay(n);
    const dow = n.getDay();
    return T.startOfDay(T.addDays(base, -((dow + 6) % 7) + (Number(offset) || 0) * 7));
  }
  function weekRange(offset) {
    const start = weekMonday(offset);
    return { from: start, to: T.endOfDay(T.addDays(start, 6)) };
  }
  function monthRange(offset) {
    const n = now();
    const first = new Date(n.getFullYear(), n.getMonth() + (Number(offset) || 0), 1);
    const last = new Date(n.getFullYear(), n.getMonth() + (Number(offset) || 0) + 1, 0);
    return { from: T.startOfDay(first), to: T.endOfDay(last) };
  }
  function rangeOf(text) {
    const t = String(text || '');
    const n = now();
    if (/今天|今日|今儿/.test(t)) return { from: T.startOfDay(n), to: T.endOfDay(n), label: '今天' };
    if (/明天|明日/.test(t)) { const d = T.addDays(n, 1); return { from: T.startOfDay(d), to: T.endOfDay(d), label: '明天' }; }
    if (/后天/.test(t)) { const d = T.addDays(n, 2); return { from: T.startOfDay(d), to: T.endOfDay(d), label: '后天' }; }
    if (/上周|上星期|上礼拜/.test(t)) { const r = weekRange(-1); return { from: r.from, to: r.to, label: '上周' }; }
    if (/下周|下星期|下礼拜/.test(t)) { const r = weekRange(1); return { from: r.from, to: r.to, label: '下周' }; }
    if (/这周|本周|这一周|这礼拜/.test(t)) { const r = weekRange(0); return { from: r.from, to: r.to, label: '本周' }; }
    if (/上个月|上月/.test(t)) { const r = monthRange(-1); return { from: r.from, to: r.to, label: '上个月' }; }
    if (/下个月|下月/.test(t)) { const r = monthRange(1); return { from: r.from, to: r.to, label: '下个月' }; }
    if (/本月|这个月|这月/.test(t)) { const r = monthRange(0); return { from: r.from, to: r.to, label: '本月' }; }
    return null;
  }
  function schedulesBetween(from, to) {
    return safe(function () {
      const list = S().schedules ? (S().schedules({ from: from, to: to }) || []) : [];
      return list.filter(function (s) { return !s.deletedAt; });
    }, []);
  }
  function hashQuery() {
    const h = String(location.hash || '');
    const i = h.indexOf('?');
    const out = {};
    if (i < 0) return out;
    h.slice(i + 1).split('&').forEach(function (kv) {
      if (!kv) return;
      const p = kv.split('=');
      out[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
    });
    return out;
  }

  /* ---------------- 会话状态 ---------------- */
  const chat = { messages: [], draft: '', typing: false, seq: 0 };
  const undos = new Map();
  let chatTicker = null;

  function nextId() { chat.seq += 1; return 'm' + chat.seq + '_' + Math.floor(Math.random() * 999); }
  function addMsg(m) { m.id = m.id || nextId(); chat.messages.push(m); return m; }
  function pushUser(text) { addMsg({ role: 'user', text: text }); }
  function pushBot(text, card) { addMsg({ role: 'bot', text: text || '', card: card || null }); }
  function findMsg(id) {
    for (let i = 0; i < chat.messages.length; i++) {
      if (chat.messages[i].id === id) return chat.messages[i];
    }
    return null;
  }
  function ensureWelcome() {
    if (chat.messages.length) return;
    pushBot('你好，我是小行。我会看你的日程、账本和健康数据，帮你查安排、改日程、记一笔。', { type: 'guide' });
  }

  /* ---------------- 通用片段 ---------------- */
  function toneTag(type) {
    const map = { blue: 'tag--blue', orange: 'tag--orange', green: 'tag--green', red: 'tag--red', purple: 'tag--purple' };
    return 'tag ' + (map[type] || 'tag--blue');
  }

  function cardDone(c, title, text, extra) {
    const ent = c.undoKey ? undos.get(c.undoKey) : null;
    const active = !!(ent && ent.expiresAt > Date.now());
    let h = '<div class="ai-card ai-card--done">';
    h += '<div class="ai-done"><span class="ai-done-ic">' + IC('check', 18) + '</span><div class="ai-done-main"><div class="ai-done-t">' + E(title) + '</div>';
    if (text) h += '<div class="ai-done-s">' + E(text) + '</div>';
    h += '</div></div>';
    if (active) {
      h += '<div class="ai-acts"><button class="btn btn--sm btn--ghost" data-act="ai-undo" data-key="' + E(c.undoKey) + '">撤销 <span class="ai-undo-left"></span></button></div>';
    } else if (c.undoKey) {
      h += '<div class="ai-acts"><span class="ai-undo-dead">撤销窗口已关闭，可在变更记录中回滚</span></div>';
    }
    if (extra) h += extra;
    h += '</div>';
    return h;
  }

  function cardQuery(c) {
    const stats = (c.stats || []).map(function (s) {
      return '<div class="ai-stat"><b>' + E(s.v) + '</b><span>' + E(s.k) + '</span></div>';
    }).join('');
    const list = (c.list || []).map(function (it) {
      return '<div class="ai-ul-row"><span class="ai-ul-t">' + E(it.t) + '</span><span class="ai-ul-s">' + E(it.s) + '</span></div>';
    }).join('');
    const acts = (c.actions || []).map(function (a) {
      const attr = a.act === 'voice'
        ? 'data-act="ai-voice"'
        : 'data-act="ai-go" data-go="' + E(a.go || '#/ai') + '"';
      return '<button class="btn btn--sm ' + (a.kind === 'primary' ? 'btn--primary' : 'btn--ghost') + '" ' + attr + '>' + E(a.label) + '</button>';
    }).join('');
    let h = '<div class="ai-card">';
    h += '<div class="ai-card-top"><span class="' + toneTag(c.tone) + '">' + E(c.tag || '查询结果') + '</span></div>';
    h += '<div class="ai-card-t">' + E(c.title) + '</div>';
    if (c.sub) h += '<div class="ai-card-s">' + E(c.sub) + '</div>';
    if (stats) h += '<div class="ai-stats">' + stats + '</div>';
    if (list) h += '<div class="ai-ul">' + list + '</div>';
    if (acts) h += '<div class="ai-acts">' + acts + '</div>';
    h += '</div>';
    return h;
  }

  function cardChange(m) {
    const c = m.card;
    if (c.state === 'done') return cardDone(c, '已改期', c.doneText || '');
    if (c.state === 'cancelled') return cardDone(c, '已取消', '这次没有改动任何安排。');
    const tgt = S().getSchedule ? S().getSchedule(c.targetId) : null;
    if (!tgt) return cardDone(c, '安排已不存在', '这条安排可能已被删除。');
    const conflicts = safe(function () {
      return S().checkConflicts ? (S().checkConflicts({ start: c.start, end: c.end, location: tgt.location }, tgt.id) || []) : [];
    }, []);
    const hard = conflicts.filter(function (x) { return x.type === 'hard'; });
    let h = '<div class="ai-card">';
    h += '<div class="ai-card-top"><span class="' + toneTag('blue') + '">改期确认</span></div>';
    h += '<div class="ai-card-t">' + E(tgt.title) + '</div>';
    h += '<div class="ai-diff">';
    h += '<div class="ai-diff-row"><span class="ai-diff-k">原时间</span><span class="ai-diff-v">' + E(fmtOld(tgt.start)) + '–' + E(T.fmt(tgt.end, 'time')) + '</span></div>';
    h += '<div class="ai-diff-row"><span class="ai-diff-k">新时间</span><span class="ai-diff-v ai-diff-v--new">' + E(fmtFull(c.start)) + '–' + E(T.fmt(c.end, 'time')) + '</span></div>';
    const oldLoc = locName(tgt.location);
    if (c.location && c.location !== oldLoc) {
      h += '<div class="ai-diff-row"><span class="ai-diff-k">地点</span><span class="ai-diff-v">' + E(oldLoc || '未填写') + ' → ' + E(c.location) + '</span></div>';
    }
    h += '</div>';
    conflicts.slice(0, 2).forEach(function (cf) {
      h += '<div class="banner banner--' + (cf.level === 'red' ? 'red' : 'orange') + '">' + IC('alert', 18) + '<div>' + E(cf.message) + '</div></div>';
    });
    if (hard.length) {
      h += '<div class="ai-card-s">这个时段会和已有安排撞车，换到下面任一时段：</div>';
      h += '<div class="ai-acts">';
      (c.alt || []).forEach(function (a, i) {
        h += '<button class="btn btn--sm ' + (i === 0 ? 'btn--primary' : 'btn--ghost') + '" data-act="ai-act" data-msg="' + E(m.id) + '" data-key="alt:' + i + '">' + E(a.label) + '</button>';
      });
      h += '<button class="btn btn--sm btn--ghost" data-act="ai-act" data-msg="' + E(m.id) + '" data-key="cancel">取消</button>';
      h += '</div>';
    } else {
      h += '<div class="ai-acts">'
        + '<button class="btn btn--sm btn--primary" data-act="ai-act" data-msg="' + E(m.id) + '" data-key="confirm">确认改期</button>'
        + '<button class="btn btn--sm btn--ghost" data-act="ai-act" data-msg="' + E(m.id) + '" data-key="cancel">不做修改</button>'
        + '</div>';
    }
    h += '</div>';
    return h;
  }

  function cardCancel(m) {
    const c = m.card;
    if (c.state === 'done') return cardDone(c, '已取消', c.doneText || '');
    if (c.state === 'cancelled') return cardDone(c, '已保留', '这条安排没有被删除。');
    let h = '<div class="ai-card">';
    h += '<div class="ai-card-top"><span class="' + toneTag('orange') + '">取消确认</span></div>';
    h += '<div class="ai-card-t">' + E(c.title) + '</div>';
    h += '<div class="ai-diff"><div class="ai-diff-row"><span class="ai-diff-k">时间</span><span class="ai-diff-v">' + E(fmtOld(c.start)) + '–' + E(T.fmt(c.end, 'time')) + '</span></div></div>';
    h += '<div class="banner banner--orange">' + IC('alert', 18) + '<div>删除后会在日历中移除，10 秒内可以撤销。</div></div>';
    h += '<div class="ai-acts">'
      + '<button class="btn btn--sm btn--danger" data-act="ai-act" data-msg="' + E(m.id) + '" data-key="confirm">确认取消</button>'
      + '<button class="btn btn--sm btn--ghost" data-act="ai-act" data-msg="' + E(m.id) + '" data-key="keep">保留</button>'
      + '</div></div>';
    return h;
  }

  function cardExpense(m) {
    const c = m.card;
    if (c.state === 'done') return cardDone(c, '已记账', c.doneText || '');
    if (c.state === 'cancelled') return cardDone(c, '已取消', '这次没有记账。');
    let h = '<div class="ai-card">';
    h += '<div class="ai-card-top"><span class="' + toneTag('orange') + '">记账确认</span></div>';
    h += '<div class="ai-exp-amt">' + E(money(c.amount)) + '</div>';
    h += '<div class="ai-ul">'
      + '<div class="ai-ul-row"><span class="ai-ul-t">分类</span><span class="ai-ul-s">' + E(c.categoryName) + '</span></div>'
      + '<div class="ai-ul-row"><span class="ai-ul-t">时间</span><span class="ai-ul-s">' + E(T.fmt(c.occurredAt, 'full')) + ' ' + E(T.fmt(c.occurredAt, 'time')) + '</span></div>'
      + '<div class="ai-ul-row"><span class="ai-ul-t">备注</span><span class="ai-ul-s">' + E(c.note || '语音记账') + '</span></div>'
      + '</div>';
    h += '<div class="ai-acts">'
      + '<button class="btn btn--sm btn--primary" data-act="ai-act" data-msg="' + E(m.id) + '" data-key="confirm">确认记账</button>'
      + '<button class="btn btn--sm btn--ghost" data-act="ai-act" data-msg="' + E(m.id) + '" data-key="cancel">取消</button>'
      + '</div></div>';
    return h;
  }

  function cardHealth(m) {
    const c = m.card;
    if (c.state === 'done') return cardDone(c, '已记录', c.doneText || '', '<div class="ai-card-s">健康数据可在「健康」页继续调整。</div>');
    if (c.state === 'cancelled') return cardDone(c, '已取消', '这次没有记录。');
    let h = '<div class="ai-card">';
    h += '<div class="ai-card-top"><span class="' + toneTag('green') + '">健康打卡</span></div>';
    h += '<div class="ai-card-t">' + E(c.metricName) + ' ' + E(c.value) + ' ' + E(c.unit) + '</div>';
    h += '<div class="ai-card-s">记录到今天的健康节奏里，用于日程负荷评估。</div>';
    h += '<div class="ai-acts">'
      + '<button class="btn btn--sm btn--primary" data-act="ai-act" data-msg="' + E(m.id) + '" data-key="confirm">确认记录</button>'
      + '<button class="btn btn--sm btn--ghost" data-act="ai-act" data-msg="' + E(m.id) + '" data-key="cancel">取消</button>'
      + '</div></div>';
    return h;
  }

  function cardCreate(m) {
    const c = m.card;
    let h = '<div class="ai-card">';
    h += '<div class="ai-card-top"><span class="' + toneTag('blue') + '">新建安排</span></div>';
    h += '<div class="ai-card-t">用语音来记这件事</div>';
    if (c.when || c.title) {
      h += '<div class="ai-ul">';
      if (c.title) h += '<div class="ai-ul-row"><span class="ai-ul-t">名称</span><span class="ai-ul-s">' + E(c.title) + '</span></div>';
      if (c.when) h += '<div class="ai-ul-row"><span class="ai-ul-t">时间</span><span class="ai-ul-s">' + E(c.when) + '</span></div>';
      h += '</div>';
    }
    h += '<div class="ai-card-s">语音速记会给你一张可修改的确认卡，确认后才写入日程。</div>';
    h += '<div class="ai-acts">'
      + '<button class="btn btn--sm btn--primary" data-act="ai-voice">开始语音</button>'
      + '<button class="btn btn--sm btn--ghost" data-act="ai-go" data-go="#/schedule-edit">手动填写</button>'
      + '</div></div>';
    return h;
  }

  function cardGuide() {
    const examples = ['这周还有几个会', '今天都有什么安排', '把周五的评审挪到下周一上午', '打车 38', '本月花了多少', '今天走了 8000 步'];
    return '<div class="ai-card">'
      + '<div class="ai-card-t">你可以这样问</div>'
      + '<div class="ai-ul">'
      + examples.map(function (q) {
        return '<button class="ai-ul-row ai-ul-row--btn" data-act="ai-chip" data-q="' + E(q) + '"><span class="ai-ul-t">' + E(q) + '</span><span class="ai-ul-s">' + IC('arrow-right', 14) + '</span></button>';
      }).join('')
      + '</div>'
      + '<div class="ai-card-s">我只处理行程、日程、记账和健康相关的事，不聊别的。</div>'
      + '</div>';
  }

  function cardHtml(m) {
    const c = m.card || {};
    if (c.type === 'query') return cardQuery(c);
    if (c.type === 'change') return cardChange(m);
    if (c.type === 'cancel') return cardCancel(m);
    if (c.type === 'expense') return cardExpense(m);
    if (c.type === 'health') return cardHealth(m);
    if (c.type === 'create') return cardCreate(m);
    if (c.type === 'guide') return cardGuide();
    return '';
  }

  function msgHtml(m) {
    if (m.role === 'user') {
      return '<div class="ai-msg ai-msg--user"><div class="ai-bubble ai-bubble--user">' + E(m.text).replace(/\n/g, '<br>') + '</div></div>';
    }
    let h = '<div class="ai-msg"><span class="ai-ava" aria-hidden="true">行</span><div class="ai-msg-main">';
    if (m.text) h += '<div class="ai-bubble">' + E(m.text).replace(/\n/g, '<br>') + '</div>';
    if (m.card) h += cardHtml(m);
    h += '</div></div>';
    return h;
  }

  function typingHtml() {
    return '<div class="ai-msg"><span class="ai-ava" aria-hidden="true">行</span><div class="ai-bubble ai-typing"><i></i><i></i><i></i></div></div>';
  }

  function feedHtml() {
    return chat.messages.map(msgHtml).join('') + (chat.typing ? typingHtml() : '');
  }

  /* ---------------- 意图分发 ---------------- */
  function send(raw) {
    const text = String(raw === null || raw === undefined ? '' : raw).trim();
    if (!text || chat.typing) return;
    pushUser(text);
    chat.typing = true;
    chat.draft = '';
    renderFeed();
    window.setTimeout(function () {
      chat.typing = false;
      let res = null;
      try { res = TM.nlp && TM.nlp.parse ? TM.nlp.parse(text) : null; } catch (e) { res = null; }
      try { dispatch(res, text); } catch (e2) { pushBot('刚才没听明白，换个说法再试试？'); }
      renderFeed();
    }, 320);
  }

  function looksLikeChat(text) {
    return /[?？]|吗|呢|吧$|天气|笑话|你是谁|讲个|推荐一|怎么样|为什么|怎么办|吃什么好/.test(String(text || ''));
  }

  function dispatch(res, raw) {
    const intent = (res && res.intent) || 'unknown';
    const confidence = res && res.confidence != null ? res.confidence : 0.3;
    const slots = (res && res.slots) || {};
    if (intent === 'query') return handleQuery(res, raw);
    if (intent === 'update') return handleUpdate(res, raw);
    if (intent === 'cancel') return handleCancel(res, raw);
    if (intent === 'expense') return handleExpense(res, raw);
    if (intent === 'health') return handleHealth(res, raw);
    if (intent === 'create') {
      const chatty = looksLikeChat(raw);
      const noInfo = !slots.title && !slots.start;
      if (chatty || noInfo || confidence < 0.55) return handleUnknown(res, raw);
      return handleCreate(res, raw);
    }
    return handleUnknown(res, raw);
  }

  function handleQuery(res, raw) {
    const text = String(raw || '');
    const slots = (res && res.slots) || {};
    const topic = slots.topic || '';
    const explicit = rangeOf(text);
    let range = explicit;
    if (!range) {
      const key = slots.range && slots.range.key;
      if (key === 'today') { const n = now(); range = { from: T.startOfDay(n), to: T.endOfDay(n), label: '今天' }; }
      else if (key === 'nextweek') { const r = weekRange(1); range = { from: r.from, to: r.to, label: '下周' }; }
      else if (key === 'month') { const r = monthRange(0); range = { from: r.from, to: r.to, label: '本月' }; }
      else { const r = weekRange(0); range = { from: r.from, to: r.to, label: '本周' }; }
    }
    if (topic === 'expense' || /花|支出|消费|预算|账单|账本|开销/.test(text)) return queryLedger(range);
    if (topic === 'trip') {
      const trips = safe(function () { return S().trips ? (S().trips() || []) : []; }, []);
      const upcoming = trips.filter(function (t) { return T.parse(t.end).getTime() >= Date.now(); });
      pushBot('', {
        type: 'query', tag: '行程摘要', tone: 'blue',
        title: upcoming.length ? '还有 ' + upcoming.length + ' 个行程待出发' : '暂无待出发的行程',
        sub: upcoming.length ? '最近一个是' + upcoming[0].title + '（' + T.fmt(upcoming[0].start, 'full') + '）。' : '可以在行程页新建一次出行，账本和健康会自动归集。',
        stats: [
          { k: '进行中', v: String(upcoming.filter(function (t) { return t.status === 'ongoing'; }).length) },
          { k: '待出发', v: String(upcoming.length) },
          { k: '全部', v: String(trips.length) }
        ],
        list: upcoming.slice(0, 3).map(function (t) { return { t: t.title, s: T.fmt(t.start, 'md') + ' · ' + (t.destination || '') }; }),
        actions: [{ label: '打开行程', go: '#/trips', kind: 'primary' }]
      });
      return;
    }
    const list = schedulesBetween(range.from, range.to);
    if (!list.length) {
      pushBot('', {
        type: 'query', tag: '日程摘要', tone: 'green',
        title: range.label + '没有安排',
        sub: '这段时间是空的，要不要现在记一件？',
        actions: [
          { label: '语音速记', act: 'voice', kind: 'primary' },
          { label: '打开日历', go: '#/calendar/day/' + T.todayKey() }
        ]
      });
      return;
    }
    if (/会/.test(text)) {
      const meetingList = list.filter(function (s) { return isMeeting(s.title); });
      const upcoming = meetingList.filter(function (s) { return T.parse(s.end).getTime() >= Date.now(); });
      const items = upcoming.slice(0, 5).map(function (s) {
        return { t: T.fmt(s.start, 'weekday') + ' ' + T.fmt(s.start, 'time') + ' ' + s.title, s: locName(s.location) };
      });
      const totalMin = upcoming.reduce(function (a, s) { return a + Math.max(0, safe(function () { return T.diffMin(s.end, s.start); }, 0) || 0); }, 0);
      pushBot('', {
        type: 'query', tag: '会议摘要', tone: upcoming.length ? 'blue' : 'green',
        title: range.label + (upcoming.length ? '还有 ' + upcoming.length + ' 个会' : '没有待开的会了'),
        sub: upcoming.length
          ? '合计约 ' + hours(totalMin) + ' 小时，最近一场在 ' + T.fmt(upcoming[0].start, 'weekday') + ' ' + T.fmt(upcoming[0].start, 'time') + '。'
          : '这段时间共 ' + list.length + ' 个安排，会议都已结束。',
        stats: [
          { k: '待开会议', v: String(upcoming.length) },
          { k: '总安排', v: String(list.length) },
          { k: '会议占比', v: (list.length ? Math.round(meetingList.length / list.length * 100) : 0) + '%' }
        ],
        list: items,
        actions: [
          { label: '看周报', go: '#/weekly', kind: 'primary' },
          { label: '打开行程', go: '#/trips' }
        ]
      });
      return;
    }
    const meetings = list.filter(function (s) { return isMeeting(s.title); });
    const totalMin = list.reduce(function (a, s) { return a + Math.max(0, safe(function () { return T.diffMin(s.end, s.start); }, 0) || 0); }, 0);
    const load = safe(function () { return S().computeLoad ? S().computeLoad(T.key(range.from)) : null; }, null);
    const items = list.slice(0, 5).map(function (s) {
      return { t: T.fmt(s.start, 'time') + ' ' + s.title, s: locName(s.location) };
    });
    pushBot('', {
      type: 'query', tag: '日程摘要', tone: 'blue',
      title: range.label + '有 ' + list.length + ' 个安排',
      sub: '合计约 ' + hours(totalMin) + ' 小时' + (load ? '，日程负荷「' + load.level + '」' : '') + '。',
      stats: [
        { k: '总安排', v: String(list.length) },
        { k: '会议', v: String(meetings.length) },
        { k: '总时长', v: hours(totalMin) + 'h' }
      ],
      list: items,
      actions: [
        { label: '打开日历', go: '#/calendar/day/' + T.key(range.from), kind: 'primary' },
        { label: '查看周报', go: '#/weekly' }
      ]
    });
  }

  function queryLedger(range) {
    const sum = safe(function () { return S().monthSummary ? S().monthSummary() : null; }, null);
    if (!sum) {
      pushBot('账本数据现在读不到，去账本页看看？', { type: 'guide' });
      return;
    }
    const ratio = Math.round(Number(sum.ratio) || 0);
    const cats = (sum.byCategory || []).filter(function (c) { return c.spent > 0; }).slice(0, 3)
      .map(function (c) { return { t: c.name, s: money(c.spent) }; });
    const label = range && range.label && range.label !== '今天' ? range.label : '本月';
    pushBot('', {
      type: 'query', tag: '账本摘要', tone: ratio >= 80 ? 'orange' : 'blue',
      title: label + '已支出 ' + money(sum.expense),
      sub: '预算已用 ' + ratio + '%' + (ratio >= 100 ? '，已经超支，建议看看主要支出。' : (ratio >= 80 ? '，接近预算上限。' : '，还有余量。')),
      stats: [
        { k: '预算', v: money(sum.budget) },
        { k: '结余', v: money((Number(sum.income) || 0) - (Number(sum.expense) || 0)) },
        { k: '已用', v: ratio + '%' }
      ],
      list: cats,
      actions: [
        { label: '打开账本', go: '#/ledger', kind: 'primary' },
        { label: '看报表', go: '#/report' }
      ]
    });
  }

  function cleanTitle(s) { return String(s || '').replace(/[「」""''《》]/g, '').trim(); }
  function weekdayInText(raw) {
    const m = String(raw || '').match(/(?:周|星期|礼拜)([一二三四五六日天])/);
    if (!m) return null;
    const map = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 0, '天': 0 };
    return map[m[1]];
  }
  function findScheduleFor(res, raw) {
    const slots = (res && res.slots) || {};
    const title = cleanTitle((res && res.targetTitle) || slots.title);
    const n = now();
    const list = schedulesBetween(T.addDays(T.startOfDay(n), -7), T.addDays(T.endOfDay(n), 45));
    if (title) {
      const key = title.replace(/[把将的改挪到取消重新安排一下]/g, '');
      const hit = list.filter(function (s) {
        const t = cleanTitle(s.title);
        if (!t) return false;
        return t === title
          || (key && (t.indexOf(key) >= 0 || key.indexOf(t) >= 0))
          || t.indexOf(title) >= 0 || title.indexOf(t) >= 0;
      });
      if (hit.length) {
        const future = hit.filter(function (s) { return T.parse(s.start).getTime() >= T.startOfDay(n).getTime(); });
        return future[0] || hit[0];
      }
    }
    const wd = weekdayInText(raw);
    if (wd !== null) {
      const hit2 = list.filter(function (s) {
        const d = T.parse(s.start);
        return d.getDay() === wd && d.getTime() >= T.startOfDay(n).getTime();
      });
      if (hit2.length) return hit2[0];
    }
    return null;
  }

  function handleUpdate(res, raw) {
    const slots = (res && res.slots) || {};
    const tgt = findScheduleFor(res, raw);
    if (!tgt) {
      pushBot('没找到「' + (cleanTitle(res.targetTitle || slots.title) || '那条') + '」这条安排，可能名称和日期对不上。可以说得更具体一点，比如“把周四的评审挪到周五上午”。', { type: 'guide' });
      return;
    }
    if (!slots.start) {
      pushBot('我知道你要改「' + tgt.title + '」，但没听清改到什么时候。可以说“改到周四上午”，或直接说日期和时间。', { type: 'guide' });
      return;
    }
    const dur = Math.max(15, safe(function () { return T.diffMin(tgt.end, tgt.start); }, 60) || 60);
    const start = T.parse(slots.start);
    const end = T.addMin(start, dur);
    if (T.parse(tgt.start).getTime() === start.getTime()) {
      pushBot('「' + tgt.title + '」本来就在 ' + fmtFull(tgt.start) + '，时间没有变化。');
      return;
    }
    const conflicts = safe(function () {
      return S().checkConflicts ? (S().checkConflicts({ start: start, end: end, location: tgt.location }, tgt.id) || []) : [];
    }, []);
    const hard = conflicts.filter(function (c) { return c.type === 'hard'; });
    let alt = [];
    if (hard.length) {
      alt = safe(function () {
        return (S().suggestSlots({ dateKey: T.key(start), start: start, end: end, excludeId: tgt.id, count: 2 }) || []).map(function (g) {
          return { start: g.start, end: g.end, label: g.label || (T.fmt(g.start, 'time') + '–' + T.fmt(g.end, 'time')) };
        });
      }, []);
    }
    pushBot('', {
      type: 'change', targetId: tgt.id, title: tgt.title,
      start: start, end: end, location: locName(slots.location), conflicts: conflicts, alt: alt
    });
  }

  function handleCancel(res, raw) {
    const tgt = findScheduleFor(res, raw);
    if (!tgt) {
      pushBot('没找到要取消的安排，名称和日期能再具体一点吗？', { type: 'guide' });
      return;
    }
    pushBot('', { type: 'cancel', targetId: tgt.id, title: tgt.title, start: tgt.start, end: tgt.end });
  }

  function merchantOf(raw, fallback) {
    const t = String(raw || '').replace(/[\d.,，。元块¥\s]/g, '').replace(/[记一笔记账帮我块元]/g, '');
    return t ? t.slice(0, 12) : fallback;
  }

  function handleExpense(res, raw) {
    const slots = (res && res.slots) || {};
    let amount = Number(slots.amount);
    if (!amount || !isFinite(amount) || amount <= 0) {
      const m = String(raw || '').match(/(\d+(?:\.\d+)?)/);
      amount = m ? Number(m[1]) : 0;
    }
    if (!amount) {
      pushBot('这笔花了多少？比如“打车 38”。', { type: 'guide' });
      return;
    }
    const catName = (function () {
      const name = String(slots.category || '');
      if (name) return name;
      if (/打车|出租|地铁|公交|高铁|机票|加油|停车|交通|滴滴|车费/.test(raw)) return '交通';
      if (/餐|饭|咖啡|奶茶|早餐|午餐|晚餐|吃|下午茶/.test(raw)) return '餐饮';
      if (/酒店|住宿|民宿|房费/.test(raw)) return '住宿';
      if (/买|购物|衣服|超市|网购|商场/.test(raw)) return '购物';
      if (/电影|娱乐|唱歌|游戏|演出|门票|健身/.test(raw)) return '娱乐';
      return '其他';
    })();
    pushBot('', {
      type: 'expense', amount: amount, category: catName, categoryName: catName,
      occurredAt: slots.occurredAt || now(),
      note: String(raw || '').slice(0, 30),
      merchant: slots.merchant || slots.title || merchantOf(raw, catName)
    });
  }

  function handleHealth(res, raw) {
    const slots = (res && res.slots) || {};
    const text = String(raw || '');
    const labels = { steps: '步数', water: '饮水', sleep: '睡眠', stand: '站立' };
    const units = { steps: '步', water: 'ml', sleep: '小时', stand: '分钟' };
    let type = slots.metric || '';
    if (!labels[type]) {
      if (/步/.test(text)) type = 'steps';
      else if (/水|喝/.test(text)) type = 'water';
      else if (/睡/.test(text)) type = 'sleep';
      else if (/站|久坐/.test(text)) type = 'stand';
    }
    if (!labels[type]) {
      pushBot('想记录哪项健康数据？步数、饮水、睡眠还是站立？', { type: 'guide' });
      return;
    }
    let value = Number(slots.amount != null ? slots.amount : slots.value);
    if (!value || !isFinite(value)) {
      const m = text.match(/(\d+(?:\.\d+)?)/);
      value = m ? Number(m[1]) : 0;
    }
    if (!value) {
      pushBot('具体是多少？比如“今天走了 8000 步”。', { type: 'guide' });
      return;
    }
    if (type === 'sleep' && value > 24) value = Math.round(value / 60 * 10) / 10;
    pushBot('', { type: 'health', metric: type, metricName: labels[type], value: value, unit: units[type] });
  }

  function startVoice(mode) {
    const m = mode === 'expense' || mode === 'health' ? mode : 'create';
    if (TM.voice && typeof TM.voice.start === 'function') {
      TM.voice.start(m);
    } else {
      toast('语音入口暂时不可用，可以先手动填写');
    }
  }

  function handleCreate(res, raw) {
    const slots = (res && res.slots) || {};
    pushBot('这件事我用语音速记来建，确认卡里可以再改时间地点。', {
      type: 'create', title: slots.title || '',
      when: (res && res.normalized) || (slots.start ? fmtFull(slots.start) : '')
    });
    window.setTimeout(function () {
      if (location.hash.indexOf('#/ai') === 0) startVoice('create');
    }, 420);
  }

  function handleUnknown(res, raw) {
    const text = String(raw || '');
    let lead = '这个不在我的范围内。我是行程管家的小行，只处理行程、日程、记账和健康相关的事。';
    if (/你是谁|能做什么/.test(text)) lead = '我是小行，行程管家的 AI 管家：会看日程、给建议、也能代你执行确认过的操作。';
    pushBot(lead, { type: 'guide' });
  }

  /* ---------------- 卡片动作 ---------------- */
  function changeAct(m, key) {
    const c = m.card;
    if (key === 'cancel') { c.state = 'cancelled'; renderFeed(); return; }
    const tgt = S().getSchedule ? S().getSchedule(c.targetId) : null;
    if (!tgt) { c.state = 'done'; c.doneText = '这条安排已经不存在了。'; renderFeed(); return; }
    let start = c.start;
    let end = c.end;
    if (key.indexOf('alt:') === 0) {
      const alt = (c.alt || [])[Number(key.slice(4))];
      if (alt) { start = alt.start; end = alt.end; }
    }
    const oldStart = tgt.start;
    const oldEnd = tgt.end;
    const ok = safe(function () {
      if (!S().updateSchedule) return false;
      S().updateSchedule(c.targetId, { start: start, end: end });
      return true;
    }, false);
    if (!ok) { toast('改期失败，请稍后重试'); return; }
    c.state = 'done';
    c.doneText = '「' + tgt.title + '」调整到 ' + fmtFull(start) + '。';
    const undoKey = 'u' + nextId();
    undos.set(undoKey, {
      expiresAt: Date.now() + 10000,
      fn: function () {
        safe(function () { if (S().updateSchedule) S().updateSchedule(c.targetId, { start: oldStart, end: oldEnd }); }, null);
      }
    });
    c.undoKey = undoKey;
    toast('已改期');
    renderFeed();
  }

  function cancelAct(m, key) {
    const c = m.card;
    if (key === 'keep') { c.state = 'cancelled'; renderFeed(); return; }
    const tgt = S().getSchedule ? S().getSchedule(c.targetId) : null;
    if (!tgt) { c.state = 'done'; c.doneText = '这条安排已经不存在了。'; renderFeed(); return; }
    const snapshot = {
      title: tgt.title, start: tgt.start, end: tgt.end,
      location: tgt.location, participants: tgt.participants,
      category: tgt.category, note: tgt.note, tripId: tgt.tripId, source: 'ai'
    };
    const ok = safe(function () {
      if (!S().removeSchedule) return false;
      S().removeSchedule(c.targetId);
      return true;
    }, false);
    if (!ok) { toast('取消失败，请稍后重试'); return; }
    c.state = 'done';
    c.doneText = '「' + tgt.title + '」已从日历移除。';
    const undoKey = 'u' + nextId();
    undos.set(undoKey, {
      expiresAt: Date.now() + 10000,
      fn: function () { safe(function () { if (S().addSchedule) S().addSchedule(snapshot); }, null); }
    });
    c.undoKey = undoKey;
    toast('已取消');
    renderFeed();
  }

  function expenseAct(m, key) {
    const c = m.card;
    if (key === 'cancel') { c.state = 'cancelled'; renderFeed(); return; }
    const tx = safe(function () {
      if (!S().addTransaction) return null;
      return S().addTransaction({
        amount: c.amount, category: c.category, occurredAt: c.occurredAt,
        merchant: c.merchant, note: c.note, source: 'voice'
      });
    }, null);
    if (!tx) { toast('记账失败，请稍后重试'); return; }
    c.state = 'done';
    c.doneText = money(c.amount) + ' · ' + c.categoryName + ' 已记入账本。';
    const undoKey = 'u' + nextId();
    undos.set(undoKey, {
      expiresAt: Date.now() + 10000,
      fn: function () { safe(function () { if (S().removeTransaction) S().removeTransaction(tx.id); }, null); }
    });
    c.undoKey = undoKey;
    toast('已记账');
    renderFeed();
  }

  function healthAct(m, key) {
    const c = m.card;
    if (key === 'cancel') { c.state = 'cancelled'; renderFeed(); return; }
    const oldVal = safe(function () {
      const h = S().health ? S().health() : null;
      if (!h || !h.metrics) return null;
      return h.metrics[c.metric];
    }, null);
    const ok = safe(function () {
      if (!S().logHealthMetric) return false;
      S().logHealthMetric(c.metric, c.value);
      return true;
    }, false);
    if (!ok) { toast('记录失败，请稍后重试'); return; }
    c.state = 'done';
    c.doneText = c.metricName + ' ' + c.value + ' ' + c.unit + ' 已记录。';
    if (oldVal !== null && oldVal !== undefined) {
      const undoKey = 'u' + nextId();
      undos.set(undoKey, {
        expiresAt: Date.now() + 10000,
        fn: function () { safe(function () { if (S().logHealthMetric) S().logHealthMetric(c.metric, oldVal); }, null); }
      });
      c.undoKey = undoKey;
    }
    toast('已记录');
    renderFeed();
  }

  function onCardAct(msgId, key) {
    const m = findMsg(msgId);
    if (!m || !m.card) return;
    const c = m.card;
    if (c.type === 'change') return changeAct(m, key);
    if (c.type === 'cancel') return cancelAct(m, key);
    if (c.type === 'expense') return expenseAct(m, key);
    if (c.type === 'health') return healthAct(m, key);
  }

  function undoByKey(key) {
    const ent = undos.get(key);
    if (!ent || ent.expiresAt <= Date.now()) { toast('撤销窗口已关闭'); return; }
    undos.delete(key);
    safe(function () { ent.fn(); }, null);
    toast('已撤销');
    renderFeed();
  }

  /* ---------------- 对话页 ---------------- */
  function feedEl() { return document.querySelector('[data-ai-feed]'); }
  function scrollBottom() {
    const f = feedEl();
    if (!f) return;
    const box = f.closest('.scr-body--fill') || f.parentElement;
    if (box) { try { box.scrollTop = box.scrollHeight; } catch (e) { /* ignore */ } }
    try { f.scrollTop = f.scrollHeight; } catch (e2) { /* ignore */ }
  }
  function renderFeed() {
    const f = feedEl();
    if (!f) return;
    f.innerHTML = feedHtml();
    scrollBottom();
  }

  function aiCount() {
    return safe(function () {
      return (S().suggestions ? (S().suggestions() || []) : []).length;
    }, 0);
  }

  function heroHtml() {
    const n = aiCount();
    return '<div class="ai-top">'
      + '<div class="ai-hero">'
      + '<span class="ai-avatar" aria-hidden="true">' + IC('spark', 22) + '</span>'
      + '<div class="ai-hero-main"><div class="ai-hero-t">小行</div><div class="ai-hero-s">会看日程的私人助理</div></div>'
      + '<button class="ai-hero-btn" data-act="ai-clear" aria-label="开启新对话" title="新对话">' + IC('repeat', 18) + '</button>'
      + '</div>'
      + '<div class="ai-entries">'
      + '<button class="ai-entry" data-act="ai-go" data-go="#/suggestions"><span class="ai-entry-ic">' + IC('spark', 18) + '</span><span class="ai-entry-t">建议中心</span><span class="ai-entry-s">' + (n ? n + ' 条待处理' : '暂无新建议') + '</span></button>'
      + '<button class="ai-entry" data-act="ai-go" data-go="#/weekly"><span class="ai-entry-ic">' + IC('chart', 18) + '</span><span class="ai-entry-t">周报复盘</span><span class="ai-entry-s">本周完成与建议</span></button>'
      + '<button class="ai-entry" data-act="ai-voice"><span class="ai-entry-ic">' + IC('mic', 18) + '</span><span class="ai-entry-t">语音速记</span><span class="ai-entry-s">说一句就记下</span></button>'
      + '</div>'
      + '</div>';
  }

  function composerHtml() {
    const chips = ['这周还有几个会', '今天的安排', '打车 38', '把周四的评审挪到周五上午', '本月花了多少', '今天走了 8000 步'];
    return '<div class="ai-composer">'
      + '<div class="chips ai-chips">' + chips.map(function (q) {
        return '<button class="chip ai-chip-q" data-act="ai-chip" data-q="' + E(q) + '">' + E(q) + '</button>';
      }).join('') + '</div>'
      + '<form class="ai-form" data-ai-form>'
      + '<input class="input ai-input" data-ai-input maxlength="60" autocomplete="off" placeholder="问小行点什么，或说“打车 38”" aria-label="对小行说的话">'
      + '<button class="ai-send" type="submit" aria-label="发送">' + IC('arrow-up', 20) + '</button>'
      + '</form>'
      + '</div>';
  }

  function renderAi() {
    ensureWelcome();
    return '<section class="screen screen--fill ai-screen">'
      + TM.ui.head({ title: '小行', back: false })
      + '<div class="scr-body scr-body--fill ai-body">'
      + heroHtml()
      + '<div class="ai-feed" data-ai-feed>' + feedHtml() + '</div>'
      + '</div>'
      + composerHtml()
      + '</section>';
  }

  function startChatTicker() {
    if (chatTicker) return;
    chatTicker = window.setInterval(function () {
      if (location.hash.indexOf('#/ai') !== 0) {
        window.clearInterval(chatTicker);
        chatTicker = null;
        return;
      }
      const nodes = document.querySelectorAll('[data-ai-feed] [data-act="ai-undo"]');
      for (let i = 0; i < nodes.length; i++) {
        const key = nodes[i].getAttribute('data-key');
        const ent = undos.get(key);
        if (!ent) continue;
        const left = Math.ceil((ent.expiresAt - Date.now()) / 1000);
        const span = nodes[i].querySelector('.ai-undo-left');
        if (left <= 0) {
          undos.delete(key);
          const wrap = nodes[i].parentElement;
          if (wrap) wrap.innerHTML = '<span class="ai-undo-dead">撤销窗口已关闭</span>';
        } else if (span) {
          span.textContent = '(' + left + 's)';
        }
      }
    }, 1000);
  }

  function mountAi(root) {
    ensureWelcome();
    scrollBottom();
    const input = root.querySelector('[data-ai-input]');
    const form = root.querySelector('[data-ai-form]');
    if (input) {
      input.value = chat.draft || '';
      input.addEventListener('input', function () { chat.draft = input.value; });
    }
    if (form) {
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        const v = input ? input.value : '';
        if (input) input.value = '';
        chat.draft = '';
        send(v);
      });
    }
    root.addEventListener('click', function (e) {
      const el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el) return;
      const act = el.dataset.act;
      if (act === 'ai-go') { TM.ui.go(el.dataset.go || '#/ai'); return; }
      if (act === 'ai-chip') { send(el.dataset.q || ''); return; }
      if (act === 'ai-voice') { startVoice('create'); return; }
      if (act === 'ai-act') { onCardAct(el.dataset.msg, el.dataset.key); return; }
      if (act === 'ai-undo') { undoByKey(el.dataset.key); return; }
      if (act === 'ai-clear') {
        chat.messages = [];
        chat.draft = '';
        undos.clear();
        ensureWelcome();
        TM.ui.refresh();
        return;
      }
    });
    startChatTicker();
  }

  /* ---------------- 建议中心 ---------------- */
  const sugState = { adopted: {}, timer: null };
  const SUG_TYPE = { conflict: '冲突消解', schedule: '日程体检', commute: '通勤优化', budget: '费用提醒', health: '健康节奏', weekly: '周复盘' };

  function sugTypeName(t) { return SUG_TYPE[t] || '小行建议'; }
  function sugTarget(type) {
    if (type === 'budget') return '#/budgets';
    if (type === 'weekly') return '#/weekly';
    if (type === 'health') return '#/health';
    if (type === 'commute') return '#/calendar/week/' + T.todayKey();
    return '#/calendar/week/' + T.todayKey();
  }

  function adoptedCard(a) {
    const left = Math.max(0, Math.ceil((a.expireAt - Date.now()) / 1000));
    return '<div class="card ai-sug ai-sug--done">'
      + '<div class="ai-done"><span class="ai-done-ic">' + IC('check', 18) + '</span><div class="ai-done-main"><div class="ai-done-t">已调整</div><div class="ai-done-s">' + E(a.message) + '</div></div></div>'
      + '<div class="ai-sug-undo">'
      + (left > 0
        ? '<button class="btn btn--sm btn--ghost" data-act="sug-undo" data-id="' + E(a.id) + '">撤销 <span class="ai-undo-left" data-sug-left="' + E(a.id) + '">(' + left + 's)</span></button>'
        : '<span class="ai-undo-dead">撤销窗口已关闭，可在日程变更记录中回滚</span>')
      + '</div>'
      + '</div>';
  }

  function suggestionCard(s) {
    const acts = (s.actions || []).filter(function (a) {
      /* 「忽略 / 不再提示」统一收到卡片右下角，避免与动作按钮重复 */
      return !/^忽略$|不再提示/.test(String(a.label || '').trim());
    });
    const actHtml = acts.map(function (a, i) {
      return '<button class="btn btn--sm ' + (i === 0 ? 'btn--primary' : 'btn--ghost') + '" data-act="sug-do" data-id="' + E(s.id) + '" data-kind="' + E(a.kind || '') + '" data-i="' + i + '" data-label="' + E(a.label || '') + '">' + E(a.label) + '</button>';
    }).join('');
    return '<div class="card ai-sug">'
      + '<div class="ai-sug-top"><span class="' + toneTag(s.tone) + '">' + E(sugTypeName(s.type)) + '</span></div>'
      + '<div class="ai-sug-t">' + E(s.title) + '</div>'
      + (s.reason ? '<div class="ai-sug-r"><span class="ai-sug-k">理由</span>' + E(s.reason) + '</div>' : '')
      + (s.impact ? '<div class="ai-sug-r"><span class="ai-sug-k">影响</span>' + E(s.impact) + '</div>' : '')
      + (actHtml ? '<div class="ai-sug-acts">' + actHtml + '</div>' : '')
      + '<div class="ai-sug-foot">'
      + '<button class="ai-link" data-act="sug-do" data-id="' + E(s.id) + '" data-kind="ignore" data-i="-1" data-label="忽略">忽略</button>'
      + '<button class="ai-link" data-act="sug-do" data-id="' + E(s.id) + '" data-kind="forever" data-i="-1" data-label="不再提示">不再提示此类</button>'
      + '</div>'
      + '</div>';
  }

  function renderSuggestions() {
    const list = safe(function () { return S().suggestions ? (S().suggestions() || []) : []; }, []);
    const adopted = Object.keys(sugState.adopted).map(function (id) {
      const a = sugState.adopted[id];
      return { id: id, message: a.message, expireAt: a.expireAt };
    });
    const cards = adopted.map(adoptedCard).join('') + list.map(suggestionCard).join('');
    const body = cards
      ? cards
      : TM.ui.empty('spark', '暂无新建议', '小行会在发现冲突、超支或负荷偏高时提醒你。你也可以直接问小行。', '<button class="btn btn--primary btn--sm" data-act="sug-go" data-go="#/ai">去和小行聊聊</button>');
    return '<section class="screen">'
      + TM.ui.head({ title: '建议中心', back: true, right: '<button class="btn btn--sm btn--ghost" data-act="sug-go" data-go="#/weekly">周报</button>' })
      + '<div class="scr-body">'
      + '<div class="banner banner--blue">' + IC('spark', 18) + '<div>小行只给建议，采纳前不会改动任何安排；每次采纳都可在 <b>10 秒</b>内撤销。</div></div>'
      + body
      + '<div class="ai-note">' + IC('shield', 14) + ' 每日主动建议不超过 3 条，夜间 22:00—08:00 静默，避免打扰。</div>'
      + '</div></section>';
  }

  function ignoreSug(id, forever) {
    safe(function () { if (S().ignoreSuggestion) S().ignoreSuggestion(id, forever); }, null);
    toast(forever ? '已关闭此类建议' : '已忽略这条建议');
    TM.ui.refresh();
  }

  function adoptSug(id) {
    const r = safe(function () {
      return S().adoptSuggestion ? S().adoptSuggestion(id) : { ok: false, message: '暂时无法采纳' };
    }, { ok: false, message: '暂时无法采纳' });
    if (!r || r.ok === false) {
      toast((r && r.message) || '这条建议暂时无法执行');
      return;
    }
    if (r.route) {
      toast(r.message || '已处理');
      window.setTimeout(function () { TM.ui.go(r.route); }, 260);
      return;
    }
    sugState.adopted[id] = { id: id, token: r.undoToken, message: r.message || '已按建议完成调整', expireAt: Date.now() + 10000 };
    toast(r.message || '已调整');
    TM.ui.refresh();
  }

  function navBySug(id) {
    const list = safe(function () { return S().suggestions ? (S().suggestions() || []) : []; }, []);
    const s = list.filter(function (x) { return String(x.id) === String(id); })[0];
    TM.ui.go(s ? sugTarget(s.type) : '#/suggestions');
  }

  function sugDo(id, kind, index, label) {
    const lab = String(label || '');
    if (kind === 'forever' || /不再提示/.test(lab)) {
      TM.ui.confirm({ title: '不再提示此类建议？', body: '之后不会主动推送这类建议，已安排的日程不受影响。可在「设置」中恢复。', confirmText: '不再提示' }).then(function (ok) {
        if (ok) ignoreSug(id, true);
      });
      return;
    }
    if (kind === 'ignore' || /忽略|标记合理|暂不查看/.test(lab)) { ignoreSug(id, false); return; }
    if (/查看|详情|打开/.test(lab)) { navBySug(id); return; }
    if (Number(index) === 0 || /改期|优化|提醒|插入|处理|安排/.test(lab)) { adoptSug(id); return; }
    adoptSug(id);
  }

  function undoAdopt(id) {
    const a = sugState.adopted[id];
    if (!a || a.expireAt <= Date.now()) {
      delete sugState.adopted[id];
      toast('撤销窗口已关闭');
      TM.ui.refresh();
      return;
    }
    const ok = safe(function () { return !!(S().undoAdopt && S().undoAdopt(a.token)); }, false);
    delete sugState.adopted[id];
    toast(ok ? '已撤销，安排恢复原样' : '撤销失败，可在日程变更记录中回滚');
    TM.ui.refresh();
  }

  function startSugTicker() {
    if (sugState.timer) return;
    sugState.timer = window.setInterval(function () {
      if (location.hash.indexOf('#/suggestions') !== 0) {
        window.clearInterval(sugState.timer);
        sugState.timer = null;
        return;
      }
      let needRefresh = false;
      Object.keys(sugState.adopted).forEach(function (id) {
        const a = sugState.adopted[id];
        const left = Math.ceil((a.expireAt - Date.now()) / 1000);
        const span = document.querySelector('[data-sug-left="' + id + '"]');
        if (left <= 0) {
          if (!a.done) { a.done = true; needRefresh = true; }
        } else if (span) {

  /* ---------------- 周报复盘 ---------------- */
  function weeklyData(offset) {
    const r = weekRange(offset);
    const list = schedulesBetween(r.from, r.to);
    const n = now();
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = T.addDays(r.from, i);
      const k = T.key(d);
      const items = list.filter(function (s) { return T.key(s.start) === k; });
      const min = items.reduce(function (a, s) { return a + Math.max(0, safe(function () { return T.diffMin(s.end, s.start); }, 0) || 0); }, 0);
      days.push({ key: k, date: d, count: items.length, minutes: min });
    }
    let done = 0;
    let meetings = 0;
    let minutes = 0;
    list.forEach(function (s) {
      const end = T.parse(s.end || s.start);
      if (end.getTime() <= n.getTime() || s.status === 'done') done += 1;
      if (isMeeting(s.title)) meetings += 1;
      minutes += Math.max(0, safe(function () { return T.diffMin(s.end, s.start); }, 0) || 0);
    });
    const prevList = schedulesBetween(weekRange(Number(offset) - 1).from, weekRange(Number(offset) - 1).to);
    const prev = prevList.length;
    let delta = null;
    if (prev > 0) delta = Math.round((list.length - prev) / prev * 100);
    let busiest = days[0];
    let quietest = days[0];
    days.forEach(function (d) {
      if (d.count > busiest.count) busiest = d;
      if (d.count < quietest.count) quietest = d;
    });
    return {
      list: list, total: list.length, done: done, meetings: meetings, minutes: minutes,
      days: days, prev: prev, delta: delta, busiest: busiest, quietest: quietest,
      ratio: list.length ? Math.round(meetings / list.length * 100) : 0,
      donePct: list.length ? Math.round(done / list.length * 100) : 0
    };
  }

  function nextWeekTips(data) {
    const tips = [];
    if (data.ratio >= 40) tips.push('会议占比 ' + data.ratio + '%，下周试着把 2 场例会合并成 1 场，能省出约 1 小时连续时间。');
    if (data.busiest.count >= 5) {
      tips.push(T.fmt(data.busiest.date, 'weekday') + '最忙（' + data.busiest.count + ' 项），把可移动的沟通挪到' + T.fmt(data.quietest.date, 'weekday') + '，整周负荷会更均匀。');
    }
    const sum = safe(function () { return S().monthSummary ? S().monthSummary() : null; }, null);
    if (sum && Number(sum.ratio) >= 80) tips.push('本月预算已用 ' + Math.round(Number(sum.ratio)) + '%，下周出行优先选公共交通或拼车。');
    const load = safe(function () { return S().computeLoad ? S().computeLoad(T.todayKey()) : null; }, null);
    if (load && (load.level === '偏高' || load.level === '过载')) tips.push('今天负荷「' + load.level + '」，下周在 20:00 后给自己留一个 1 小时的休息块。');
    if (!tips.length) tips.push('节奏不错，保持每天不超过 5 项安排，给临时变化留出缓冲。');
    return tips.slice(0, 3);
  }

    const q = hashQuery();

    const deltaText = data.delta === null ? '上周没有安排' : (data.delta > 0 ? '+' + data.delta + '%' : String(data.delta) + '%');
    const tips = nextWeekTips(data).map(function (t, i) {
      return '<div class="ai-tip-row"><span class="ai-tip-n">' + (i + 1) + '</span><div class="ai-tip-tx">' + E(t) + '</div></div>';

    return '<section class="screen">'

      + '<div class="ai-week-hero-main">'

      + '<div class="ai-card-s">共 ' + data.total + ' 个安排，约 ' + hours(data.minutes) + ' 小时；会议占比 ' + data.ratio + '%。</div>'
      + '<div class="ai-week-tags">'

      + '<div class="ai-acts ai-week-acts">'

      + '<button class="btn btn--primary btn--sm" data-act="ai-go" data-go="#/ai">让小行排下周</button>'
      + '</div>'
      + '</div></section>';
  }

  function mountWeekly(root) {
    root.addEventListener('click', function (e) {
      const el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el) return;
      const act = el.dataset.act;

  /* ---------------- 注册 ---------------- */
  TM.screens.register('ai', {

  TM.screens.register('weekly', {
    route: /^#\/weekly(?:\?.*)?$/i,

    render: renderWeekly,

  });
})();
