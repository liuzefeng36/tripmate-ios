  function buildRepeatFromForm(start) {
    const typeEl = document.getElementById('tr-f-repeat');
    const type = typeEl ? typeEl.value : 'none';
    if (!type || type === 'none') return null;
    const out = { type: type };
    if (type === 'weekly') {
      const chips = document.querySelectorAll('#tr-f-wd .chip--on');
      const days = [];
      Array.prototype.forEach.call(chips, function (c) { days.push(Number(c.dataset.wd)); });
      out.days = days.length ? days : [start.getDay()];
    } else if (type === 'monthly') {
      out.day = start.getDate();
    } else if (type === 'custom') {
      const intervalEl = document.getElementById('tr-f-interval');
      out.interval = intervalEl ? Math.max(1, Number(intervalEl.value) || 1) : 1;
    }
    const untilType = (document.getElementById('tr-f-untiltype') || {}).value || 'never';
    if (untilType === 'date') {
      const v = (document.getElementById('tr-f-untildate') || {}).value;
      if (v) out.until = T.at(v, '23:59');
    } else if (untilType === 'count') {
      const v = (document.getElementById('tr-f-untilcount') || {}).value;
      out.count = Math.max(2, Number(v) || 10);
    }
    return out;
  }

  function collectForm() {
    const title = (valOf('tr-f-title') || '').trim();
    const dateKey = valOf('tr-f-date') || T.todayKey();
    const allDayEl = document.getElementById('tr-f-allday');
    const allDay = !!(allDayEl && allDayEl.getAttribute('aria-checked') === 'true');
    let start = T.at(dateKey, allDay ? '00:00' : (valOf('tr-f-start') || '09:00'));
    let end = T.at(dateKey, allDay ? '23:59' : (valOf('tr-f-end') || '10:00'));
    if (+end <= +start) end = T.addMin(start, 60);
    const peopleRaw = valOf('tr-f-people') || '';
    const on = {};
    Array.prototype.forEach.call(document.querySelectorAll('#tr-f-rem .chip--on'), function (c) {
      on[c.dataset.rem] = true;
    });
    return {
      title: title,
      start: start,
      end: end,
      allDay: allDay,
      location: (valOf('tr-f-loc') || '').trim(),
      participants: peopleRaw.split(/[，,、\s]+/).map(function (x) { return x.trim(); }).filter(Boolean),
      tripId: valOf('tr-f-trip') || null,
      category: valOf('tr-f-cat') || 'work',
      note: (valOf('tr-f-note') || '').trim(),
      repeat: buildRepeatFromForm(start),
      reminder: {
        advance: on.normal ? 15 : null,
        departure: !!on.depart,
        geo: !!on.geo,
        second: !!on.second,
        daily: !!on.daily
      }
    };
  }

  TM.screens.register('schedule-edit', {
    route: /^#\/schedule-edit(?:\/([\w-]+))?(?:\?[^#]*)?$/i,
    tab: 'trips',
    render: function (params) { return renderScheduleEdit(params); },
    mount: function (root, params) {
      const id = editIdOf(params);
      const existing = id ? getScheduleById(id) : null;
      const host = hostOf(root);
      const scope = { value: '本次' };
      let alternatives = [];

      function slotEl() { return document.getElementById('tr-conflict-slot'); }

      function showSlot(html, focusIt) {
        const el = slotEl();
        if (!el) return;
        el.innerHTML = html;
        if (focusIt && el.scrollIntoView) {
          try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { el.scrollIntoView(); }
        }
      }

      function commit(data) {
        let created = null;
        let saved;
        if (id && existing) {
          saved = TM.store.updateSchedule(id, data);
        } else {
          saved = TM.store.addSchedule(data);
          created = saved;
        }
        TM.store.save();
        const dayKey = T.key(data.start);
        const count = daySchedules(dayKey).length;
        const scopeText = data.repeat && scope.value !== '本次' ? '（影响范围：' + scope.value + '）' : '';
        UI.toast('已保存「' + data.title + '」' + scopeText);
        if (count > 8) {
          setTimeout(function () {
            UI.toast('今日安排较满：共 ' + count + ' 条', { duration: 2800 });
          }, 500);
        }
        const targetId = id || (created && created.id);
        if (targetId) UI.replace('#/schedule/' + targetId);
        else UI.back();
      }

      function collectAndValidate() {
        const data = collectForm();
        if (!data.title) {
          showSlot('<div class="banner banner--red">' + icon('alert', 16) + ' 请填写事件名称，名称与时间是最少必填项。</div>', true);
          const el = document.getElementById('tr-f-title');
          if (el) el.focus();
          return null;
        }
        return data;
      }

      function attemptSave(force) {
        const data = collectAndValidate();
        if (!data) return;
        if (id && existing) data.status = existing.status || 'confirmed';
        else data.status = 'confirmed';
        if (id && existing) data.important = !!existing.important;
        if (id && existing && existing.source) data.source = existing.source;

        const conflicts = conflictsOf({ start: data.start, end: data.end, location: data.location }, id);
        const hard = conflicts.filter(function (c) { return c && c.type === 'hard'; });
        const soft = conflicts.filter(function (c) { return c && c.type !== 'hard'; });

        if (hard.length) {
          alternatives = suggestSlotsFor(data).slice(0, 3);
          showSlot(hardBannerHTML(hard, alternatives), true);
          UI.toast('存在硬冲突，请改用替代时段后再保存');
          return;
        }
        if (soft.length && !force) {
          showSlot(softBannerHTML(soft), true);
          return;
        }
        commit(data);
      }

      function hardBannerHTML(list, slots) {
        return '<div class="banner banner--red">' + icon('alert', 16) +
          '<div class="tr-banner-body">' +
          '<div class="tr-banner-t">时间冲突，无法保存</div>' +
          '<div class="tr-banner-list">' + list.map(function (c) {
            return '<div class="tr-banner-item">' + esc(conflictText(c)) + '</div>';
          }).join('') + '</div>' +
          (slots.length
            ? '<div class="tr-banner-x">已为你计算 3 个可用时段，点击即可一键改期：</div>' +
              '<div class="tr-slots">' + slots.map(function (sl, i) {
                return '<button class="tr-slot" data-act="slot" data-i="' + i + '">' +
                  '<b>' + esc(slotLabel(sl)) + '</b><span>一键改期</span></button>';
              }).join('') + '</div>'
            : '<div class="tr-banner-x">当天没有可用空档，试试换一天或缩短时长。</div>') +
          '<button class="btn btn--ghost btn--sm mt8" data-act="manual-time">手动调整时间</button>' +
          '</div></div>';
      }

      function softBannerHTML(list) {
        return '<div class="banner banner--orange">' + icon('clock', 16) +
          '<div class="tr-banner-body">' +
          '<div class="tr-banner-t">存在可调整的提醒</div>' +
          '<div class="tr-banner-list">' + list.map(function (c) {
            return '<div class="tr-banner-item">' + esc(conflictText(c)) + '</div>';
          }).join('') + '</div>' +
          '<div class="tr-banner-x">软冲突与通勤冲突不阻断保存，建议调整时间或预留缓冲。</div>' +
          '<div class="row gap8 mt8">' +
          '<button class="btn btn--primary btn--sm" data-act="force-save">仍然保存</button>' +
          '<button class="btn btn--ghost btn--sm" data-act="manual-time">调整时间</button>' +
          '</div></div></div>';
      }

      function applySlot(sl) {
        const dEl = document.getElementById('tr-f-date');
        const sEl = document.getElementById('tr-f-start');
        const eEl = document.getElementById('tr-f-end');
        if (!dEl || !sEl || !eEl) return;
        dEl.value = T.key(sl.start);
        sEl.value = hm(sl.start);
        eEl.value = hm(sl.end);
        showSlot('<div class="banner banner--green">' + icon('check', 16) + ' 已改用 ' +
          esc(slotLabel(sl)) + '，未再检测到硬冲突，可以保存。</div>', true);
        UI.toast('已改用 ' + slotLabel(sl));
      }

      function toggleAllday() {
        const sw = document.getElementById('tr-f-allday');
        if (!sw) return;
        const on = sw.getAttribute('aria-checked') !== 'true';
        sw.setAttribute('aria-checked', on ? 'true' : 'false');
        sw.classList.toggle('switch--on', on);
        const row = document.getElementById('tr-f-time-row');
        if (row) row.classList.toggle('tr-is-hidden', on);
      }

      function syncRepeatUI() {
        const typeEl = document.getElementById('tr-f-repeat');
        const extra = document.getElementById('tr-repeat-extra');
        if (!typeEl || !extra) return;
        const type = typeEl.value;
        extra.classList.toggle('tr-is-hidden', type === 'none');
        const wd = document.getElementById('tr-f-wd');
        if (wd) wd.classList.toggle('tr-is-hidden', type !== 'weekly');
        let intervalEl = document.getElementById('tr-f-interval');
        if (type === 'custom' && !intervalEl) {
          const wrap = document.createElement('div');
          wrap.className = 'tr-chips mt8';
          wrap.innerHTML = '<span class="tr-chip-label">每</span>' +
            '<input class="input tr-input-sm" id="tr-f-interval" type="number" min="1" max="30" value="2">' +
            '<span class="tr-chip-label">天</span>';
          extra.insertBefore(wrap, extra.firstChild);
        } else if (type !== 'custom' && intervalEl) {
          intervalEl.parentNode.parentNode.removeChild(intervalEl.parentNode);
        }
        const untilType = (document.getElementById('tr-f-untiltype') || {}).value;
        const ud = document.getElementById('tr-f-untildate');
        const uc = document.getElementById('tr-f-untilcount');
        if (ud) ud.classList.toggle('tr-is-hidden', untilType !== 'date');
        if (uc) uc.classList.toggle('tr-is-hidden', untilType !== 'count');
      }

      bindLongPress(host);

      host.addEventListener('change', function (e) {
        if (e.target && (e.target.id === 'tr-f-repeat' || e.target.id === 'tr-f-untiltype')) syncRepeatUI();
      });

      screenClick(host, function (act, el) {
        if (act === 'save') {
          attemptSave();
          return;
        }
        if (act === 'force-save') {
          attemptSave(true);
          return;
        }
        if (act === 'slot') {
          const idx = Number(el.dataset.i);
          const sl = alternatives[idx];
          if (sl) applySlot(sl);
          return;
        }
        if (act === 'manual-time') {
          const el2 = document.getElementById('tr-f-start');
          if (el2) { el2.focus(); if (el2.showPicker) { try { el2.showPicker(); } catch (e) {} } }
          const banner = slotEl();
          if (banner) banner.innerHTML = '<div class="tr-form-note muted small">手动调整后再次点击「保存」，系统会重新检测冲突。</div>';
          return;
        }
        if (act === 'more') {
          const box = document.getElementById('tr-more');
          const btn = document.getElementById('tr-more-btn');
          if (!box) return;
          const hidden = box.classList.toggle('tr-is-hidden');
          if (btn) btn.textContent = hidden ? '更多选项：重复、提醒、备注' : '收起更多选项';
          return;
        }
        if (act === 'rem') {
          el.classList.toggle('chip--on');
          return;
        }
        if (act === 'wd') {
          el.classList.toggle('chip--on');
          return;
        }
        if (act === 'scope') {
          Array.prototype.forEach.call(document.querySelectorAll('#tr-f-scope .seg-i'), function (x) {
            x.classList.remove('seg-i--on');
          });
          el.classList.add('seg-i--on');
          scope.value = el.dataset.scope;
          return;
        }
        if (act === 'cancel') { UI.back(); return; }
        if (act === 'to-trips') { UI.go('#/trips'); return; }
      });

      /* 全天开关 */
      host.addEventListener('click', function (e) {
        if (e.target && e.target.id === 'tr-f-allday') toggleAllday();
      });
      /* 初始化重复规则 UI */
      syncRepeatUI();
    }
  });

  /* ======================= 6. 搜索 #/search ======================= */

  const recentQueries = [];
  const QUICK_QUERIES = ['上海', '会议', '打车', '产品评审', '王总'];

  function filterFromQuery() {
    const q = queryObj();
    const num = function (v) {
      if (v == null || v === '') return null;
      const n = Number(v);
      return isFinite(n) ? n : null;
    };
    return {
      who: String(q.who || ''),
      loc: String(q.loc || ''),
      min: num(q.min),
      max: num(q.max),
      from: /^\d{4}-\d{2}-\d{2}$/.test(q.from || '') ? q.from : '',
      to: /^\d{4}-\d{2}-\d{2}$/.test(q.to || '') ? q.to : ''
    };
  }

  function filterActive(f) {
    return !!(f.who || f.loc || f.min != null || f.max != null || f.from || f.to);
  }

  function buildSearchHash(q, f) {
    const parts = [];
    if (q) parts.push('q=' + encodeURIComponent(q));
    if (f.who) parts.push('who=' + encodeURIComponent(f.who));
    if (f.loc) parts.push('loc=' + encodeURIComponent(f.loc));
    if (f.min != null) parts.push('min=' + encodeURIComponent(f.min));
    if (f.max != null) parts.push('max=' + encodeURIComponent(f.max));
    if (f.from) parts.push('from=' + encodeURIComponent(f.from));
    if (f.to) parts.push('to=' + encodeURIComponent(f.to));
    const qs = parts.join('&');
    return '#/search' + (qs ? '?' + qs : '');
  }

  function doSearch(q, f) {
    const kw = (q || '').trim().toLowerCase();
    const active = !!kw || filterActive(f);
    const res = { schedules: [], trips: [], tx: [] };
    if (!active) return { active: false, res: res };

    const hit = function (hay) {
      if (!kw) return true;
      return String(hay == null ? '' : hay).toLowerCase().indexOf(kw) >= 0;
    };
    const inDate = function (d) {
      if (!d) return true;
      const k = T.key(d);
      if (f.from && k < f.from) return false;
      if (f.to && k > f.to) return false;
      return true;
    };

    allSchedules().forEach(function (s) {
      const st = schStart(s);
      const people = participantsOf(s);
      if (!hit([s.title, s.location, people.join(' '), s.notes || s.note || '', catOf(s).name].join(' '))) return;
      if (f.who && people.join(' ').toLowerCase().indexOf(f.who.toLowerCase()) < 0) return;
      if (f.loc && String(s.location || '').toLowerCase().indexOf(f.loc.toLowerCase()) < 0) return;
      if (!inDate(st)) return;
      res.schedules.push(s);
    });

    allTrips().forEach(function (tp) {
      const meta = tripMeta(tp);
      if (!hit([tp.title, tp.destination].join(' '))) return;
      if (f.loc && String(tp.destination || '').toLowerCase().indexOf(f.loc.toLowerCase()) < 0) return;
      if (f.from && T.key(meta.en) < f.from) return;
      if (f.to && T.key(meta.st) > f.to) return;
      res.trips.push(tp);
    });

    const cats = safe(function () { return TM.store.categories(); }, []) || [];
    const catName = {};
    (Array.isArray(cats) ? cats : []).forEach(function (c) { if (c && c.key) catName[c.key] = c.name; });

    allTx().forEach(function (t) {
      const amount = Math.abs(Number(t.amount) || 0);
      const name = catName[t.category] || t.categoryName || t.category || '';
      if (!hit([t.merchant, t.note, name, t.category].join(' '))) return;
      if (f.min != null && amount < f.min) return;
      if (f.max != null && amount > f.max) return;
      if (!inDate(t.occurredAt || t.occurred || t.time)) return;
      res.tx.push(t);
    });

    /* 金额区间只在有金额筛选时约束行程与日程 */
    return { active: true, res: res };
  }

  function renderSearch() {
    const q = String((queryObj().q) || '');
    const f = filterFromQuery();
    const out = doSearch(q, f);
    const res = out.res;
    const total = res.schedules.length + res.trips.length + res.tx.length;

    let body = '';
    body += '<div class="tr-searchbox">' +
      icon('search', 18) +
      '<input class="input tr-search-input" id="tr-q" value="' + esc(q) + '" placeholder="搜索日程、参与人、地点、金额" enterkeyhint="search">' +
      '<button class="btn btn--primary btn--sm" data-act="do-search">搜索</button>' +
      '</div>';

    body += '<div class="tr-search-filters">' +
      '<button class="chip' + (filterActive(f) ? ' chip--on' : '') + '" data-act="filter">' +
      icon('settings', 14) + ' 筛选' + (filterActive(f) ? ' · 已生效' : '') + '</button>' +
      '<button class="chip" data-act="quick" data-q="会议">会议</button>' +
      '<button class="chip" data-act="quick" data-q="上海">上海</button>' +
      '<button class="chip" data-act="quick" data-q="打车">打车</button>' +
      '</div>';

    if (!out.active) {
      body += '<div class="sec mt16"><div class="sec-t">搜索全部内容</div></div>' +
        '<div class="card">' +
        '<div class="tr-kv"><div class="tr-kv-k">关键词</div><div class="tr-kv-v">事件名称、地点、参与人、备注</div></div>' +
        '<div class="tr-kv"><div class="tr-kv-k">金额区间</div><div class="tr-kv-v">在「筛选」中设置，用于消费记录</div></div>' +
        '<div class="tr-kv"><div class="tr-kv-k">时间范围</div><div class="tr-kv-v">按开始日期过滤日程与行程</div></div>' +
        '</div>';
      if (recentQueries.length) {
        body += '<div class="sec mt16"><div class="sec-t">最近搜索</div></div><div class="tr-chips">' +
          recentQueries.slice(0, 8).map(function (x) {
            return '<button class="chip" data-act="quick" data-q="' + esc(x) + '">' + esc(x) + '</button>';
          }).join('') + '</div>';
      } else {
        body += '<div class="sec mt16"><div class="sec-t">可以试试</div></div><div class="tr-chips">' +
          QUICK_QUERIES.map(function (x) {
            return '<button class="chip" data-act="quick" data-q="' + esc(x) + '">' + esc(x) + '</button>';
          }).join('') + '</div>';
      }
      body += '<div class="tr-hint muted small">支持按参与人、地点、金额区间与时间范围组合检索，结果按类型分组。</div>';
      return screenWrap(head('搜索', {
        back: true,
        right: '<button class="btn btn--ghost btn--sm" data-act="filter">筛选</button>'
      }), body);
    }

    body += '<div class="tr-search-sum">找到 <b>' + total + '</b> 条结果' +
      (filterActive(f) ? '（已应用筛选）' : '') + '</div>';

    if (!total) {
      body += emptyState('search', '没有找到相关结果',
        '换个关键词，或在「筛选」中放宽金额区间与时间范围。',
        '<button class="btn btn--ghost btn--sm" data-act="reset">清空筛选</button>');
      return screenWrap(head('搜索', {
        back: true,
        right: '<button class="btn btn--ghost btn--sm" data-act="filter">筛选</button>'
      }), body);
    }

    if (res.schedules.length) {
      const cids = conflictMaps(res.schedules).any;
      body += secTitle('日程 · ' + res.schedules.length, '');
      body += '<div class="card tr-day"><div class="tr-rows">' +
        res.schedules.slice(0, 20).map(function (s) {
          return schedRow(s, { conflict: !!cids[s.id] });
        }).join('') + '</div></div>';
    }
    if (res.trips.length) {
      body += secTitle('行程 · ' + res.trips.length, '');
      body += '<div class="card tr-day"><div class="tr-rows">' +
        res.trips.slice(0, 10).map(function (tp) {
          const meta = tripMeta(tp);
          return '<div class="tr-row" data-act="open-trip" data-id="' + esc(tp.id) + '" role="button" tabindex="0">' +
            '<div class="tr-row-time">' + T.fmt(meta.st, 'md') + '<span>' + dayCount(meta.st, meta.en) + ' 天</span></div>' +
            '<div class="tr-row-main"><div class="tr-row-t">' + esc(tp.title) + '</div>' +
            '<div class="tr-row-s">' + icon('pin', 13) + ' ' + esc(tp.destination || '未填目的地') + '</div></div>' +
            '<div class="tr-row-r">' + tripStatusTag(meta.status) + '</div></div>';
        }).join('') + '</div></div>';
    }
    if (res.tx.length) {
      body += secTitle('消费 · ' + res.tx.length, '');
      body += '<div class="card tr-day"><div class="tr-rows">' +
        res.tx.slice(0, 20).map(function (t) {
          const name = t.merchant || t.note || '消费';
          return '<div class="tr-row tr-c-orange" data-act="open-tx" data-id="' + esc(t.id) + '">' +
            '<div class="tr-row-time">' + T.fmt(t.occurredAt || t.occurred || t.time, 'md') + '</div>' +
            '<div class="tr-row-main"><div class="tr-row-t">' + esc(name) + '</div>' +
            '<div class="tr-row-s">' + esc(t.categoryName || t.category || '其他') + '</div></div>' +
            '<div class="tr-row-r"><b>' + money(t.amount) + '</b></div></div>';
        }).join('') + '</div></div>';
    }

    return screenWrap(head('搜索', {
      back: true,
      right: '<button class="btn btn--ghost btn--sm" data-act="filter">筛选</button>'
    }), body);
  }

  function openFilterSheet(q) {
    const f = filterFromQuery();
    const body = '' +
      '<div class="tr-f-row">' +
      '<label class="field grow"><span class="field-k">参与人</span>' +
      '<input class="input" id="tr-f-who" value="' + esc(f.who) + '" placeholder="如：王总"></label>' +
      '</div>' +
      '<div class="tr-f-row mt12">' +
      '<label class="field grow"><span class="field-k">地点</span>' +
      '<input class="input" id="tr-f-loc" value="' + esc(f.loc) + '" placeholder="如：上海"></label>' +
      '</div>' +
      '<div class="tr-f-row mt12">' +
      '<label class="field grow"><span class="field-k">金额从</span>' +
      '<input class="input" type="number" inputmode="decimal" id="tr-f-min" value="' + (f.min == null ? '' : esc(f.min)) + '" placeholder="0"></label>' +
      '<label class="field grow"><span class="field-k">金额到</span>' +
      '<input class="input" type="number" inputmode="decimal" id="tr-f-max" value="' + (f.max == null ? '' : esc(f.max)) + '" placeholder="不限"></label>' +
      '</div>' +
      '<div class="tr-f-row mt12">' +
      '<label class="field grow"><span class="field-k">开始日期</span>' +
      '<input class="input" type="date" id="tr-f-from" value="' + esc(f.from) + '"></label>' +
      '<label class="field grow"><span class="field-k">结束日期</span>' +
      '<input class="input" type="date" id="tr-f-to" value="' + esc(f.to) + '"></label>' +
      '</div>' +
      '<div class="tr-form-note muted small">金额区间只作用于消费记录；时间范围作用于日程、行程与消费。</div>';

    UI.openSheet({
      title: '筛选',
      body: body,
      actions: [
        { label: '重置', kind: 'ghost', onClick: function (close) {
          close();
          UI.replace(buildSearchHash(q, { who: '', loc: '', min: null, max: null, from: '', to: '' }));
        } },
        { label: '应用筛选', kind: 'primary', onClick: function (close) {
          const n = function (id) {
            const v = valOf(id);
            if (v === '') return null;
            const x = Number(v);
            return isFinite(x) ? x : null;
          };
          const nf = {
            who: (valOf('tr-f-who') || '').trim(),
            loc: (valOf('tr-f-loc') || '').trim(),
            min: n('tr-f-min'),
            max: n('tr-f-max'),
            from: /^\d{4}-\d{2}-\d{2}$/.test(valOf('tr-f-from')) ? valOf('tr-f-from') : '',
            to: /^\d{4}-\d{2}-\d{2}$/.test(valOf('tr-f-to')) ? valOf('tr-f-to') : ''
          };
          close();
          UI.replace(buildSearchHash(q, nf));
        } }
      ]
    });
  }

  TM.screens.register('search', {
    route: /^#\/search(?:\?[^#]*)?$/i,
    tab: 'trips',
    render: function () { return renderSearch(); },
    mount: function (root) {
      const host = hostOf(root);
      bindLongPress(host);
      const q0 = String((queryObj().q) || '');
      const readQ = function () {
        const el = document.getElementById('tr-q');
        return el ? el.value : q0;
      };
      const run = function () {
        const v = (readQ() || '').trim();
        if (v && recentQueries.indexOf(v) === -1) {
          recentQueries.unshift(v);
          if (recentQueries.length > 8) recentQueries.pop();
        }
        UI.replace(buildSearchHash(v, filterFromQuery()));
      };

      const input = document.getElementById('tr-q');
      if (input) {
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); run(); }
        });
      }

      screenClick(host, function (act, el) {
        if (act === 'do-search') run();
        else if (act === 'quick') {
          const v = el.dataset.q || '';
          if (v && recentQueries.indexOf(v) === -1) recentQueries.unshift(v);
          UI.replace(buildSearchHash(v, filterFromQuery()));
        } else if (act === 'filter') openFilterSheet(readQ());
        else if (act === 'reset') UI.replace(buildSearchHash(q0, { who: '', loc: '', min: null, max: null, from: '', to: '' }));
        else if (act === 'open-sched') UI.go('#/schedule/' + el.dataset.id);
        else if (act === 'open-trip') UI.go('#/trip/' + el.dataset.id);
        else if (act === 'open-tx') UI.go('#/tx/' + el.dataset.id);
        else if (act === 'to-trips') UI.go('#/trips');
      });
    }
  });

  /* ======================= 7. 长按快捷菜单 ======================= */

  const LP = { timer: null, x: 0, y: 0, suppressUntil: 0 };

  function suppressed() { return Date.now() < LP.suppressUntil; }

  function bindLongPress(root) {
    root.addEventListener('pointerdown', function (e) {
      if (e.button != null && e.button !== 0) return;
      const el = e.target.closest('[data-sched]');
      if (!el) return;
      const id = el.getAttribute('data-sched') || el.getAttribute('data-id');
      if (!id) return;
      LP.x = e.clientX;
      LP.y = e.clientY;
      if (LP.timer) clearTimeout(LP.timer);
      LP.timer = setTimeout(function () {
        LP.timer = null;
        LP.suppressUntil = Date.now() + 700;
        try { if (UI.haptic) UI.haptic(); } catch (_) {}
        openQuickMenu(id);
      }, 500);
    });

    root.addEventListener('pointermove', function (e) {
      if (!LP.timer) return;
      if (Math.abs(e.clientX - LP.x) > 8 || Math.abs(e.clientY - LP.y) > 8) {
        clearTimeout(LP.timer);
        LP.timer = null;
      }
    });

    ['pointerup', 'pointercancel'].forEach(function (name) {
      root.addEventListener(name, function () {
        if (LP.timer) { clearTimeout(LP.timer); LP.timer = null; }
      }, true);
    });

    root.addEventListener('contextmenu', function (e) {
      if (e.target.closest('[data-sched]')) e.preventDefault();
    });
  }

  function screenClick(root, handler) {
    root.addEventListener('click', function (e) {
      if (suppressed()) return;
      const el = e.target.closest('[data-act]');
      if (!el) return;
      handler(el.dataset.act, el, e);
    });
    /* 键盘可达性：可聚焦的卡片支持 Enter / 空格触发 */
    root.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
      const el = e.target.closest('[data-act]');
      if (!el || el.tagName === 'BUTTON' || el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return;
      e.preventDefault();
      if (suppressed()) return;
      handler(el.dataset.act, el, e);
    });
  }

  function bindSwipe(root, cb) {
    const target = root.querySelector('[data-swipe]') || root;
    let sx = 0;
    let sy = 0;
    let active = false;
    target.addEventListener('touchstart', function (e) {
      if (!e.touches || e.touches.length !== 1) return;
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
      active = true;
    }, { passive: true });
    target.addEventListener('touchend', function (e) {
      if (!active) return;
      active = false;
      const t = e.changedTouches && e.changedTouches[0];
      if (!t) return;
      const dx = t.clientX - sx;
      const dy = t.clientY - sy;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) cb(dx < 0 ? 1 : -1);
    });
    target.addEventListener('touchcancel', function () { active = false; });
  }

  function openQuickMenu(id) {
    const s = getScheduleById(id);
    if (!s) { UI.toast('日程不存在或已删除'); return; }
    const st = schStart(s);
    const en = schEnd(s);
    const trip = s.tripId ? getTripById(s.tripId) : null;
    UI.openSheet({
      title: s.title,
      subtitle: T.fmt(st, 'full') + ' ' + hm(st) + '–' + hm(en) + (trip ? ' · ' + trip.title : ''),
      body: '<div class="tr-quick-hint muted small">长按快捷操作 · 所有修改会立即生效</div>',
      actions: [
        { label: '改期', onClick: function (close) { close(); openReschedule(s); } },
        { label: '复制到明天同一时间', onClick: function (close) { close(); copySchedule(s); } },
        { label: s.important ? '取消重要标记' : '设为重要', onClick: function (close) {
          close();
          TM.store.updateSchedule(s.id, { important: !s.important });
          TM.store.save();
          UI.toast(s.important ? '已取消重要标记' : '已设为重要日程');
        } },
        { label: '关联记账', onClick: function (close) { close(); openExpenseSheet(s); } },
        { label: '删除', kind: 'danger', onClick: function (close) {
          close();
          setTimeout(function () { deleteScheduleFlow(s); }, 220);
        } },
        { label: '取消', kind: 'ghost', onClick: function (close) { close(); } }
      ]
    });
  }

  function copySchedule(s) {
    const st = T.addDays(schStart(s), 1);
    const en = T.addDays(schEnd(s), 1);
    const data = {
      title: s.title + '（副本）',
      start: st,
      end: en,
      location: s.location || '',
      participants: participantsOf(s),
      tripId: s.tripId || null,
      category: s.category || 'work',
      allDay: !!s.allDay,
      status: 'confirmed',
      note: s.note || '',
      important: !!s.important,
      repeat: normRepeat(s.repeat),
      reminder: normReminder(s)
    };
    const created = TM.store.addSchedule(data);
    TM.store.save();
    if (created && created.id) {
      UI.toast('已复制到明天 ' + hm(st), {
        duration: 3200,
        action: { label: '查看', onClick: function () { UI.go('#/schedule/' + created.id); } }
      });
    } else {
      UI.toast('已复制到明天 ' + hm(st));
    }
  }

  function openReschedule(s) {
    const st = schStart(s);
    const en = schEnd(s);
    const slots = suggestSlotsFor(s).slice(0, 3);
    if (!slots.length) {
      UI.openSheet({
        title: '改期',
        subtitle: s.title,
        body: '<div class="muted">当天与次日都没有找到合适空档，请手动指定时间。</div>',
        actions: [
          { label: '手动指定时间', kind: 'primary', onClick: function (close) {
            close();
            UI.go('#/schedule-edit/' + s.id);
          } },
          { label: '取消', kind: 'ghost', onClick: function (close) { close(); } }
        ]
      });
      return;
    }
    UI.openSheet({
      title: '改期到',
      subtitle: T.fmt(st, 'full') + ' · 已避开冲突的可用时段',
      body: '<div class="tr-quick-hint muted small">点击任一时段立即生效，10 秒内可在提示条中撤销。</div>',
      actions: slots.map(function (sl) {
        return {
          label: slotLabel(sl) + '（' + durLabel(durMin(sl.start, sl.end)) + '）',
          onClick: function (close) {
            close();
            const oldStart = schStart(s);
            const oldEnd = schEnd(s);
            TM.store.updateSchedule(s.id, { start: sl.start, end: sl.end });
            TM.store.save();
            UI.toast('已改期到 ' + slotLabel(sl), {
              duration: 6000,
              action: {
                label: '撤销',
                onClick: function () {
                  TM.store.updateSchedule(s.id, { start: oldStart, end: oldEnd });
                  TM.store.save();
                  UI.toast('已撤销改期');
                }
              }
            });
          }
        };
      }).concat([{ label: '手动指定时间', kind: 'ghost', onClick: function (close) {
        close();
        UI.go('#/schedule-edit/' + s.id);
      } }])
    });
  }

  function openExpenseSheet(s) {
    const cats = safe(function () { return TM.store.categories(); }, []) || [];
    const list = Array.isArray(cats) ? cats : [];
    const opts = list.length
      ? list.map(function (c) {
        return '<option value="' + esc(c.name) + '"' + (c.name === '其他' ? ' selected' : '') + '>' + esc(c.name) + '</option>';
      }).join('')
      : '<option value="其他">其他</option>';

    UI.openSheet({
      title: '关联记账',
      subtitle: s.title,
      body: '<div class="tr-form-note muted small">这笔消费会自动关联到该日程' +
        (s.tripId ? '及所属行程' : '') + '。</div>' +
        '<label class="field mt12"><span class="field-k">金额（元）</span>' +
        '<input class="input" type="number" inputmode="decimal" id="tr-tx-amount" placeholder="如：38.5"></label>' +
        '<label class="field mt12"><span class="field-k">分类</span>' +
        '<select class="input" id="tr-tx-cat">' + opts + '</select></label>' +
        '<label class="field mt12"><span class="field-k">备注</span>' +
        '<input class="input" id="tr-tx-note" value="关联日程：' + esc(s.title) + '"></label>',
      actions: [
        { label: '取消', kind: 'ghost', onClick: function (close) { close(); } },
        { label: '保存记账', kind: 'primary', onClick: function (close) {
          const raw = valOf('tr-tx-amount');
          const amount = Number(raw);
          if (!raw || !isFinite(amount) || amount <= 0) { UI.toast('请输入正确的金额'); return; }
          TM.store.addTransaction({
            amount: amount,
            category: valOf('tr-tx-cat') || '其他',
            occurredAt: schStart(s),
            merchant: s.title,
            note: valOf('tr-tx-note') || ('关联日程：' + s.title),
            tripId: s.tripId || null,
            source: 'manual',
            direction: 'expense'
          });
          TM.store.save();
          close();
          UI.toast('已记一笔 ' + money(amount) + '，已关联到「' + s.title + '」');
        } }
      ]
    });
  }

  function deleteScheduleFlow(s) {
    const repeat = normRepeat(s.repeat);
    const done = function (scope) {
      TM.store.removeSchedule(s.id);
      if (scope && scope !== '本次' && repeat) {
        const sig = JSON.stringify(repeat);
        allSchedules().forEach(function (x) {
          if (x.id === s.id) return;
          if (x.title !== s.title) return;
          if (JSON.stringify(normRepeat(x.repeat)) !== sig) return;
          if (schStart(x) > schStart(s)) TM.store.removeSchedule(x.id);
        });
      }
      TM.store.save();
      UI.toast('已删除（影响范围：' + (scope || '本次') + '）');
      UI.replace('#/calendar/day/' + T.key(schStart(s)));
    };

    if (!repeat) {
      UI.confirm({
        title: '删除日程',
        body: '删除「' + s.title + '」？删除后 30 天内可在历史记录中恢复。',
        confirmText: '删除',
        danger: true
      }).then(function (ok) { if (ok) done('本次'); });
      return;
    }

    UI.openSheet({
      title: '删除重复日程',
      subtitle: '「' + s.title + '」· ' + repeatLabel(repeat),
      body: '<div class="tr-form-note muted small">请选择本次删除的影响范围，删除后 30 天内可恢复。</div>',
      actions: [
        { label: '仅删除本次', kind: 'danger', onClick: function (close) { close(); done('本次'); } },
        { label: '删除本次及以后', kind: 'danger', onClick: function (close) { close(); done('本次及以后'); } },
        { label: '删除全部重复', kind: 'danger', onClick: function (close) { close(); done('全部'); } },
        { label: '取消', kind: 'ghost', onClick: function (close) { close(); } }
      ]
    });
  }
})();

/* ==========================================================================
 * 50-ledger.js · 消费账本
 * 页面：#/ledger 账本首页、#/ledger-add 记一笔、#/tx/:id 交易详情、
 *       #/budgets 预算、#/report 报表、#/categories 分类管理
 * 依赖：TM.util / TM.time / TM.store / TM.ui / TM.icon / TM.voice
 * ========================================================================== */
(function () {
  'use strict';

  const TM = window.TM;

  /* ---------- 常量 ---------- */
  const PALETTE = ['--primary', '--orange', '--green', '--red', '--primary-deep'];
  const ACCOUNTS = ['微信支付', '支付宝', '银行卡', '现金'];
  const FALLBACK_CATS = [
    { key: 'meal', name: '餐饮', icon: 'food', budget: 1500 },
    { key: 'transport', name: '交通', icon: 'car', budget: 1200 },
    { key: 'stay', name: '住宿', icon: 'bed', budget: 1800 },
    { key: 'shopping', name: '购物', icon: 'shop', budget: 800 },
    { key: 'fun', name: '娱乐', icon: 'gift', budget: 600 },
    { key: 'medical', name: '医疗', icon: 'heart', budget: 500 },
    { key: 'edu', name: '教育', icon: 'book', budget: 600 },
    { key: 'social', name: '人情', icon: 'users', budget: 500 },
    { key: 'other', name: '其他', icon: 'more', budget: 500 }
  ];
  const SOURCE_LABEL = { voice: '语音记账', manual: '手动记账', ocr: '票据识别', import: '导入' };

  /* ---------- 基础工具（对核心 API 做最小兜底，保证单文件可运行） ---------- */
  function util() { return (TM && TM.util) || {}; }

  function esc(s) {
    if (util().esc) return TM.util.esc(s);
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function money(n) {
    if (util().money) return TM.util.money(n);
    const v = Number(n) || 0;
    return (Math.abs(v % 1) < 0.005 ? '¥' + v.toLocaleString('zh-CN') : '¥' + v.toFixed(2));
  }

  function pct(a, b) {
    if (!b || b <= 0) return 0;
    return Math.round((a / b) * 100);
  }

  function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
  function clamp(n, a, b) { return Math.min(b, Math.max(a, n)); }
  function icon(name, size) { return (TM && typeof TM.icon === 'function') ? TM.icon(name, size || 20) : ''; }
  function toast(msg) { if (TM.ui && TM.ui.toast) TM.ui.toast(msg); }
  function go(hash) { if (TM.ui && TM.ui.go) TM.ui.go(hash); }
  function pad2(n) { return n < 10 ? '0' + n : String(n); }

  function cssVar(name) {
    try {
      const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      return v || '';
    } catch (e) { return ''; }
  }

  function head(opts) {
    if (TM.ui && TM.ui.head) return TM.ui.head(opts);
    return '<header class="scr-head"><div class="scr-head-t">' + esc(opts.title) + '</div></header>';
  }

  function empty(ic, title, desc, action) {
    if (TM.ui && TM.ui.empty) return TM.ui.empty(ic, title, desc, action || '');
    return '<div class="card card--dashed center">' + esc(title) + '</div>';
  }

  function ring(value, size, opts) {
    if (TM.ui && TM.ui.ring) {
      try { return TM.ui.ring(value, size, opts || {}); } catch (e) { /* ignore */ }
    }
    return '';
  }

  /* ---------- 时间工具 ---------- */
  function monthKeyOf(d) {
    const t = d instanceof Date ? d : new Date();
    return t.getFullYear() + '-' + pad2(t.getMonth() + 1);
  }

  function currentMonth() { return monthKeyOf(new Date()); }

  function isMonthKey(v) { return typeof v === 'string' && /^\d{4}-\d{2}$/.test(v); }

  function shiftMonth(key, delta) {
    const p = String(key).split('-');
    const d = new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1);
    return monthKeyOf(d);
  }

  function monthTitle(key) {
    const p = String(key).split('-');
    return p[0] + '年' + Number(p[1]) + '月';
  }

  function dayHeadText(date) {
    let md = '', wd = '';
    try { md = TM.time.fmt(date, 'md'); } catch (e) { md = (date.getMonth() + 1) + '月' + date.getDate() + '日'; }
    try { wd = TM.time.fmt(date, 'weekday'); } catch (e) { wd = ''; }
    return md + (wd ? ' · ' + wd : '');
  }

  function hourText(v) {
    try { return TM.time.fmt(v, 'hm'); } catch (e) {
      const d = new Date(v);
      return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    }
  }

  function parseDate(v) {
    try { return TM.time.parse(v); } catch (e) { return new Date(v); }
  }

  function datetimeLocalValue(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
      'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /* ---------- Store 读 ---------- */
  function store() { return TM.store || {}; }

  function catsRaw() {
    try {
      const list = store().categories ? store().categories() : null;
      if (Array.isArray(list) && list.length) return list;
    } catch (e) { /* ignore */ }
    if (Array.isArray(TM.CATEGORIES) && TM.CATEGORIES.length) return TM.CATEGORIES;
    return FALLBACK_CATS.slice();
  }

  function catOf(tx) {
    const key = tx && (tx.category || tx.categoryId || tx.categoryKey);
    const list = catsRaw();
    let hit = null;
    for (let i = 0; i < list.length; i++) {
      if (list[i].key === key || list[i].name === key) { hit = list[i]; break; }
    }
    if (hit) {
      return { key: hit.key, name: hit.name, icon: hit.icon || 'more', budget: Number(hit.budget) || 0, index: list.indexOf(hit) };
    }
    return { key: key || 'other', name: (tx && tx.categoryName) || '其他', icon: 'more', budget: 0, index: 8 };
  }

  function catColor(key) {
    const list = catsRaw();
    let idx = -1;
    for (let i = 0; i < list.length; i++) { if (list[i].key === key) { idx = i; break; } }
    if (idx < 0) idx = 0;
    return 'var(' + PALETTE[idx % PALETTE.length] + ')';
  }

  function allTx() {
    try {
      const s = store();
      if (typeof s.transactions === 'function') return s.transactions({}) || [];
    } catch (e) { /* ignore */ }
    return [];
  }

  function txInMonth(month) {
    try {
      const s = store();
      if (typeof s.transactions === 'function') {
        const list = s.transactions({ month: month });
        if (Array.isArray(list)) return list;
      }
    } catch (e) { /* ignore */ }
    return allTx().filter(function (t) {
      return monthKeyOf(parseDate(t.occurredAt)) === month;
    });
  }

  function trips() {
    try {
      const s = store();
      if (typeof s.trips === 'function') {
        const list = s.trips();
        if (Array.isArray(list)) return list;
      }
    } catch (e) { /* ignore */ }
    return [];
  }

  function tripName(id) {
    if (!id) return '';
    const list = trips();
    for (let i = 0; i < list.length; i++) { if (String(list[i].id) === String(id)) return list[i].title || ''; }
    return '';
  }

  function findTx(id) {
    const list = allTx();
    for (let i = 0; i < list.length; i++) { if (String(list[i].id) === String(id)) return list[i]; }
    try {
      const s = store();
      if (typeof s.getTransaction === 'function') return s.getTransaction(id);
    } catch (e) { /* ignore */ }
    return null;
  }

  function monthSummaryOf(month) {
    try {
      const s = store();
      if (typeof s.monthSummary === 'function') return s.monthSummary(month) || {};
    } catch (e) { /* ignore */ }
    return {};
  }

  /* ---------- Store 写（兼容无写接口的情况） ---------- */
  function save() { try { if (store().save) store().save(); } catch (e) { /* ignore */ } }

  function totalBudget() {
    const st = store().state || {};
    if (st.budgets && typeof st.budgets.monthly === 'number' && st.budgets.monthly > 0) return st.budgets.monthly;
    if (st.budgets && typeof st.budgets.total === 'number' && st.budgets.total > 0) return st.budgets.total;
    if (typeof st.totalBudget === 'number' && st.totalBudget > 0) return st.totalBudget;
    const sum = monthSummaryOf(currentMonth());
    if (sum && typeof sum.budget === 'number' && sum.budget > 0) return sum.budget;
    const catSum = catsRaw().reduce(function (a, c) { return a + (Number(c.budget) || 0); }, 0);
    return catSum > 0 ? catSum : 5000;
  }

  function budgetForMonth(month) {
    const st = store().state || {};
    if (st.budgets && typeof st.budgets.monthly === 'number' && st.budgets.monthly > 0) return st.budgets.monthly;
    if (st.budgets && typeof st.budgets.total === 'number' && st.budgets.total > 0) return st.budgets.total;
    if (typeof st.totalBudget === 'number' && st.totalBudget > 0) return st.totalBudget;
    const sum = monthSummaryOf(month);
    if (sum && typeof sum.budget === 'number' && sum.budget > 0) return sum.budget;
    const catSum = catsRaw().reduce(function (a, c) { return a + (Number(c.budget) || 0); }, 0);
    return catSum > 0 ? catSum : 5000;
  }

  function setTotalBudget(v) {
    const s = store();
    if (typeof s.setBudget === 'function') {
      try { s.setBudget('monthly', v); return true; } catch (e) { /* fallthrough */ }
    }
    const st = s.state;
    if (!st) return false;
    if (!st.budgets || typeof st.budgets !== 'object') st.budgets = {};
    st.budgets.monthly = v;
    save();
    return true;
  }

  /* setBudget 的分类维度使用中文名（见 10-store.js） */
  function catNameOf(key) {
    const list = catsRaw();
    for (let i = 0; i < list.length; i++) {
      if (list[i].key === key || list[i].name === key) return list[i].name;
    }
    return String(key || '');
  }

  function setCatBudget(key, v) {
    const s = store();
    const name = catNameOf(key);
    if (typeof s.setBudget === 'function') {
      try { s.setBudget(name, v); return true; } catch (e) { /* fallthrough */ }
    }
    if (typeof s.updateCategory === 'function') {
      try { s.updateCategory(name, { budget: v }); return true; } catch (e) { /* fallthrough */ }
    }
    const st = s.state;
    if (!st) return false;
    if (!st.budgets || typeof st.budgets !== 'object') st.budgets = {};
    if (!st.budgets.categories || typeof st.budgets.categories !== 'object') st.budgets.categories = {};
    st.budgets.categories[name] = v;
    save();
    return true;
  }

  /* ---------- 二级分类（TM.store.subcategories / addSubcategory / removeSubcategory） ---------- */
  function subsOf(key) {
    const s = store();
    const name = catNameOf(key);
    if (typeof s.subcategories === 'function') {
      try {
        const arr = s.subcategories(name);
        return Array.isArray(arr) ? arr.slice() : [];
      } catch (e) { /* fallthrough */ }
    }
    const st = s.state || {};
    const map = st.ledgerSubs || {};
    const arr = map[name];
    return Array.isArray(arr) ? arr.slice() : [];
  }

  function addSub(key, name) {
    const s = store();
    const catName = catNameOf(key);
    if (typeof s.addSubcategory === 'function') {
      try { return s.addSubcategory(catName, name); } catch (e) { return false; }
    }
    return false;
  }

  function delSub(key, name) {
    const s = store();
    const catName = catNameOf(key);
    if (typeof s.removeSubcategory === 'function') {
      try { return s.removeSubcategory(catName, name); } catch (e) { return false; }
    }
    return false;
  }

  /* ---------- 统计 ---------- */
  function statsOf(txs) {
    let expense = 0, income = 0;
    txs.forEach(function (t) {
      const a = Number(t.amount) || 0;
      if (t.direction === 'income') income += a;
      else expense += a;
    });
    return { expense: round2(expense), income: round2(income), balance: round2(income - expense) };
  }

  function spentByCat(txs) {
    const map = {};
    txs.forEach(function (t) {
      if (t.direction === 'income') return;
      const c = catOf(t);
      map[c.key] = round2((map[c.key] || 0) + (Number(t.amount) || 0));
    });
    return map;
  }

  function isAutoLinked(t) {
    const flags = [t.autoTrip, t.autoLinked, t.autoRelated, t.tripAuto, t.autoLink];
    for (let i = 0; i < flags.length; i++) {
      if (typeof flags[i] === 'boolean') return flags[i];
    }
    return !!(t.tripId && (t.source === 'voice' || t.source === 'ocr'));
  }

  function groupByDay(txs) {
    const groups = [];
    const map = {};
    txs.forEach(function (t) {
      const d = parseDate(t.occurredAt);
      const key = TM.time && TM.time.key ? TM.time.key(d) : (d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()));
      if (!map[key]) {
        map[key] = { key: key, date: d, items: [], expense: 0, income: 0 };
        groups.push(map[key]);
      }
      map[key].items.push(t);
      const a = Number(t.amount) || 0;
      if (t.direction === 'income') map[key].income += a;
      else map[key].expense += a;
    });
    groups.sort(function (a, b) { return b.date.getTime() - a.date.getTime(); });
    return groups;
  }

  /* ---------- 公共片段 ---------- */
  function headBtn(ic, act, label, attrs) {
    return '<button class="lg-headbtn" type="button" data-act="' + act + '"' + (attrs || '') +
      ' aria-label="' + esc(label) + '">' + icon(ic, 20) + '</button>';
  }

  function monthBar(month, actName) {
    const isNow = month >= currentMonth();
    return '<div class="lg-monthbar">' +
      '<button class="lg-mbtn lg-mbtn--prev" type="button" data-act="' + actName + '" data-d="-1" aria-label="上个月">' + icon('chevron', 18) + '</button>' +
      '<div class="lg-monthlbl">' + esc(monthTitle(month)) + '</div>' +
      '<button class="lg-mbtn" type="button" data-act="' + actName + '" data-d="1" aria-label="下个月"' + (isNow ? ' disabled' : '') + '>' + icon('chevron', 18) + '</button>' +
      '</div>';
  }

  function catIconHtml(cat, size) {
    return '<span class="lg-caticon" style="--lg-cat:' + catColor(cat.key) + '">' + icon(cat.icon || 'more', size || 18) + '</span>';
  }

  function tripTag(t) {
    if (!t.tripId) return '';
    const name = tripName(t.tripId);
    if (!name) return '';
    return '<span class="tag tag--blue">' + esc(name) + '</span>';
  }

  function txRow(t) {
    const cat = catOf(t);
    const income = t.direction === 'income';
    const amt = money(Math.abs(Number(t.amount) || 0));
    const sub = [hourText(t.occurredAt), t.note || (income ? '收入' : cat.name)].filter(Boolean).join(' · ');
    const tags = [];
    tags.push(tripTag(t));
    if (isAutoLinked(t)) tags.push('<span class="tag tag--orange">自动关联</span>');
    if (t.source === 'voice') tags.push('<span class="tag">语音</span>');
    return '<div class="li lg-txrow" role="button" tabindex="0" data-act="tx" data-id="' + esc(t.id) + '">' +
      catIconHtml(cat) +
      '<div class="li-main">' +
      '<div class="li-t">' + esc(t.merchant || cat.name) + '</div>' +
      '<div class="li-s">' + esc(sub) + '</div>' +
      (tags.length ? '<div class="lg-tags">' + tags.filter(Boolean).join('') + '</div>' : '') +
      '</div>' +
      '<div class="li-r lg-amt' + (income ? ' lg-amt--in' : '') + '">' + (income ? '+' : '') + amt + '</div>' +
      '</div>';
  }

  function banner(tone, text, actionHash, actionText) {
    return '<div class="banner banner--' + tone + ' lg-banner">' +
      '<span class="lg-banner-t">' + text + '</span>' +
      (actionHash ? '<button class="lg-link" type="button" data-act="go" data-to="' + actionHash + '">' + esc(actionText || '查看') + ' ›</button>' : '') +
      '</div>';
  }

  function goAttrs(hash) { return ' data-act="go" data-to="' + hash + '"'; }

  /* 事件分发：#screen 每次 render 都是新节点，节点变化时重新绑定（每个节点只绑一次） */
  let boundRoot = null;
  let pageTest = null;
  let pageFn = null;
  function bindRootOnce() {
    const el = document.getElementById('screen');
    if (!el || el === boundRoot) return;
    boundRoot = el;
    el.addEventListener('click', function (e) {
      if (!pageFn) return;
      const path = location.hash.split('?')[0];
      if (pageTest && !pageTest.test(path)) return;
      pageFn(e);
    });
  }
  function page(test, fn) {
    pageTest = test;
    pageFn = fn;
    bindRootOnce();
  }

  /* ==========================================================================
   * 1. #/ledger 账本首页
   * ========================================================================== */
  TM.screens.register('ledger', {
    route: /^#\/ledger\/?$/i,
    tab: 'ledger',
    render: function () {
      const q = (TM.ui && TM.ui.query) ? TM.ui.query() : {};
      const month = isMonthKey(q.m) ? q.m : currentMonth();
      const txs = txInMonth(month);
      const stats = statsOf(txs);
      const budget = budgetForMonth(month);
      const ratio = budget > 0 ? Math.round((stats.expense / budget) * 100) : 0;
      const cats = catsRaw();
      const spentMap = spentByCat(txs);

      const catRows = cats.map(function (c) {
        const spent = spentMap[c.key] || 0;
        const b = Number(c.budget) || 0;
        return { key: c.key, name: c.name, icon: c.icon, spent: spent, budget: b, ratio: b > 0 ? Math.round(spent / b * 100) : 0 };
      });

      const warnings = [];
      if (budget > 0 && ratio >= 100) {
        warnings.push(banner('red', '本月预算已超支 <b>' + money(stats.expense - budget) + '</b>，建议减少非必要支出。', '#/budgets', '调整预算'));
      } else if (budget > 0 && ratio >= 80) {
        warnings.push(banner('orange', '本月预算已用 <b>' + ratio + '%</b>，剩余 <b>' + money(budget - stats.expense) + '</b>。', '#/budgets', '查看预算'));
      }
      catRows.filter(function (c) { return c.budget > 0 && c.ratio >= 80; })
        .sort(function (a, b) { return b.ratio - a.ratio; })
        .slice(0, 2)
        .forEach(function (c) {
          const over = c.spent - c.budget;
          let tail;
          if (over > 0.5) tail = '，已超支 ' + money(over);
          else if (Math.abs(over) <= 0.5) tail = '，已达预算上限';
          else tail = '，剩余 ' + money(c.budget - c.spent);
          warnings.push(banner(c.ratio >= 100 ? 'red' : 'orange',
            '「' + esc(c.name) + '」已用预算 <b>' + c.ratio + '%</b>' + tail +
            '，提示只做提醒，不影响继续记账。', '#/budgets', '查看预算'));
        });

      const topCats = catRows.filter(function (c) { return c.spent > 0; })
        .sort(function (a, b) { return b.spent - a.spent; }).slice(0, 3);

      const groups = groupByDay(txs);
      const ringColor = ratio >= 100 ? cssVar('--red') : (ratio >= 80 ? cssVar('--orange') : cssVar('--primary'));

      let body = '';
      body += monthBar(month, 'month');
      body += '<div class="card lg-overview" data-act="go" data-to="#/budgets" role="button" tabindex="0">' +
        '<div class="lg-ov-l">' +
        '<div class="lg-k">本月支出</div>' +
        '<div class="lg-amount">' + money(stats.expense) + '</div>' +
        '<div class="lg-sub">收入 ' + money(stats.income) + ' · 结余 ' + money(stats.balance) + '</div>' +
        '</div>' +
        '<div class="lg-ov-r">' + ring(clamp(ratio, 0, 100), 78, { color: ringColor, label: ratio + '%', sub: '预算已用' }) + '</div>' +
        '</div>';

      if (warnings.length) body += '<div class="lg-warnings">' + warnings.join('') + '</div>';

      body += '<div class="lg-quick">' +
        '<button class="chip" type="button" data-act="go" data-to="#/budgets">预算管理</button>' +
        '<button class="chip" type="button" data-act="go" data-to="#/report">消费报表</button>' +
        '<button class="chip" type="button" data-act="go" data-to="#/categories">分类管理</button>' +
        '</div>';

      if (topCats.length) {
        body += '<div class="lg-chiprow" aria-label="本月主要分类">' +
          topCats.map(function (c) {
            return '<button class="chip lg-catchip" type="button" data-act="go" data-to="#/report">' +
              '<span class="lg-dot" style="background:' + catColor(c.key) + '"></span>' +
              esc(c.name) + ' ' + money(c.spent) + '</button>';
          }).join('') + '</div>';
      }

      body += '<div class="sec"><div class="sec-t">本月流水</div><div class="sec-x" data-act="go" data-to="#/report">报表 ›</div></div>';

      if (!txs.length) {
        body += empty('wallet', '本月还没有记账', '说一句「午餐 45 块」可语音记账，也可以手动记一笔。',
          '<button class="btn btn--primary btn--sm" type="button" data-act="add">＋ 记一笔</button>');
      } else {
        body += groups.map(function (g) {
          const headRight = g.expense > 0 ? '支出 ' + money(g.expense) : '收入 ' + money(g.income);
          return '<div class="lg-day">' +
            '<div class="lg-dayhead"><span>' + esc(dayHeadText(g.date)) + '</span><span>' + headRight + '</span></div>' +
            '<div class="list">' + g.items.map(txRow).join('') + '</div>' +
            '</div>';
        }).join('');
      }

      body += '<button class="btn btn--primary btn--block lg-addbtn" type="button" data-act="add">＋ 记一笔</button>';
      body += '<div class="lg-foot muted small center">数据保存在本机，可在「我的 — 数据导出」中导出全部记录</div>';

      return '<section class="screen">' +
        head({
          title: '账本',
          back: false,
          right: headBtn('chart', 'report', '报表') + headBtn('more', 'cats', '分类管理')
        }) +
        '<div class="scr-body">' + body + '</div>' +
        '</section>';
    },
    mount: function (root) {
      const q = (TM.ui && TM.ui.query) ? TM.ui.query() : {};
      const month = isMonthKey(q.m) ? q.m : currentMonth();
      page(/^#\/ledger(\?|$)/i, function (e) {
        const el = e.target.closest('[data-act]');
        if (!el || !root.contains(el)) return;
        const act = el.getAttribute('data-act');
        if (act === 'month') {
          const d = Number(el.getAttribute('data-d')) || 0;
          const next = shiftMonth(month, d);
          if (next > currentMonth()) return;
          go('#/ledger?m=' + next);
        } else if (act === 'add') {
          go('#/ledger-add');
        } else if (act === 'report') {
          go('#/report?m=' + month);
        } else if (act === 'cats') {
          go('#/categories');
        } else if (act === 'tx') {
          go('#/tx/' + el.getAttribute('data-id'));
        } else if (act === 'go') {
          go(el.getAttribute('data-to'));
        }
      });
    }
  });

  /* ==========================================================================
   * 2. #/ledger-add 记一笔
   * ========================================================================== */

    route: /^#\/ledger-add\/?$/i,
    tab: 'ledger',

      const body =
        dirSeg + amountBar +

        '<div class="sec"><div class="sec-t">账户</div></div>' + accountChips +
        '<label class="field"><span class="field-k">时间</span>' +
        '<input class="input" id="lg-when" type="datetime-local" value="' + datetimeLocalValue(now) + '"></label>' +
        '<label class="field"><span class="field-k">关联行程</span>' +
        '<select class="input" id="lg-trip">' + tripOptions + '</select></label>' +
        '<label class="field"><span class="field-k">商户（可选）</span>' +
        '<input class="input" id="lg-merchant" type="text" maxlength="30" placeholder="如：国贸地铁站、瑞幸咖啡"></label>' +
        '<label class="field"><span class="field-k">备注（可选）</span>' +
        '<input class="input" id="lg-note" type="text" maxlength="60" placeholder="如：客户拜访打车"></label>' +
        '<div class="lg-formfoot">' +
        '<button class="btn btn--ghost lg-voicebtn" type="button" data-act="voice">' + icon('mic', 18) + ' 语音记账</button>' +
        '<button class="btn btn--primary lg-savebtn" type="button" data-act="save">保存</button>' +
        '</div>' +
        '<div class="lg-foot muted small center">保存后会立即计入本月统计与预算进度，可在交易详情中修改分类。</div>';

      return '<section class="screen">' +
        head({ title: '记一笔', back: true, right: '' }) +
        '<div class="scr-body">' + body + '</div>' +
        '</section>';
    },
    mount: function (root) {
      const state = { direction: 'expense', category: (catsRaw()[0] || FALLBACK_CATS[0]).key, categoryName: (catsRaw()[0] || FALLBACK_CATS[0]).name, account: ACCOUNTS[0] };

      function pick(selector, cls, attr) {
        root.querySelectorAll(selector).forEach(function (b) { b.classList.remove(cls); });
      }

      page(/^#\/ledger-add(\?|$)/i, function (e) {
        const el = e.target.closest('[data-act]');
        if (!el || !root.contains(el)) return;
        const act = el.getAttribute('data-act');

        if (act === 'dir') {
          state.direction = el.getAttribute('data-dir');
          root.querySelectorAll('[data-act="dir"]').forEach(function (b) {
            const on = b === el;
            b.classList.toggle('seg-i--on', on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
        } else if (act === 'pick-cat') {
          state.category = el.getAttribute('data-cat');
          state.categoryName = el.getAttribute('data-name') || state.category;
          root.querySelectorAll('[data-act="pick-cat"]').forEach(function (b) { b.classList.toggle('lg-cat--on', b === el); });
        } else if (act === 'account') {
          state.account = el.getAttribute('data-account');
          root.querySelectorAll('[data-act="account"]').forEach(function (b) { b.classList.toggle('chip--on', b === el); });
        } else if (act === 'voice') {
          if (TM.voice && typeof TM.voice.start === 'function') {
            try { TM.voice.start('expense'); } catch (err) { toast('语音入口暂不可用'); }
          } else {
            toast('语音记账入口将在语音模块启用后可用');
          }
        } else if (act === 'save') {
          const amountEl = root.querySelector('#lg-amount');
          const amount = parseAmount(amountEl ? amountEl.value : '');
          if (!(amount > 0)) {
            toast('请输入大于 0 的金额');
            if (amountEl) { try { amountEl.focus(); } catch (err) { /* ignore */ } }
            return;
          }
          const whenEl = root.querySelector('#lg-when');
          let when = whenEl && whenEl.value ? new Date(whenEl.value) : new Date();
          if (isNaN(when.getTime())) when = new Date();
          const tripEl = root.querySelector('#lg-trip');
          const merchantEl = root.querySelector('#lg-merchant');
          const noteEl = root.querySelector('#lg-note');
          const merchantVal = merchantEl ? String(merchantEl.value || '').trim() : '';
          const noteVal = noteEl ? String(noteEl.value || '').trim() : '';
          const tripVal = tripEl ? String(tripEl.value || '') : '';
          const cat = catOf({ category: state.category });
          const data = {
            amount: round2(amount),
            category: state.categoryName,
            occurredAt: when,
            merchant: merchantVal || state.categoryName,
            note: noteVal,
            tripId: tripVal || null,
            source: 'manual',
            direction: state.direction
          };
          let created = null;
          try {
            if (TM.store && typeof TM.store.addTransaction === 'function') created = TM.store.addTransaction(data);
          } catch (err) { toast('保存失败，请稍后重试'); return; }
          if (created && created.id && TM.store && typeof TM.store.updateTransaction === 'function' && state.account) {
            try { TM.store.updateTransaction(created.id, { account: state.account, categoryName: cat.name }); } catch (err) { /* 账户为附加信息，失败不阻断 */ }
          }
          if (TM.ui && TM.ui.haptic) TM.ui.haptic();
          toast((state.direction === 'income' ? '已记收入 ' : '已记一笔 ') + money(amount));
          go('#/ledger?m=' + monthKeyOf(when));
        } else if (act === 'go') {
          go(el.getAttribute('data-to'));
        }
      });
    }
  });

  function parseAmount(v) {
    if (typeof v === 'number') return v;
    const s = String(v == null ? '' : v).replace(/[¥￥,\s]/g, '');
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  }

  /* ==========================================================================
   * 5. #/report 报表
   * ========================================================================== */
  function monthSeries(count) {
    const out = [];
    const nowMonth = currentMonth();
    for (let i = count - 1; i >= 0; i--) {
      const key = shiftMonth(nowMonth, -i);
      const txs = txInMonth(key);
      out.push({ key: key, expense: statsOf(txs).expense, isNow: i === 0 });
    }
    return out;
  }

  function tripPeople(id) {
    if (!id) return 1;
    const list = trips();
    for (let i = 0; i < list.length; i++) {
      if (String(list[i].id) === String(id)) return Number(list[i].people) > 0 ? Number(list[i].people) : 1;
    }
    return 1;
  }

  function groupByTrip(txs) {
    const map = {};
    const list = [];
    txs.forEach(function (t) {
      if (t.direction === 'income') return;
      const key = t.tripId ? String(t.tripId) : '__none__';
      if (!map[key]) {
        map[key] = {
          key: key,
          name: t.tripId ? (tripName(t.tripId) || '关联行程') : '日常（未关联行程）',
          total: 0, items: [], byCat: {},
          people: t.tripId ? tripPeople(t.tripId) : 1
        };
        list.push(map[key]);
      }
      const a = Number(t.amount) || 0;
      map[key].total = round2(map[key].total + a);
      map[key].items.push(t);
      const c = catOf(t);
      map[key].byCat[c.name] = round2((map[key].byCat[c.name] || 0) + a);
    });
    list.sort(function (a, b) { return b.total - a.total; });
    return list;
  }

  TM.screens.register('report', {
    route: /^#\/report\/?$/i,
    tab: 'ledger',
    render: function () {
      const q = (TM.ui && TM.ui.query) ? TM.ui.query() : {};
      const month = isMonthKey(q.m) ? q.m : currentMonth();
      const txs = txInMonth(month);
      const stats = statsOf(txs);
      const budget = budgetForMonth(month);
      const ratio = pct(stats.expense, budget);
      const spentMap = spentByCat(txs);
      const cats = catsRaw();

      const catRows = cats.map(function (c) {
        const spent = spentMap[c.key] || 0;
        return { key: c.key, name: c.name, spent: spent, pct: pct(spent, stats.expense) };
      }).filter(function (c) { return c.spent > 0; }).sort(function (a, b) { return b.spent - a.spent; });

      const catBlock = catRows.length
        ? '<div class="card lg-props">' + catRows.map(function (c) {
          return '<div class="lg-prop">' +
            '<div class="lg-prophead"><span class="lg-dot" style="background:' + catColor(c.key) + '"></span>' +
            '<span class="lg-propname">' + esc(c.name) + '</span>' +
            '<span class="lg-propval">' + money(c.spent) + ' · ' + c.pct + '%</span></div>' +
            '<div class="bar"><i style="width:' + clamp(c.pct, 0, 100) + '%"></i></div>' +
            '</div>';
        }).join('') + '</div>'
        : empty('chart', '本月还没有分类数据', '有记账后这里会自动生成分类占比。',
          '<button class="btn btn--primary btn--sm" type="button" data-act="add">＋ 记一笔</button>');

      const trips = groupByTrip(txs);
      const tripBlock = trips.length
        ? trips.map(function (tr) {
          const mix = Object.keys(tr.byCat).sort(function (a, b) { return tr.byCat[b] - tr.byCat[a]; }).slice(0, 4);
          return '<div class="card lg-tripcost">' +
            '<div class="row between lg-tripcost-head">' +
            '<div><div class="li-t">' + esc(tr.name) + '</div>' +
            '<div class="li-s">' + tr.items.length + ' 笔 · 人均 ' + money(tr.total / (tr.people || 1)) + '</div></div>' +
            '<div class="lg-tripcost-total">' + money(tr.total) + '</div>' +
            '</div>' +
            '<div class="lg-mix">' + mix.map(function (name) {
              const v = tr.byCat[name];
              const p = pct(v, tr.total);
              return '<span class="lg-mixitem"><span class="lg-mixname">' + esc(name) + '</span>' +
                '<span class="lg-mixbar"><i style="width:' + clamp(p, 0, 100) + '%"></i></span>' +
                '<span class="lg-mixval">' + p + '%</span></span>';
            }).join('') + '</div>' +
            '</div>';
        }).join('')
        : empty('trip', '本月还没有行程花费', '给交易关联行程后，这里会显示每次行程的成本构成。',

      const overview = '<div class="card lg-report-ov">' +
        '<div class="lg-report-stats">' +
        '<div class="stat"><div class="stat-v">' + money(stats.expense) + '</div><div class="stat-k">支出</div></div>' +
        '<div class="stat"><div class="stat-v">' + money(stats.income) + '</div><div class="stat-k">收入</div></div>' +

    mount: function (root) {

      function exportCsv() {
        try {
          if (!TM.store || typeof TM.store.exportCSV !== 'function') throw new Error('no export');
          const f = TM.store.exportCSV();
          if (!f || !f.content) throw new Error('empty');
          if (TM.util && typeof TM.util.download === 'function') {
            TM.util.download(f.name || 'tripmate-ledger.csv', f.content, f.mime || 'text/csv;charset=utf-8');

            toast('导出组件不可用');

          toast('导出失败，请稍后重试');

      page(/^#\/report(\?|$)/i, function (e) {

          '<div class="li-main"><div class="li-t">' + esc(c.name) + '</div>' +
          '<div class="li-s">' + (subs.length ? subs.length + ' 个二级分类' : '一级分类固定') + ' · 本月预算 ' + money(c.budget) + '</div></div>' +
          '<div class="li-r">' + (open ? icon('chevron', 16) : icon('chevron', 16)) + '</div>' +
          '</div>' +
          (open ? '<div class="lg-subs">' +
            '<div class="lg-subtags">' + (subHtml || '<span class="muted small">还没有二级分类，添加后可用于备注归类</span>') + '</div>' +
            '<div class="lg-subadd">' +
            '<input class="input lg-subinput" data-cat="' + esc(c.key) + '" type="text" maxlength="12" placeholder="新增二级分类，如：咖啡">' +
            '<button class="btn btn--sm btn--primary" type="button" data-act="add-sub" data-cat="' + esc(c.key) + '">添加</button>' +
            '</div></div>' : '') +

      const body = '<div class="banner banner--blue lg-banner">九大类一级分类固定不可删除；二级分类可自行增删，用于把流水归到更细的场景（例如餐饮下的「咖啡」）。</div>' +
        '<div class="list lg-cats">' + rows + '</div>' +
        '<div class="lg-foot muted small center">修改二级分类不影响历史交易，已有交易仍保留原分类名称。</div>';

      return '<section class="screen">' +
        head({ title: '分类管理', back: true, right: '' }) +
        '<div class="scr-body">' + body + '</div>' +

    mount: function (root) {
      page(/^#\/categories(\?|$)/i, function (e) {

        if (!el || !root.contains(el)) return;
        const act = el.getAttribute('data-act');

        if (act === 'toggle-cat') {
          openCat = openCat === catKey ? null : catKey;
          if (TM.ui && TM.ui.refresh) TM.ui.refresh();

          const input = root.querySelector('.lg-subinput[data-cat="' + catKey + '"]');
          const name = input ? String(input.value || '').trim() : '';
          if (!name) { toast('请输入二级分类名称'); if (input) input.focus(); return; }
          const subs = subsOf(catKey);
          if (subs.indexOf(name) >= 0) { toast('该二级分类已存在'); return; }
          if (subs.length >= 12) { toast('单个一级分类最多 12 个二级分类'); return; }
          if (addSub(catKey, name)) toast('已添加「' + name + '」');
          else toast('添加失败，请重试');
        } else if (act === 'del-sub') {
          const name = el.getAttribute('data-sub');
          if (delSub(catKey, name)) toast('已删除「' + name + '」');
          else toast('删除失败，请重试');
        } else if (act === 'go') {
          go(el.getAttribute('data-to'));
        }
      });

  });

  /* 供其他模块复用（首页健康/账本卡片如需要可读取） */
