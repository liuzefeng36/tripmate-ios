    /\d{1,2}\s*[:：]\s*\d{2}/g,
    /(?:上午|下午|中午|晚上|傍晚|凌晨|早上|早晨|夜里|夜间|明早|明晚|今晚)/g,
    /半小时后/g, /\d+\s*分钟后/g, /\d+\s*小时后/g
  ];
  function stripTemporal(text) {
    var s = text;
    // 统一去除时间表达（"三点" 需要与数字点合并处理）
    s = s.replace(/(?:\d{1,2}|[一二两三四五六七八九十]{1,3})\s*点\s*(?:半|一刻|三刻)?/g, ' ');
    s = s.replace(/[，。！？,.!?；;]/g, ' ');
    for (var i = 0; i < TIME_STRIP.length; i++) s = s.replace(TIME_STRIP[i], ' ');
    return s.replace(/\s+/g, ' ').trim();
  }

  /* 清理口语前缀与语气词 */
  function cleanTitle(s) {
    s = s.replace(/^(帮我|请|麻烦|记一下|记录一下|提醒我|安排一下|添加|新建|创建|添加一个|新建一个|创建一条|记一笔)/g, '');
    s = s.replace(/(吧|呀|啊|呢|哦|嘛|一下|好不好|可以吗)+$/g, '');
    s = s.replace(/(在|于)\s*/g, '');
    s = s.replace(/^(和|跟|与|同|见)\s*/, function (m) { return m; });
    s = s.replace(/^[\s,，、]+|[\s,，、]+$/g, '');
    return s;
  }

  function extractLocation(text) {
    var m = /在\s*([^\s，。]{2,20}?)(?:见|开会|吃饭|碰头|沟通|谈|聊|$)/.exec(text);
    if (m) return m[1];
    m = /去\s*([^\s，。]{2,20}?)(?:见|开会|吃饭|出差|$)/.exec(text);
    if (m) return m[1];
    var known = ['公司', '机场', '高铁站', '火车站', '家', '国贸', '外滩', '酒店', '咖啡厅', '会议室', '浦东', '虹桥'];
    for (var i = 0; i < known.length; i++) if (text.indexOf(known[i]) >= 0) return known[i];
    return '';
  }

  function extractParticipants(text) {
    var m = /(?:见|和|跟|与|同)\s*([^\s，。]{1,8}?)(?:一起|吃饭|开会|见面|沟通|谈|聊|$)/.exec(text);
    if (m) return [m[1]];
    m = /(?:见|和|跟|与|同)\s*([^\s，。]{1,8})/.exec(text);
    return m ? [m[1]] : [];
  }

  function extractAmount(text) {
    var m = /(\d+(?:\.\d+)?)\s*(?:块|元|块钱|人民币)?/.exec(text);
    return m ? parseFloat(m[1]) : null;
  }

  var EXPENSE_CATS = [
    { k: /打车|滴滴|出租车|地铁|公交|高铁|机票|飞机|火车|加油|停车|过路费|交通/, name: '交通', merchant: '交通出行' },
    { k: /午饭|午餐|晚饭|晚餐|早饭|早餐|吃饭|咖啡|奶茶|外卖|餐厅|聚餐|水果|零食/, name: '餐饮', merchant: '餐饮' },
    { k: /酒店|住宿|民宿|房费/, name: '住宿', merchant: '酒店住宿' },
    { k: /买|购物|超市|衣服|鞋|数码|淘宝|京东/, name: '购物', merchant: '购物' },
    { k: /电影|演出|门票|娱乐|游戏/, name: '娱乐', merchant: '休闲娱乐' },
    { k: /医院|药|挂号|体检|医疗/, name: '医疗', merchant: '医疗健康' },
    { k: /书|课程|培训|学费|教育/, name: '教育', merchant: '学习教育' },
    { k: /红包|礼物|礼金|人情/, name: '人情', merchant: '人情往来' }
  ];

  function classifyExpense(text) {
    for (var i = 0; i < EXPENSE_CATS.length; i++) if (EXPENSE_CATS[i].k.test(text)) return EXPENSE_CATS[i];
    return { name: '其他', merchant: '日常支出' };
  }

  function isExpense(text) {
    return /(花了|花费|付了|付款|消费|记账|记一笔|买单|请客)/.test(text) ||
      /(打车|滴滴|地铁|公交|高铁|机票|加油|停车|午饭|午餐|晚饭|晚餐|早饭|早餐|吃饭|咖啡|奶茶|外卖|酒店|住宿|购物|电影|门票|医院|药|书|课程|红包|礼物)\s*\d+/.test(text) ||
      /^\s*(打车|滴滴|地铁|公交|午饭|午餐|晚饭|晚餐|早饭|早餐|咖啡|奶茶|外卖|酒店|住宿|购物|电影)\s*\d/.test(text);
  }

  function isHealth(text) {
    return /走了?\s*\d+\s*步|步数|喝水|饮水|睡眠|睡了|久坐|站立/.test(text);
  }

  function isQuery(text) {
    return /(几个|几场|多少|哪些|有哪些|查一下|看看|看一下|安排|还有|空闲|空档|花了多少)/.test(text);
  }

  function isCancel(text) { return /(取消|不去了|不开了|删掉|删除)/.test(text); }
  function isUpdate(text) { return /(改到|改成|改在|挪到|调整到|提前到|推迟到|延到|顺延)/.test(text); }

  function extractQueryRange(text) {
    if (/今天|今日/.test(text)) return { key: 'today', label: '今天' };
    if (/这周|本周|这个星期|这一周/.test(text)) return { key: 'week', label: '本周' };
    if (/下周/.test(text)) return { key: 'nextweek', label: '下周' };
    if (/这月|本月|这个月/.test(text)) return { key: 'month', label: '本月' };
    return { key: 'week', label: '本周' };
  }

  function extractTargetTitle(text) {
    var m;
    m = /把\s*(.+?)\s*(?:改到|改成|改在|挪到|调整到|提前到|推迟到|延到|顺延)/.exec(text);
    if (m) return cleanTitle(stripTemporal(m[1]));
    m = /(.+?)\s*(?:改到|改成|改在|挪到|调整到|提前到|推迟到|延到|顺延)/.exec(text);
    if (m) return cleanTitle(stripTemporal(m[1]));
    m = /(.+?)\s*(?:取消|不去了|不开了|删掉|删除)/.exec(text);
    if (m) return cleanTitle(stripTemporal(m[1])).replace(/的$/, '');
    return '';
  }

  function buildNormalized(start, end) {
    if (!start) return '';
    var s = (start.getMonth() + 1) + '月' + start.getDate() + '日（' + TM.time.weekdayCN(start) + '）' +
      pad(start.getHours()) + ':' + pad(start.getMinutes());
    if (end) s += '–' + pad(end.getHours()) + ':' + pad(end.getMinutes());
    return s;
  }

  function parseForCreate(text, base) {
    var dateInfo = resolveDate(text, base);
    var timeInfo = resolveTime(text);
    var now = TM.time.now();
    var start = null, end = null;

    if (timeInfo && timeInfo.rel != null) {
      start = TM.time.addMin(now, timeInfo.rel);
    } else {
      var day = dateInfo ? dateInfo.date : (timeInfo && timeInfo.explicit ? TM.time.startOfDay(now) : null);
      if (day) {
        var h = 9, mi = 0;
        if (dateInfo && dateInfo.fixedHour != null) { h = dateInfo.fixedHour; mi = dateInfo.fixedMin; }
        else if (timeInfo) { h = applyPeriod(timeInfo.h, text); mi = timeInfo.mi; }
        else if (/明早/.test(text)) { h = 8; }
        else if (/明晚|今晚/.test(text)) { h = 19; mi = 30; }
        start = mergeDate(TM.time.key(day), h, mi);
        if (!timeInfo && dateInfo && dateInfo.sameDay) start = TM.time.addMin(now, 60);
      }
    }
    if (start) {
      var dur = /(吃饭|午餐|晚餐|聚餐)/.test(text) ? 90 : (/航班|高铁|飞机/.test(text) ? 150 : 60);
      end = TM.time.addMin(start, dur);
    }
    var title = cleanTitle(stripTemporal(text));
    if (!title || /^[\s,，、]+$/.test(title)) title = '';
    var loc = extractLocation(text);
    if (loc) title = title.replace(new RegExp('(在|于)?\\s*' + loc.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')), '').trim();
    title = title.replace(/^(在|于)\s*/, '').replace(/^[\s,，、]+|[\s,，、]+$/g, '');
    return {
      title: title,
      start: start,
      end: end,
      location: loc,
      participants: extractParticipants(text),
      dateExpr: dateInfo ? dateInfo.expr : '',
      timeExpr: timeInfo ? (timeInfo.expr || '') : ''
    };
  }

  TM.nlp = {
    examples: [
      '明天下午三点见王总',
      '后天上午十点产品评审',
      '下周三下午在国贸三期开会',
      '周五晚上七点和产品团队吃饭',
      '打车 38',
      '午餐 45 块',
      '今天走了 8000 步',
      '把家长会改到周五晚上',
      '周四的评审取消',
      '我这周还有几个会'
    ],
    parse: function (raw) {
      var text = String(raw == null ? '' : raw).trim();
      var base = TM.time.now();
      var result = {
        intent: 'unknown', confidence: 0.3,
        slots: { title: '', start: null, end: null, location: '', participants: [], amount: null, category: '', metric: '' },
        missing: [], normalized: '', raw: text, targetTitle: ''
      };
      if (!text) { result.missing = ['text']; return result; }

      /* 1. 健康打卡 */
      if (isHealth(text)) {
        var metric = 'steps', value = null, mm;
        if (/步/.test(text) && (mm = /(\d+)\s*步/.exec(text))) value = +mm[1];
        else if (/喝|饮水/.test(text) && (mm = /(\d+)\s*(?:毫升|ml|杯)/i.exec(text))) value = +mm[1];
        else if (/睡|睡眠/.test(text) && (mm = /(\d+(?:\.\d+)?)\s*(?:小时|h)/.exec(text))) value = +mm[1] * 60;
        if (/喝水|饮水/.test(text)) metric = 'water';
        if (/睡/.test(text)) metric = 'sleep';
        if (/久坐|站立/.test(text)) metric = 'stand';
        result.intent = 'health';
        result.slots.metric = metric;
        result.slots.amount = value;
        result.confidence = value != null ? 0.94 : 0.6;
        if (value == null) result.missing.push('amount');
        result.normalized = metric === 'steps' ? '今日步数 ' + (value || 0) + ' 步'
          : metric === 'water' ? '饮水 ' + (value || 0) + ' 毫升'
            : metric === 'sleep' ? '睡眠 ' + Math.round((value || 0) / 60 * 10) / 10 + ' 小时' : '健康打卡';
        return result;
      }

      /* 2. 记账 */
      var amount = extractAmount(text);
      if (amount != null && (isExpense(text) || /^\s*[\u4e00-\u9fa5]{2,6}\s*\d+(\.\d+)?\s*(块|元)?\s*$/.test(text))) {
        var cat = classifyExpense(text);
        result.intent = 'expense';
        result.confidence = 0.93;
        result.slots.amount = amount;
        result.slots.category = cat.name;
        result.slots.title = cat.merchant;
        result.slots.merchant = cat.merchant;
        result.slots.occurredAt = base;
        result.normalized = cat.name + ' \u00a5' + amount + (/(今天|今日)/.test(text) ? ' · 今天' : '');
        return result;
      }

      /* 3. 查询 */
      if (isQuery(text) && !isCancel(text) && !isUpdate(text)) {
        result.intent = 'query';
        result.confidence = 0.9;
        result.slots.range = extractQueryRange(text);
        result.slots.topic = /花费|支出|花了/.test(text) ? 'expense' : (/行程/.test(text) ? 'trip' : 'schedule');
        result.normalized = '查询' + result.slots.range.label + (result.slots.topic === 'expense' ? '支出' : '日程');
        return result;
      }

      /* 4. 取消 */
      if (isCancel(text)) {
        result.intent = 'cancel';
        result.confidence = 0.88;
        result.targetTitle = extractTargetTitle(text);
        result.slots.title = result.targetTitle;
        var cd = resolveDate(text, base);
        result.slots.date = cd ? cd.date : null;
        if (!result.targetTitle && !cd) { result.missing.push('title'); result.confidence = 0.55; }
        result.normalized = '取消' + (result.targetTitle ? '「' + result.targetTitle + '」' : '') + (cd ? ' ' + (cd.date.getMonth() + 1) + '月' + cd.date.getDate() + '日' : '');
        return result;
      }

      /* 5. 修改 */
      if (isUpdate(text)) {
        result.intent = 'update';
        result.targetTitle = extractTargetTitle(text);
        var nd = resolveDate(text, base);
        var nt = resolveTime(text);
        var newStart = null;
        if (nt && nt.rel != null) newStart = TM.time.addMin(base, nt.rel);
        else if (nd || nt) {
          var dk = nd ? TM.time.key(nd.date) : TM.time.todayKey();
          var h2 = nt ? applyPeriod(nt.h, text) : (nd && nd.fixedHour != null ? nd.fixedHour : 10);
          var mi2 = nt ? nt.mi : 0;
          newStart = mergeDate(dk, h2, mi2);
        }
        result.slots.start = newStart;
        result.slots.end = newStart ? TM.time.addMin(newStart, 60) : null;
        result.confidence = (result.targetTitle && newStart) ? 0.9 : 0.6;
        if (!result.targetTitle) result.missing.push('title');
        if (!newStart) result.missing.push('time');
        result.normalized = (result.targetTitle ? '「' + result.targetTitle + '」' : '日程') +
          (newStart ? '改到 ' + buildNormalized(newStart) : '改期');
        return result;
      }

      /* 6. 新建行程 */
      var f = parseForCreate(text, base);
      result.intent = 'create';
      result.slots.title = f.title;
      result.slots.start = f.start;
      result.slots.end = f.end;
      result.slots.location = f.location;
      result.slots.participants = f.participants;
      result.slots.category = /吃饭|午餐|晚餐|早餐/.test(text) ? 'meal'
        : /航班|高铁|飞机|出差|机场/.test(text) ? 'travel'
          : /体检|跑步|健身|休息/.test(text) ? 'health'
            : /开会|评审|会议|沟通|拜访/.test(text) ? 'meeting' : 'work';
      if (!f.start) { result.missing.push('time'); result.confidence = 0.7; }
      if (!f.title) { result.missing.push('title'); result.confidence = 0.55; }
      if (f.dateExpr && f.timeExpr) result.confidence = 0.94;
      else if (f.start) result.confidence = 0.86;
      result.normalized = buildNormalized(f.start, f.end) + (f.title ? ' ' + f.title : '');
      return result;
    }
  };
})();

    estimateCommute: function (a, b) {
      a = locText(a); b = locText(b);
      if (!a || !b || a === b || isOnlineLoc(a) || isOnlineLoc(b)) return { minutes: 0, km: 0, text: '同地点或线上进行，无需通勤' };
      var cityA = '', cityB = '';
      CITIES.forEach(function (c) { if (a.indexOf(c) >= 0) cityA = c; if (b.indexOf(c) >= 0) cityB = c; });
      var mins;
      if (cityA && cityB && cityA !== cityB) mins = 180;
      else if (/机场|高铁站|火车站/.test(a) || /机场|高铁站|火车站/.test(b)) mins = 60;
      else mins = 30;
      return { minutes: mins, km: Math.round(mins / 2 * 10) / 10, text: '预计 ' + mins + ' 分钟（约 ' + Math.round(mins / 2) + ' 公里）' };
    },
    checkConflicts: function (data, excludeId) {
      var start = TM.time.parse(data.start);
      var end = TM.time.parse(data.end || TM.time.addMin(start, 60));
      var location = locText(data.location);
      var out = [];
      var list = alive(state.schedules).filter(function (s) { return s.id !== excludeId; });
      list.forEach(function (other) {
        if (!TM.time.sameDay(other.start, start) && !TM.time.sameDay(other.end, start)) return;
        var os = other.start, oe = other.end;
        var overlap = Math.min(end.getTime(), oe.getTime()) - Math.max(start.getTime(), os.getTime());
        if (overlap > 0) {
          var m = Math.round(overlap / 60000);
          out.push({ type: 'hard', level: 'red', other: other, minutes: m, message: '与「' + other.title + '」重叠 ' + m + ' 分钟' });
          return;
        }
        var gap = null;
        if (oe.getTime() <= start.getTime()) gap = Math.round((start.getTime() - oe.getTime()) / 60000);
        else if (os.getTime() >= end.getTime()) gap = Math.round((os.getTime() - end.getTime()) / 60000);
        if (gap == null || gap > 180) return;
        var commute = store.estimateCommute(location, other.location);
        if (commute.minutes > 0 && location && other.location && gap < commute.minutes + 10 && gap < 90 && gap <= commute.minutes) {
          out.push({
            type: 'commute', level: 'orange', other: other, minutes: gap,
            message: '从「' + (other.location || '上一地点') + '」到「' + location + '」' + commute.text + '，当前仅间隔 ' + gap + ' 分钟',
            commute: commute
          });
        } else if (gap < 15) {
          out.push({ type: 'soft', level: 'orange', other: other, minutes: gap, message: '与「' + other.title + '」仅间隔 ' + gap + ' 分钟' });
        }
      });

    suggestSlots: function (opts) {
      var start = TM.time.parse(opts.start);

      var day = TM.time.startOfDay(start);
      var busy = alive(state.schedules).filter(function (s) {
        return s.id !== opts.excludeId && TM.time.sameDay(s.start, day) && !s.allDay;
      }).map(function (s) { return { s: s.start.getTime(), e: s.end.getTime() }; }).sort(function (a, b) { return a.s - b.s; });
      var slots = [];
      var cursor = new Date(day.getTime()); cursor.setHours(7, 0, 0, 0);
      var limit = new Date(day.getTime()); limit.setHours(22, 0, 0, 0);
      while (cursor.getTime() + dur * 60000 <= limit.getTime()) {

        }
        cursor = new Date(cs + 15 * 60000);
      }
      slots.sort(function (a, b) { return Math.abs(a.start - start) - Math.abs(b.start - start); });
      return slots.slice(0, opts.count || 3);
    },

    },
    removeTrip: function (id) {
      state.trips = state.trips.filter(function (t) { return t.id !== id; });
      alive(state.schedules).forEach(function (s) { if (s.tripId === id) s.tripId = null; });
      alive(state.transactions).forEach(function (t) { if (t.tripId === id) t.tripId = null; });
      markDirty(); save();
    },
    tripSpend: function (tripId) {
      var items = alive(state.transactions).filter(function (t) { return t.tripId === tripId && t.direction === 'expense'; });
      var total = items.reduce(function (sum, t) { return sum + t.amount; }, 0);
      var trip = store.getTrip(tripId);
      var people = (trip && trip.people) || 1;
      return { total: total, perPerson: Math.round(total / people * 100) / 100, items: items, people: people };
    },

    /* ---- 消费 ---- */
    transactions: function (opts) {
      opts = opts || {};
      return alive(state.transactions).filter(function (t) {
        if (opts.month && monthKey(t.occurredAt) !== opts.month) return false;
        if (opts.tripId && t.tripId !== opts.tripId) return false;
        if (opts.category && t.category !== opts.category) return false;
        if (opts.direction && t.direction !== opts.direction) return false;
        return true;
      }).sort(function (a, b) { return b.occurredAt - a.occurredAt; });
    },
    addTransaction: function (data) {
      var t = {
        id: data.id || TM.util.uid('tx'),
        amount: Math.abs(Number(data.amount) || 0),
        currency: data.currency || 'CNY',
        category: data.category || '其他',
        occurredAt: TM.time.parse(data.occurredAt || new Date()),
        merchant: data.merchant || data.category || '日常支出',
        note: data.note || '',
        tripId: data.tripId || null,
        source: data.source || 'manual',
        direction: data.direction || 'expense',
        autoLinked: !!data.autoLinked,
        createdAt: new Date()
      };
      if (t.direction === 'expense') {
        var guess = store.guessTripFor(t.occurredAt);
        if (!t.tripId && guess) { t.tripId = guess.id; t.autoLinked = true; }
      }
      state.transactions.push(t);
      markDirty(); save();
      store.checkBudgetAfterAdd(t);
      return t;
    },
    updateTransaction: function (id, patch) {
      var t = state.transactions.filter(function (x) { return x.id === id && !x.deletedAt; })[0];
      if (!t) return null;
      var p = Object.assign({}, patch);
      if (p.occurredAt) p.occurredAt = TM.time.parse(p.occurredAt);
      Object.assign(t, p);
      markDirty(); save();
      return t;
    },
    removeTransaction: function (id) {
      var t = state.transactions.filter(function (x) { return x.id === id; })[0];
      if (!t) return false;
      t.deletedAt = new Date();
      markDirty(); save();
      return true;
    },
    guessTripFor: function (when) {
      var d = TM.time.parse(when).getTime();
      return state.trips.filter(function (t) { return t.status !== 'canceled' && d >= t.start.getTime() && d <= t.end.getTime(); })[0];
    },
    categories: function () {
      return TM.CATEGORIES.map(function (c) {
        return { key: c.key, name: c.name, icon: c.icon, budget: (state.budgets.categories || {})[c.name] || c.budget };
      });
    },
    monthSummary: function (mk) {
      mk = mk || currentMonthKey();
      var list = store.transactions({ month: mk });
      var expense = 0, income = 0;
      var map = {};
      list.forEach(function (t) {
        if (t.direction === 'income') { income += t.amount; return; }
        expense += t.amount;
        if (!map[t.category]) map[t.category] = 0;
        map[t.category] += t.amount;
      });
      var budget = state.budgets.monthly || 0;
      var byCategory = store.categories().map(function (c) {
        return { key: c.key, name: c.name, icon: c.icon, spent: map[c.name] || 0, budget: c.budget };
      }).sort(function (a, b) { return b.spent - a.spent; });
      return {
        month: mk, expense: expense, income: income, balance: income - expense,
        budget: budget, ratio: TM.util.pct(expense, budget), byCategory: byCategory
      };
    },
    budgetStatus: function (category) {
      var sum = store.monthSummary();
      if (category) {
        var row = sum.byCategory.filter(function (c) { return c.name === category; })[0] || { spent: 0, budget: 0 };
        return { spent: row.spent, budget: row.budget, ratio: TM.util.pct(row.spent, row.budget), level: row.budget && row.spent >= row.budget ? 'over' : (row.budget && row.spent / row.budget >= 0.8 ? 'warn' : 'ok') };
      }
      return { spent: sum.expense, budget: sum.budget, ratio: sum.ratio, level: sum.budget && sum.expense >= sum.budget ? 'over' : (sum.budget && sum.expense / sum.budget >= 0.8 ? 'warn' : 'ok') };
    },
    setBudget: function (category, value) {
      var v = Math.max(0, Number(value) || 0);
      if (!category || category === 'monthly' || category === 'total') state.budgets.monthly = v;
      else state.budgets.categories[category] = v;
      save();
      return v;
    },
    subcategories: function (category) {
      if (!state.ledgerSubs) state.ledgerSubs = {};
      return state.ledgerSubs[category] || [];
    },
    addSubcategory: function (category, name) {
      name = String(name || '').trim();
      if (!category || !name) return false;
      if (!state.ledgerSubs) state.ledgerSubs = {};
      var list = state.ledgerSubs[category] || (state.ledgerSubs[category] = []);
      if (list.indexOf(name) >= 0) return false;
      list.push(name);
      save();
      return true;
    },
    removeSubcategory: function (category, name) {
      if (!state.ledgerSubs || !state.ledgerSubs[category]) return false;
      var list = state.ledgerSubs[category];
      var i = list.indexOf(name);
      if (i < 0) return false;
      list.splice(i, 1);
      save();
      return true;
    },
    checkBudgetAfterAdd: function (t) {      if (t.direction !== 'expense') return;
      var bs = store.budgetStatus();
      if (bs.level === 'warn' && !state.suggestionState.budgetNotified80) {
        state.suggestionState.budgetNotified80 = true;
        store.addNotification({ kind: 'ai', title: '预算提醒', body: '本月支出已达预算的 ' + bs.ratio + '%，主要来自' + (store.monthSummary().byCategory[0].name || '日常消费') + '。' });
      }
      var cat = store.budgetStatus(t.category);
      if (cat.level === 'warn' && !state.suggestionState['budgetNotified_' + t.category]) {
        state.suggestionState['budgetNotified_' + t.category] = true;
        store.addNotification({ kind: 'ai', title: t.category + '预算提醒', body: t.category + '支出已达预算的 ' + cat.ratio + '%，仅作提醒，不影响继续记账。' });
      }
    },

    /* ---- 小行建议（实时计算） ---- */
    suggestions: function () {
      var out = [];
      var todayKey = TM.time.todayKey();
      var todayList = store.schedulesOfDay(todayKey);
      var now = new Date();
      var ss = state.suggestionState || {};
      function visible(id) {
        var st = ss[id];
        if (!st) return true;
        if (st.forever) return false;
        if (st.adoptedAt) {
          var ad = now.getTime() - TM.time.parse(st.adoptedAt).getTime();
          if (ad < 24 * 3600000) return false;
        }
        if (st.ignoredAt) {
          var diff = now.getTime() - TM.time.parse(st.ignoredAt).getTime();
          return diff > 24 * 3600000;
        }
        return true;
      }

      /* 冲突消解 */
      var conflictPair = null;
      for (var i = 0; i < todayList.length; i++) {
        for (var j = i + 1; j < todayList.length; j++) {
          var a = todayList[i], b = todayList[j];
          var overlap = Math.min(a.end.getTime(), b.end.getTime()) - Math.max(a.start.getTime(), b.start.getTime());
          if (overlap > 0) { conflictPair = { a: a, b: b, minutes: Math.round(overlap / 60000) }; break; }
          var gap = Math.round((b.start.getTime() - a.end.getTime()) / 60000);
          if (gap >= 0 && gap < 15) { conflictPair = { a: a, b: b, minutes: gap, soft: true }; break; }
        }
        if (conflictPair) break;
      }
      if (conflictPair && visible('conflict')) {
        var c = conflictPair;
        var desc = c.soft ? '「' + c.b.title + '」与「' + c.a.title + '」仅间隔 ' + c.minutes + ' 分钟'
          : (c.commute ? '从「' + c.a.location + '」到「' + c.b.location + '」' + c.commute.text + '，当前仅间隔 ' + c.minutes + ' 分钟'
            : '「' + c.a.title + '」与「' + c.b.title + '」重叠 ' + c.minutes + ' 分钟');
        out.push({
          id: 'conflict', type: 'conflict', tone: 'orange',
          title: '今日有 1 处时间冲突', reason: desc,
          impact: '继续下去可能迟到或压缩会议时间，建议调整其中一个安排。',
          actions: [{ label: '一键改期', kind: 'primary' }, { label: '查看详情', kind: 'ghost' }],
          meta: { laterId: c.b.id, earlierId: c.a.id }
        });
      }

      /* 日程体检 */
      var todayHours = todayList.reduce(function (sum, s) { return sum + TM.time.diffMin(s.end, s.start); }, 0) / 60;
      var meetingCount = todayList.filter(function (s) { return s.category === 'meeting' || s.category === 'work'; }).length;
      if ((todayHours > 9 || meetingCount >= 5) && visible('schedule')) {
        out.push({
          id: 'schedule', type: 'schedule', tone: 'blue',
          title: '今日安排较满', reason: '今日共 ' + todayList.length + ' 个安排、约 ' + Math.round(todayHours * 10) / 10 + ' 小时，会议与工作占 ' + meetingCount + ' 项。',
          impact: '连续高强度安排容易压缩休息与用餐时间，建议合并低优先级沟通。',
          actions: [{ label: '优化日程', kind: 'primary' }, { label: '忽略', kind: 'ghost' }]
        });
      }

      /* 通勤优化 */
      var commutePair = null;
      for (var k = 1; k < todayList.length; k++) {
        var prev = todayList[k - 1], next = todayList[k];
        var gap2 = TM.time.diffMin(next.start, prev.end);
        var cm2 = store.estimateCommute(prev.location, next.location);
        if (cm2.minutes > 0 && gap2 > 0 && gap2 < cm2.minutes) { commutePair = { prev: prev, next: next, gap: gap2, cm: cm2 }; break; }
      }
      if (commutePair && visible('commute')) {
        out.push({
          id: 'commute', type: 'commute', tone: 'orange',
          title: '通勤时间可能不足', reason: '从「' + commutePair.prev.location + '」到「' + commutePair.next.location + '」' + commutePair.cm.text + '，当前仅间隔 ' + commutePair.gap + ' 分钟。',
          impact: '建议提前出发或调整为线上进行，避免影响下一场安排。',
          actions: [{ label: '设置出发提醒', kind: 'primary' }, { label: '忽略', kind: 'ghost' }],
          meta: { scheduleId: commutePair.next.id }
        });
      }

      /* 费用提醒 */
      var bs = store.budgetStatus();
      if (bs.ratio >= 80 && visible('budget')) {
        var top = store.monthSummary().byCategory.filter(function (c) { return c.spent > 0; })[0];
        out.push({
          id: 'budget', type: 'budget', tone: 'orange',
          title: '本月预算已用 ' + bs.ratio + '%', reason: '本月支出 ' + TM.util.money(bs.spent) + '，预算 ' + TM.util.money(bs.budget) + '，主要来自' + (top ? top.name : '日常消费') + '。',
          impact: '按当前节奏月底可能超支，建议查看明细或调整分类预算。',
          actions: [{ label: '查看预算', kind: 'primary' }, { label: '标记合理', kind: 'ghost' }]
        });
      }

      /* 健康节奏 */
      var load = store.computeLoad(todayKey);
      if ((load.index >= 60 || (state.health.metrics.sleep > 0 && state.health.metrics.sleep < 6)) && visible('health')) {
        out.push({
          id: 'health', type: 'health', tone: 'green',
          title: '本周负荷偏高', reason: '今日负荷指数 ' + load.index + '（' + load.level + '），' + (state.health.metrics.sleep < 6 ? '昨晚睡眠不足 6 小时，' : '') + '连续多日安排密集。',
          impact: '建议明晚 20:00 留出 1 小时休息，避免负荷持续累积。',
          actions: [{ label: '插入休息块', kind: 'primary' }, { label: '忽略', kind: 'ghost' }]
        });
      }

      /* 周复盘 */
      var wd = now.getDay();
      if ((wd === 0 || wd === 1) && visible('weekly')) {
        out.push({
          id: 'weekly', type: 'weekly', tone: 'blue',
          title: '本周复盘已生成', reason: '本周完成 ' + store.weekCompleted() + ' 个安排，会议占比 ' + store.meetingRatio() + '%。',
          impact: '回看本周时间分配，为下周留出更合理的缓冲。',
          actions: [{ label: '查看周报', kind: 'primary' }, { label: '暂不查看', kind: 'ghost' }]
        });
      }
      return out;
    },
    adoptSuggestion: function (id) {
      var sug = store.suggestions().filter(function (s) { return s.id === id; })[0];
      if (!sug) return { ok: false, message: '建议已失效' };
      adoptSnapshot = { token: TM.util.uid('undo'), schedules: deepClone(state.schedules), at: Date.now() };
      var result = { ok: true, message: '', undoToken: adoptSnapshot.token };
      if (id === 'conflict') {
        var later = store.getSchedule(sug.meta.laterId);
        if (later) {
          var slots = store.suggestSlots({ dateKey: TM.time.key(later.start), start: later.start, end: later.end, excludeId: later.id, count: 1 });
          if (slots.length) {
            store.updateSchedule(later.id, { start: slots[0].start, end: slots[0].end });
            result.message = '已将「' + later.title + '」调整到 ' + slots[0].label;
          } else {
            store.updateSchedule(later.id, { start: TM.time.addMin(later.start, 30), end: TM.time.addMin(later.end, 30) });
            result.message = '已将「' + later.title + '」顺延 30 分钟，请复核';
          }
        }
      } else if (id === 'schedule') {
        var todayList = store.schedulesOfDay(TM.time.todayKey());
        var target = todayList.filter(function (s) { return s.category === 'work' && !s.important; })[0] || todayList[todayList.length - 1];
        if (target) {
          store.updateSchedule(target.id, { end: TM.time.addMin(target.end, 15) });
          result.message = '已为「' + target.title + '」增加 15 分钟缓冲';
        }
      } else if (id === 'commute') {
        var s = store.getSchedule(sug.meta.scheduleId);
        if (s) {
          s.reminder = Object.assign({}, s.reminder, { departure: true, advance: 30 });
          store.save();
          result.message = '已为「' + s.title + '」设置出发提醒';
        }
      } else if (id === 'budget') {
        result.message = '已打开预算卡';
        result.route = '#/budgets';
        adoptSnapshot = null;
      } else if (id === 'health') {
        var restStart = TM.time.at(TM.time.key(TM.time.addDays(new Date(), 1)), '20:00');
        store.addSchedule({
          title: '健康休息时间', location: '家', start: restStart, end: TM.time.addMin(restStart, 60),
          category: 'health', source: 'manual', note: '由小行建议插入的健康时间块'
        });
        result.message = '已插入明晚 20:00 的健康休息块';
      } else if (id === 'weekly') {
        result.message = '已打开周报';
        result.route = '#/weekly';
        adoptSnapshot = null;
      }
      state.suggestionState[id] = Object.assign({}, state.suggestionState[id], { adoptedAt: new Date() });
      save();
      return result;
    },
    undoAdopt: function (token) {
      if (!adoptSnapshot || adoptSnapshot.token !== token) return false;
      if (Date.now() - adoptSnapshot.at > 10 * 60000) { adoptSnapshot = null; return false; }
      state.schedules = rehydrateDates(adoptSnapshot.schedules);
      Object.keys(state.suggestionState || {}).forEach(function (id) {
        if (state.suggestionState[id] && state.suggestionState[id].adoptedAt) delete state.suggestionState[id].adoptedAt;
      });
      adoptSnapshot = null;
      save();
      return true;
    },
    ignoreSuggestion: function (id, forever) {
      var st = state.suggestionState[id] || {};
      st.ignoredAt = new Date();
      st.count = (st.count || 0) + 1;
      if (forever) st.forever = true;
      state.suggestionState[id] = st;
      save();
    },
    dismissedSuggestions: function () {
      var now = new Date();
      return Object.keys(state.suggestionState || {}).filter(function (id) {
        var st = state.suggestionState[id];
        if (!st || (!st.forever && !st.ignoredAt)) return false;
        if (st.forever) return true;
        return now.getTime() - TM.time.parse(st.ignoredAt).getTime() <= 24 * 3600000;
      }).map(function (id) {
        return { id: id, forever: !!state.suggestionState[id].forever, count: state.suggestionState[id].count || 1, ignoredAt: state.suggestionState[id].ignoredAt || null };
      });
    },
    restoreSuggestion: function (id) {
      if (state.suggestionState[id]) {
        if (state.suggestionState[id].forever) { state.suggestionState[id].forever = false; state.suggestionState[id].ignoredAt = null; }
        else delete state.suggestionState[id];
        save();
      }
    },
    clearDismissed: function () {
      Object.keys(state.suggestionState || {}).forEach(function (id) {
        if (state.suggestionState[id] && (state.suggestionState[id].forever || state.suggestionState[id].ignoredAt)) {
          delete state.suggestionState[id];
        }
      });
      save();
    },

    /* ---- 健康 ---- */
    computeLoad: function (dateKey) {
      dateKey = dateKey || TM.time.todayKey();
      var list = store.schedulesOfDay(dateKey);
      var minutes = list.reduce(function (sum, s) { return sum + TM.time.diffMin(s.end, s.start); }, 0);
      var hours = minutes / 60;
      var meetings = list.filter(function (s) { return s.category === 'meeting' || s.category === 'work'; }).length;
      var crossCity = false;
      var cities = {};
      list.forEach(function (s) {
        CITIES.forEach(function (c) { if ((s.location || '').indexOf(c) >= 0) cities[c] = 1; });
        if (store.getTrip(s.tripId)) {
          var t = store.getTrip(s.tripId);
          if (t.destination) cities[t.destination] = 1;
        }
      });
      var cityList = Object.keys(cities);
      var homeCity = state.profile.city || '';
      crossCity = cityList.length > 1 || cityList.some(function (c) { return c !== homeCity; });
      var consecutive = 0;
      for (var d = 0; d < 7; d++) {
        var k = TM.time.key(TM.time.addDays(new Date(), -d));
        var list2 = store.schedulesOfDay(k);
        var h = list2.reduce(function (sum, s) { return sum + TM.time.diffMin(s.end, s.start); }, 0) / 60;
        if (h >= 8) consecutive++; else break;
      }
      var durationScore = Math.min(100, Math.round(hours / 10 * 100));
      var meetingScore = Math.min(100, Math.round(meetings / 6 * 100));
      var cityScore = crossCity ? 80 : (list.length ? 20 : 0);
      var streakScore = Math.min(100, Math.round(consecutive / 5 * 100));
      var index = Math.round(durationScore * 0.4 + meetingScore * 0.25 + cityScore * 0.2 + streakScore * 0.15);
      var level = index < 35 ? '轻松' : index < 60 ? '适中' : index < 80 ? '偏高' : '过载';
      var tone = index < 35 ? 'green' : index < 60 ? 'blue' : index < 80 ? 'orange' : 'red';
      return {
        index: index, level: level, tone: tone, minutes: minutes, meetings: meetings,
        factors: [
          { label: '日程总时长', weight: 40, score: durationScore, detail: Math.round(hours * 10) / 10 + ' 小时' },
          { label: '会议密度', weight: 25, score: meetingScore, detail: meetings + ' 场会议 / 工作' },
          { label: '跨城出行', weight: 20, score: cityScore, detail: crossCity ? '存在跨城行程' : '同城活动' },
          { label: '连续工作天数', weight: 15, score: streakScore, detail: consecutive + ' 天' }
        ]
      };
    },
    health: function () { return state.health; },
    logHealthMetric: function (type, value) {
      if (!state.health.metrics) state.health.metrics = {};
      state.health.metrics[type] = Number(value) || 0;
      if (type === 'steps') {
        state.health.weekSteps = (state.health.weekSteps || []).concat([Number(value) || 0]).slice(-7);
      }
      markDirty(); save();
    },
    setHealthGoal: function (type, value) {
      state.health.goals[type] = Number(value) || 0;
      save();
    },
    toggleHealthReminder: function (key) {
      state.health.reminders[key] = !state.health.reminders[key];
      save();
      return state.health.reminders[key];
    },
    weekCompleted: function () {
      var start = TM.time.addDays(new Date(), -((new Date().getDay() + 6) % 7));
      var count = 0;
      for (var d = 0; d < 7; d++) {
        var k = TM.time.key(TM.time.addDays(start, d));
        var list = store.schedulesOfDay(k);
        count += list.filter(function (s) { return s.status === 'done' || (s.end < new Date() && s.status !== 'canceled'); }).length;
      }
      return count;
    },
    meetingRatio: function () {
      var total = 0, meet = 0;
      for (var d = 0; d < 7; d++) {
        var k = TM.time.key(TM.time.addDays(new Date(), -d));
        var list = store.schedulesOfDay(k);
        total += list.length;
        meet += list.filter(function (s) { return s.category === 'meeting' || s.category === 'work'; }).length;
      }
      return total ? Math.round(meet / total * 100) : 0;
    },

    /* ---- 通知 ---- */
    notifications: function () {
      return state.notifications.slice().sort(function (a, b) { return b.at - a.at; });
    },
    unreadCount: function () { return state.notifications.filter(function (n) { return !n.read; }).length; },
    markRead: function (id) {
      var n = state.notifications.filter(function (x) { return x.id === id; })[0];
      if (n) { n.read = true; save(); }
    },
    markAllRead: function () {
      state.notifications.forEach(function (n) { n.read = true; });
      save();
    },
    addNotification: function (data) {
      state.notifications.unshift({
        id: TM.util.uid('nt'), kind: data.kind || 'system', title: data.title || '通知',
        body: data.body || '', at: new Date(), read: !!data.read
      });
      if (state.notifications.length > 60) state.notifications.length = 60;
      save();
    },
    removeNotification: function (id) {
      state.notifications = state.notifications.filter(function (n) { return n.id !== id; });
      save();
    },

    /* ---- 速记 ---- */
    voiceNotes: function () { return state.voiceNotes.slice().sort(function (a, b) { return b.at - a.at; }); },
    addVoiceNote: function (data) {
      var vn = { id: TM.util.uid('vn'), text: data.text || '', status: data.status || 'pending', at: new Date() };

      save();
      return vn;
    },
    clearVoiceNotes: function () { state.voiceNotes = []; save(); },

    /* ---- 同步 / 设置 ---- */
    setOnline: function (online) {
      state.sync.online = !!online;
      save();
      if (online) scheduleAutoSync();
    },
    triggerSync: function () {
      var self = this;
      return new Promise(function (resolve, reject) {
        if (!state.sync.online) { reject(new Error('当前离线，无法同步')); return; }
        setTimeout(function () {
          state.sync.lastSync = new Date();
          state.sync.pending = 0;
          save();
          resolve(state.sync);
        }, 800);
      });
    },
    updateSettings: function (patch) {
      Object.assign(state.settings, patch);
      save();
    },
    exportJSON: function () {
      return JSON.stringify(state, null, 2);
    },
    exportCSV: function () {
      var lines = [];
      lines.push('类型,标题,开始时间,结束时间,地点,分类,状态,金额,币种,方向');
      alive(state.schedules).sort(byStart).forEach(function (s) {
        lines.push(['日程', s.title, TM.time.fmt(s.start, 'ymd') + ' ' + TM.time.fmt(s.start, 'time'), TM.time.fmt(s.end, 'ymd') + ' ' + TM.time.fmt(s.end, 'time'), s.location, s.category, s.status, '', '', ''].map(csvCell).join(','));
      });
      alive(state.transactions).sort(function (a, b) { return a.occurredAt - b.occurredAt; }).forEach(function (t) {
        lines.push(['交易', t.merchant, TM.time.fmt(t.occurredAt, 'ymd') + ' ' + TM.time.fmt(t.occurredAt, 'time'), '', '', t.category, t.direction, t.amount, t.currency, t.direction === 'income' ? '收入' : '支出'].map(csvCell).join(','));
      });
      return { name: '行程管家_数据导出_' + TM.time.todayKey() + '.csv', content: lines.join('\r\n'), mime: 'text/csv;charset=utf-8' };
    },
    searchAll: function (q) {
      q = String(q || '').trim().toLowerCase();
      var out = { schedules: [], trips: [], transactions: [], voiceNotes: [] };
      if (!q) return out;
      var hit = function (s) { return String(s || '').toLowerCase().indexOf(q) >= 0; };
      out.schedules = alive(state.schedules).filter(function (s) {
        return hit(s.title) || hit(s.location) || hit(s.note) || (s.participants || []).some(hit) ||
          (q.replace(/[^\d.]/g, '') && String(s.title).indexOf(q) >= 0);
      }).sort(byStart);
      out.trips = state.trips.filter(function (t) { return hit(t.title) || hit(t.destination) || hit(t.note); });
      out.transactions = alive(state.transactions).filter(function (t) {
        return hit(t.merchant) || hit(t.note) || hit(t.category) || String(t.amount) === q;
      });
      out.voiceNotes = state.voiceNotes.filter(function (v) { return hit(v.text); });
      return out;
    }
  };

    v = String(v == null ? '' : v);

  }

  state = load();
  TM.store = store;
  // 首次运行写入本地
  try {
    if (!localStorage.getItem(KEY)) save();
  } catch (e) { /* ignore */ }
})();

      ovl.querySelector('[data-ovl-scrim]').addEventListener('click', function () { closeTop(); });
    }
    root.appendChild(ovl);
    overlayStack.push({ el: ovl, onClose: onClose || null });
    updateFab(location.hash, current && current.def);
    return ovl;
  }
  function closeTop() {
    var top = overlayStack.pop();
    if (!top) return;
    if (top.onClose) { try { top.onClose(); } catch (e) { /* ignore */ } }
    top.el.style.opacity = '0';
    top.el.style.transition = 'opacity .16s ease';
    setTimeout(function () { if (top.el.parentNode) top.el.parentNode.removeChild(top.el); }, 160);
    if (!overlayStack.length) updateFab(location.hash, current && current.def);
  }
  ui.closeOverlay = closeTop;
  ui.overlayCount = function () { return overlayStack.length; };

  function buildActions(actions, close) {
    if (!actions || !actions.length) return '';
    return '<div class="modal__actions">' + actions.map(function (a, i) {
      var cls = a.kind === 'primary' ? 'btn btn--primary' : (a.kind === 'danger' ? 'btn btn--danger' : 'btn btn--ghost');
      return '<button class="' + cls + '" data-mact="' + i + '">' + TM.util.esc(a.label || '确定') + '</button>';
    }).join('') + '</div>';
  }
  function bindActions(root, actions, close) {
    if (!actions || !actions.length) return;
    root.querySelectorAll('[data-mact]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var i = Number(btn.dataset.mact);
        var action = actions[i];
        if (action && typeof action.onClick === 'function') action.onClick(close);
        else close();
      });
    });
  }

  ui.openModal = function (opts) {
    opts = opts || {};
    var html = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + TM.util.esc(opts.title || '弹窗') + '">' +
      (opts.title ? '<div class="modal__title">' + TM.util.esc(opts.title) + '</div>' : '') +
      (opts.subtitle ? '<div class="modal__sub">' + TM.util.esc(opts.subtitle) + '</div>' : '') +
      '<div class="modal__body">' + (opts.body || '') + '</div>' +
      buildActions(opts.actions, null) + '</div>';
    var ovl = pushOverlay(html, opts.dismissible !== false, opts.onClose);
    var modal = ovl.querySelector('.modal');
    var closed = false;
    function close() {
      if (closed) return;
      closed = true;
      if (overlayStack.length && overlayStack[overlayStack.length - 1].el === ovl) closeTop();
      else if (ovl.parentNode) ovl.parentNode.removeChild(ovl);
      if (opts.onClose) { try { opts.onClose(); } catch (e) { /* ignore */ } }
    }
    bindActions(modal, opts.actions, close);
    if (opts.onMount) {
      try { opts.onMount(modal, close); } catch (e) { if (window.console) console.error(e); }
    }
    return close;
  };

  ui.openSheet = function (opts) {
    opts = opts || {};
    var html = '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + TM.util.esc(opts.title || '底部弹层') + '">' +

      (opts.title ? '<div class="sheet__title">' + TM.util.esc(opts.title) + '</div>' : '') +
      (opts.subtitle ? '<div class="sheet__sub">' + TM.util.esc(opts.subtitle) + '</div>' : '') +
      '<div class="sheet__body">' + (opts.body || '') + '</div>' +
      ((opts.actions && opts.actions.length)
        ? '<div class="sheet__actions">' + opts.actions.map(function (a, i) {
          var cls = a.kind === 'primary' ? 'btn btn--primary' : (a.kind === 'danger' ? 'btn btn--danger' : 'btn btn--ghost');
          return '<button class="' + cls + '" data-mact="' + i + '">' + TM.util.esc(a.label || '确定') + '</button>';
        }).join('') + '</div>' : '') + '</div>';
    var ovl = pushOverlay(html, opts.dismissible !== false, opts.onClose);
    var sheet = ovl.querySelector('.sheet');
    var closed = false;
    function close() {
      if (closed) return;
      closed = true;
      if (overlayStack.length && overlayStack[overlayStack.length - 1].el === ovl) closeTop();
      else if (ovl.parentNode) ovl.parentNode.removeChild(ovl);
      if (opts.onClose) { try { opts.onClose(); } catch (e) { /* ignore */ } }
    }
    bindActions(sheet, opts.actions, close);
    if (opts.onMount) {
      try { opts.onMount(sheet, close); } catch (e) { if (window.console) console.error(e); }
    }
    // 下滑关闭（简单手势）
    var startY = null;
    sheet.addEventListener('touchstart', function (e) { startY = e.touches[0].clientY; }, { passive: true });
    sheet.addEventListener('touchend', function (e) {
      if (startY == null) return;
      var dy = e.changedTouches[0].clientY - startY;
      startY = null;
      if (dy > 80) close();
    });
    return close;
  };

  ui.openCustom = function (html, opts) {
    opts = opts || {};
    var ovl = pushOverlay(html, opts.dismissible !== false, opts.onClose);
    var root = ovl.querySelector('.ovl-body') || ovl.lastElementChild || ovl;
    var closed = false;
    function close() {

      else if (ovl.parentNode) ovl.parentNode.removeChild(ovl);
      if (opts.onClose) { try { opts.onClose(); } catch (e) { /* ignore */ } }
    }
    if (opts.onMount) {
      try { opts.onMount(root, close); } catch (e) { if (window.console) console.error(e); }
    }
    return { root: root, ovl: ovl, close: close };
  };

  ui.confirm = function (opts) {    opts = opts || {};
    return new Promise(function (resolve) {

      ui.openModal({

          { label: opts.confirmText || '确认', kind: opts.danger ? 'danger' : 'primary', onClick: function (close) { if (!done) { done = true; resolve(true); } close(); } }
        ]

  };

  };
  TM.ui = ui;

})();
