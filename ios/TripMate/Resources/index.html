      '<input class="input" id="voice-text" placeholder="也可以直接输入一句话" autocomplete="off">' +
      '<button class="btn btn--primary" id="voice-go" aria-label="发送并解析">' + TM.icon('arrow-up', 18) + '</button>' +
      '</div>' +
      '<div class="voice-tip">首次使用会请求麦克风权限；语音识别由浏览器提供，仅用于生成文字。麦克风不可用时可直接输入。</div>' +
      '</div></div>';
    var closeVoice = null;
    var o = TM.ui.openCustom(html, {
      dismissible: false,
      onClose: function () {
        voiceOpen = false;
        clearInterval(typingTimer); typingTimer = null;
        clearTimeout(parseTimer); parseTimer = null;
        stopAll();
        if (keyHandler) document.removeEventListener('keydown', keyHandler);
      },
      onMount: function (root, close) {
        closeVoice = close;
        voiceOpen = true;
        micUi.wave = root.querySelector('.voice-wave');
        micUi.state = root.querySelector('#voice-state');
        micUi.live = root.querySelector('#voice-live');
        micUi.timer = root.querySelector('#voice-timer');
        micUi.tip = root.querySelector('#voice-mic-tip');
        micUi.btn = root.querySelector('#voice-record');
        micUi.btnLabel = root.querySelector('#voice-record-label');
        micUi.input = root.querySelector('#voice-text');
        function onKey(e) { if (e.key === 'Escape') close(); }
        keyHandler = onKey;
        document.addEventListener('keydown', onKey);
        root.querySelector('[data-vclose]').addEventListener('click', close);
        root.querySelector('[data-vnotes]').addEventListener('click', function () { close(); TM.ui.go('#/voice-notes'); });
        var input = micUi.input;
        var send = root.querySelector('#voice-go');
        function go() {
          var t = (input.value || '').trim();
          if (!t) { TM.ui.toast('请说一句话，或输入一句话'); input.focus(); return; }
          abortRecording();
          speak(t, root, close);
        }
        send.addEventListener('click', go);
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
        root.querySelectorAll('[data-ex]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            abortRecording();
            speak(btn.dataset.ex, root, close);
          });
        });
        micUi.btn.addEventListener('click', startRecording);
        root.querySelector('.voice-stage').addEventListener('click', function (e) {
          if (e.target.closest('button')) return;
          if (!mic.recording) startRecording();
        });
      }
    });
    return o;
  }
  function speak(text, root, close) {
    if (!root || !root.isConnected) { voiceOpen = false; return; }
    root.querySelectorAll('button, input').forEach(function (el) { el.disabled = true; });
    var live = root.querySelector('#voice-live');
    var stateEl = root.querySelector('.voice-state');
    live.textContent = '';
    stateEl.textContent = '正在转写…';
    var i = 0;
    clearInterval(typingTimer);
    typingTimer = setInterval(function () {
      if (!live || !live.isConnected) { clearInterval(typingTimer); typingTimer = null; return; }
      i += 1;
      live.textContent = text.slice(0, i);
      if (i >= text.length) {
        clearInterval(typingTimer);
        typingTimer = null;
        stateEl.textContent = '小行正在整理…';
        var wave = root.querySelector('.voice-wave');
        if (wave) wave.classList.add('voice-wave--parsing');
        parseTimer = setTimeout(function () {
          parseTimer = null;
          close();
          handleText(text);
        }, 850);
      }
    }, 45);
  }

  /* ---------------- 意图路由 ---------------- */
  function forceModeIntent(p) {
    if (currentMode === 'expense' && p.intent !== 'expense') {
      var m = /(\d+(?:\.\d+)?)/.exec(p.raw);
      p.intent = 'expense';
      p.slots.amount = m ? parseFloat(m[1]) : null;
      p.slots.category = /打车|地铁|机票|高铁|加油/.test(p.raw) ? '交通' : (/饭|餐|咖啡|奶茶/.test(p.raw) ? '餐饮' : '其他');
      p.slots.title = '语音记账';
      p.confidence = p.slots.amount != null ? 0.86 : 0.5;
      if (p.slots.amount == null) p.missing.push('amount');
    }
    if (currentMode === 'health' && p.intent !== 'health') {
      p.intent = 'health';
      p.slots.metric = /水|喝/.test(p.raw) ? 'water' : (/睡/.test(p.raw) ? 'sleep' : 'steps');
      var mm = /(\d+(?:\.\d+)?)/.exec(p.raw);
      p.slots.amount = mm ? parseFloat(mm[1]) : null;
      p.confidence = 0.8;
    }
  }
  function handleText(text) {
    var p = TM.nlp.parse(text);
    forceModeIntent(p);
    if (!TM.store.sync.online) {
      TM.store.addVoiceNote({ text: text, status: 'pending' });
      TM.ui.toast('当前离线，已存入本地速记箱，联网后自动解析');
      return;
    }
    if (p.intent === 'create') handleCreate(p, 0);
    else if (p.intent === 'update') handleUpdate(p, 0);
    else if (p.intent === 'cancel') handleCancel(p);
    else if (p.intent === 'query') handleQuery(p);
    else if (p.intent === 'expense') handleExpense(p);
    else if (p.intent === 'health') handleHealth(p);
    else openIntentChooser(text, p);
  }
  function saveAsNote(text) {
    TM.store.addVoiceNote({ text: text, status: 'pending' });
    TM.ui.toast('已存入速记箱，稍后可继续完善');
  }

  /* ---------------- 新建确认 ---------------- */
  function handleCreate(p, rounds) {
    var start = p.slots.start;
    if (!start && rounds < 2) {
      askTime(p, rounds, '这件事安排在什么时候？', '小行还差一个开始时间', function () { handleCreate(p, rounds + 1); });
      return;
    }
    if (!start) {
      var d = TM.time.addDays(new Date(), 1);
      start = TM.time.at(TM.time.key(d), '09:00');
      p.slots.inferred = true;
    }
    var end = p.slots.end || TM.time.addMin(start, 60);
    var guessTrip = TM.store.guessTripFor(start);
    var draft = {
      raw: p.raw,
      title: p.slots.title || '',
      start: start,
      end: end,
      location: p.slots.location || '',
      participants: (p.slots.participants || []).join('、'),
      category: p.slots.category || 'work',
      reminder: 15,
      tripId: guessTrip ? guessTrip.id : '',
      inferredTime: !!p.slots.inferred
    };
    openCreateSheet(draft, p);
  }
  function askTime(p, rounds, title, subtitle, onDone) {
    var now = new Date();
    var options = [
      { label: '今天 15:00', start: TM.time.at(TM.time.todayKey(), '15:00') },
      { label: '今天 19:00', start: TM.time.at(TM.time.todayKey(), '19:00') },
      { label: '明天 09:00', start: TM.time.at(TM.time.key(TM.time.addDays(now, 1)), '09:00') },
      { label: '明天 14:00', start: TM.time.at(TM.time.key(TM.time.addDays(now, 1)), '14:00') },
      { label: '下周一 10:00', start: (function () { var d = TM.time.addDays(now, ((8 - now.getDay()) % 7) || 7); return TM.time.at(TM.time.key(d), '10:00'); })() }
    ];
    var sheet = TM.ui.openSheet({
      title: title,
      subtitle: subtitle,
      body: '<div class="chips wrap" style="gap:10px">' + options.map(function (o, i) {
        return '<button class="chip" data-t="' + i + '">' + o.label + '</button>';
      }).join('') + '</div>' +
        '<label class="field mt16"><span class="field-k">或精确到分钟</span><input class="input" type="datetime-local" id="ask-time"></label>',
      actions: [
        { label: '就用这个时间', kind: 'primary', onClick: function (close) { applyTime(0); close(); } },
        { label: '先存为速记', kind: 'ghost', onClick: function (close) { close(); saveAsNote(p.raw); } }
      ],
      onMount: function (root, close) {
        root.querySelectorAll('[data-t]').forEach(function (btn) {
          btn.addEventListener('click', function () { applyTime(Number(btn.dataset.t)); close(); });
        });
        function applyTime(idx) {
          var custom = parseLocal((root.querySelector('#ask-time') || {}).value);
          var chosen = custom || options[idx || 0].start;
          p.slots.start = chosen;
          p.slots.end = TM.time.addMin(chosen, 60);
          p.slots.inferred = !custom;
          if (onDone) onDone();
        }
      }
    });
    return sheet;
  }

  function openCreateSheet(draft, p) {
    var body =
      '<div class="voice-quote">“' + esc(draft.raw) + '”</div>' +
      '<div id="vc-conflict" class="mt12"></div>' +
      '<label class="field"><span class="field-k">事件名称 <em>*</em>' + (draft.title ? '' : '<span class="tag tag--orange">待确认</span>') + '</span>' +
      '<input class="input" id="vc-title" placeholder="给这件事起个名字" value="' + esc(draft.title) + '"></label>' +
      '<label class="field"><span class="field-k">开始时间 ' + (draft.inferredTime ? '<span class="tag tag--orange">推断</span>' : '') + '</span>' +
      '<input class="input" type="datetime-local" id="vc-start" value="' + dtLocal(draft.start) + '"></label>' +
      '<div class="chips mt8">' + [
        ['明天 09:00', 1, '09:00'], ['明天 14:00', 1, '14:00'], ['今天 18:00', 0, '18:00']
      ].map(function (q) {
        var d = TM.time.addDays(new Date(), q[1]);
        return '<button class="chip chip--soft" data-qtime="' + dtLocal(TM.time.at(TM.time.key(d), q[2])) + '">' + q[0] + '</button>';
      }).join('') + '</div>' +
      '<div class="form-row mt12"><label class="field"><span class="field-k">持续时长</span>' +
      '<select class="input" id="vc-dur">' + [30, 45, 60, 90, 120].map(function (n) {
        var cur = Math.max(15, TM.time.diffMin(draft.end, draft.start));
        return '<option value="' + n + '"' + (n === cur ? ' selected' : '') + '>' + n + ' 分钟</option>';
      }).join('') + '</select></label>' +
      '<label class="field"><span class="field-k">提醒</span><select class="input" id="vc-rem">' +
      [0, 15, 30, 60].map(function (n) { return '<option value="' + n + '"' + (n === 15 ? ' selected' : '') + '>' + (n === 0 ? '不提醒' : '提前 ' + n + ' 分钟') + '</option>'; }).join('') +
      '</select></label></div>' +
      '<label class="field"><span class="field-k">地点</span><input class="input" id="vc-loc" placeholder="添加地点" value="' + esc(draft.location) + '">' +
      '<div class="chips mt8">' + recentLocations().slice(0, 4).map(function (loc) {
        return '<button class="chip chip--soft" data-loc="' + esc(loc) + '">' + esc(loc) + '</button>';
      }).join('') + '</div></label>' +
      '<label class="field"><span class="field-k">参与人</span><input class="input" id="vc-people" placeholder="选填，多人用顿号分隔" value="' + esc(draft.participants) + '"></label>' +
      '<div class="form-row mt12"><label class="field"><span class="field-k">分类</span><select class="input" id="vc-cat">' + categoryOptions(draft.category) + '</select></label>' +
      '<label class="field"><span class="field-k">关联行程</span><select class="input" id="vc-trip">' + tripsOptions(draft.tripId) + '</select></label></div>';

    var sheetEl = null;
    var sheet = TM.ui.openSheet({
      title: '确认行程信息',
      subtitle: '小行已整理，请确认或修改',
      body: body,
      actions: [
        { label: '确认写入', kind: 'primary', onClick: function (close) { if (sheetEl) commitCreate(close, sheetEl); } },
        { label: '继续补充', kind: 'ghost', onClick: function (close) { close(); clarifyMore(draft, p); } },
        { label: '转文字速记', kind: 'ghost', onClick: function (close) { close(); saveAsNote(draft.raw); } }
      ],
      onMount: function (root) {
        sheetEl = root;
        function refresh() {
          updateCreateConflict(root, draft);
        }
        root.querySelectorAll('[data-qtime]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var v = btn.dataset.qtime;
            root.querySelector('#vc-start').value = v;
            refresh();
          });
        });
        root.querySelectorAll('[data-loc]').forEach(function (btn) {
          btn.addEventListener('click', function () { root.querySelector('#vc-loc').value = btn.dataset.loc; });
        });
        ['vc-title', 'vc-start', 'vc-loc', 'vc-people', 'vc-cat', 'vc-trip'].forEach(function (id) {
          var el = root.querySelector('#' + id);
          if (el) el.addEventListener('input', refresh);
        });
        var dur = root.querySelector('#vc-dur');
        if (dur) dur.addEventListener('change', refresh);
        refresh();
      }
    });
    return sheet;
  }

  function readCreateDraft(root, draft) {
    var title = (root.querySelector('#vc-title').value || '').trim();
    var start = parseLocal(root.querySelector('#vc-start').value);
    var dur = Number(root.querySelector('#vc-dur').value) || 60;
    draft.title = title;
    draft.start = start || draft.start;
    draft.end = TM.time.addMin(draft.start, dur);
    draft.location = (root.querySelector('#vc-loc').value || '').trim();
    draft.participants = (root.querySelector('#vc-people').value || '').trim();
    draft.category = root.querySelector('#vc-cat').value;
    draft.tripId = root.querySelector('#vc-trip').value;
    draft.reminder = Number(root.querySelector('#vc-rem').value);
    return draft;
  }
  function updateCreateConflict(root, draft) {
    var box = root.querySelector('#vc-conflict');
    if (!box) return;
    var d = readCreateDraft(root, Object.assign({}, draft));
    var start = parseLocal(root.querySelector('#vc-start').value) || draft.start;
    var dur = Number(root.querySelector('#vc-dur').value) || 60;
    var conflicts = TM.store.checkConflicts({ start: start, end: TM.time.addMin(start, dur), location: d.location }, null);
    var hard = conflicts.filter(function (c) { return c.type === 'hard'; });
    var soft = conflicts.filter(function (c) { return c.type !== 'hard'; });
    if (hard.length) {
      var slots = TM.store.suggestSlots({ dateKey: TM.time.key(start), start: start, end: TM.time.addMin(start, dur), count: 3 });
      box.innerHTML = '<div class="banner banner--red">' + TM.icon('alert', 18) +
        '<div><b>时间冲突：' + esc(hard[0].message) + '</b>' +
        '<div class="small mt4">必须处理后才能写入，可一键改到以下时段：</div>' +
        '<div class="chips mt8">' + slots.map(function (s) {
          return '<button class="btn btn--xs btn--ghost" data-slot="' + s.start.toISOString() + '|' + s.end.toISOString() + '">' + s.label + '</button>';
        }).join('') + '</div></div></div>';
      box.querySelectorAll('[data-slot]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var p = btn.dataset.slot.split('|');
          root.querySelector('#vc-start').value = dtLocal(p[0]);
          root.querySelector('#vc-dur').value = String(TM.time.diffMin(p[1], p[0]));
          updateCreateConflict(root, draft);
        });
      });
    } else if (soft.length) {
      box.innerHTML = '<div class="banner banner--orange">' + TM.icon('alert', 18) +
        '<div><b>提醒：' + esc(soft[0].message) + '</b><div class="small mt4">不阻断创建，你可以继续保存或调整时间。</div></div></div>';
    } else {
      box.innerHTML = '<div class="banner banner--green">' + TM.icon('check', 18) + '<div>时间可用，未检测到冲突。</div></div>';
    }
  }
  function commitCreate(close, sheet) {
    var root = sheet;
    var draft = readCreateDraft(root, {
      title: '', start: new Date(), end: TM.time.addMin(new Date(), 60),
      location: '', participants: '', category: 'work', tripId: '', reminder: 15, raw: ''
    });
    if (!draft.title) {
      TM.ui.toast('请先填写事件名称');
      var t = root.querySelector('#vc-title'); if (t) t.focus();
      return;
    }
    var start = parseLocal(root.querySelector('#vc-start').value);
    if (!start) { TM.ui.toast('请选择有效的开始时间'); return; }
    var dur = Number(root.querySelector('#vc-dur').value) || 60;
    var conflicts = TM.store.checkConflicts({ start: start, end: TM.time.addMin(start, dur), location: draft.location }, null);
    var hard = conflicts.filter(function (c) { return c.type === 'hard'; });
    if (hard.length) {
      TM.ui.toast('仍有时间冲突，请先选择替代时段');
      updateCreateConflict(root, draft);
      return;
    }
    if (!TM.store.sync.online) {
      close();
      TM.store.addVoiceNote({ text: draft.raw || (draft.title + ' ' + TM.time.fmt(start, 'fulltime')), status: 'pending' });
      TM.ui.toast('当前离线，已存入本地速记箱，联网后自动解析');
      return;
    }
    var s = TM.store.addSchedule({
      title: draft.title,
      start: start,
      end: TM.time.addMin(start, dur),
      location: draft.location,
      participants: draft.participants ? draft.participants.split(/[、,，\s]+/).filter(Boolean) : [],
      category: draft.category,
      tripId: draft.tripId || null,
      reminder: { advance: draft.reminder, departure: true, geo: false, second: true, daily: false },
      source: 'voice'
    });
    close();
    TM.ui.go('#/today');
    TM.ui.toast('已加入今日日程' + (s.tripId ? '与行程' : ''), {
      action: {
        label: '撤销', onClick: function () {
          TM.store.removeSchedule(s.id);
          TM.ui.toast('已撤销写入');
        }
      }
    });
    TM.ui.haptic();
  }
  function clarifyMore(draft, p) {
    var body = '<div class="banner banner--blue">' + TM.icon('spark', 18) +
      '<div><b>还需要补充什么？</b><div class="small mt4">小行一次只问一个最关键的问题。</div></div></div>' +
      '<div class="mt12"><button class="btn btn--ghost btn--block" data-more="time">调整时间</button></div>' +
      '<div class="mt8"><button class="btn btn--ghost btn--block" data-more="title">补充事件名称</button></div>' +
      '<div class="mt8"><button class="btn btn--ghost btn--block" data-more="note">仅存为文字速记</button></div>';
    TM.ui.openSheet({
      title: '继续补充',
      body: body,
      actions: [{ label: '返回确认卡', kind: 'ghost' }],
      onMount: function (sheet, close) {
        sheet.querySelectorAll('[data-more]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            close();
            var kind = btn.dataset.more;
            if (kind === 'note') { saveAsNote(p.raw || draft.title); return; }
            if (kind === 'time') {
              askTime(p, 0, '改到什么时候？', '选择一个开始时间', function () { handleCreate(p, 1); });
              return;
            }
            var input = prompt('这件事叫什么？', draft.title || '');
            if (input) draft.title = input;
            p.slots.title = draft.title;
            openCreateSheet(draft, p);
          });
        });
      }
    });
  }

  /* ---------------- 修改 ---------------- */
  function findCandidates(title) {
    title = String(title || '').replace(/[「」《》"'“”]/g, '').trim();
    if (!title) return [];
    var list = TM.store.schedules().filter(function (s) { return s.end >= new Date(Date.now() - 86400000); });
    var exact = list.filter(function (s) { return s.title.indexOf(title) >= 0 || title.indexOf(s.title) >= 0; });
    if (exact.length) return exact;
    var chars = title.split('');
    return list.filter(function (s) {
      return chars.some(function (c) { return c && s.title.indexOf(c) >= 0; });
    });
  }
  function pickSchedule(candidates, title, onPick) {
    if (!candidates.length) {
      TM.ui.toast('没有找到「' + title + '」，可以说得再具体一些');
      return;
    }
    if (candidates.length === 1) { onPick(candidates[0]); return; }
    var body = '<div class="list">' + candidates.slice(0, 6).map(function (s) {
      return '<button class="li li--press" data-pick="' + s.id + '"><div class="li-main"><div class="li-t">' + esc(s.title) + '</div>' +
        '<div class="li-s">' + TM.time.fmt(s.start, 'fulltime') + (s.location ? ' · ' + esc(s.location) : '') + '</div></div>' +
        '<div class="li-arrow">' + TM.icon('chevron', 18) + '</div></button>';
    }).join('') + '</div>';
    TM.ui.openSheet({
      title: '要修改哪一个安排？',
      subtitle: '找到 ' + candidates.length + ' 个匹配的日程',
      body: body,
      onMount: function (sheet, close) {
        sheet.querySelectorAll('[data-pick]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var s = TM.store.getSchedule(btn.dataset.pick);
            close();
            if (s) onPick(s);
          });
        });
      }
    });
  }
  function handleUpdate(p, rounds) {
    var candidates = findCandidates(p.targetTitle || p.slots.title);
    if (!p.slots.start && rounds < 2) {
      askTime(p, rounds, '改到什么时候？', p.targetTitle ? '修改「' + p.targetTitle + '」' : '请选择新的时间');
      return;
    }
    if (!p.slots.start) { TM.ui.toast('没有识别到新的时间，请再说一次'); return; }
    pickSchedule(candidates, p.targetTitle || p.slots.title, function (target) {
      openUpdateSheet(target, p.slots.start, p.slots.end || TM.time.addMin(p.slots.start, 60));
    });
  }
  function openUpdateSheet(target, newStart, newEnd) {
    var body = '<div class="voice-quote">原安排：' + esc(target.title) + '<br>' + TM.time.fmt(target.start, 'fulltime') + '</div>' +
      '<div class="banner banner--blue mt12">' + TM.icon('repeat', 18) + '<div><b>改期确认</b><div class="small mt4">「' + esc(target.title) + '」将调整到：</div></div></div>' +
      '<label class="field"><span class="field-k">新的开始时间</span><input class="input" type="datetime-local" id="vu-start" value="' + dtLocal(newStart) + '"></label>' +
      '<label class="field"><span class="field-k">新的结束时间</span><input class="input" type="datetime-local" id="vu-end" value="' + dtLocal(newEnd) + '"></label>' +
      '<div id="vu-conflict" class="mt12"></div>';
    TM.ui.openSheet({
      title: '确认改期',
      body: body,
      actions: [
        { label: '确认修改', kind: 'primary' },
        { label: '取消', kind: 'ghost' }
      ],
      onMount: function (sheet, close) {
        function check() {
          var s = parseLocal(sheet.querySelector('#vu-start').value);
          var e = parseLocal(sheet.querySelector('#vu-end').value);
          var box = sheet.querySelector('#vu-conflict');
          if (!s || !e || e <= s) {
            box.innerHTML = '<div class="banner banner--red">' + TM.icon('alert', 18) + '<div>结束时间必须晚于开始时间</div></div>';
            return null;
          }
          var conflicts = TM.store.checkConflicts({ start: s, end: e, location: target.location }, target.id);
          var hard = conflicts.filter(function (c) { return c.type === 'hard'; });
          box.innerHTML = hard.length
            ? '<div class="banner banner--red">' + TM.icon('alert', 18) + '<div><b>' + esc(hard[0].message) + '</b><div class="small mt4">请调整时间后再保存。</div></div></div>'
            : (conflicts.length ? '<div class="banner banner--orange">' + TM.icon('alert', 18) + '<div>' + esc(conflicts[0].message) + '</div></div>'
              : '<div class="banner banner--green">' + TM.icon('check', 18) + '<div>新时间可用</div></div>');
          return hard.length ? null : { start: s, end: e };
        }
        sheet.querySelectorAll('#vu-start, #vu-end').forEach(function (el) { el.addEventListener('input', check); });
        sheet.querySelectorAll('[data-mact]')[0].addEventListener('click', function (e) {
          e.preventDefault();
          var val = check();
          if (!val) return;
          var oldStart = target.start, oldEnd = target.end;
          TM.store.updateSchedule(target.id, { start: val.start, end: val.end });
          close();
          TM.ui.toast('「' + target.title + '」已改期', {
            action: {
              label: '撤销', onClick: function () {
                TM.store.updateSchedule(target.id, { start: oldStart, end: oldEnd });
                TM.ui.toast('已恢复原时间');
              }
            }
          });
          TM.ui.go('#/today');
        });
        check();
      }
    });
  }
  function handleCancel(p) {
    var candidates = findCandidates(p.targetTitle || p.slots.title);
    pickSchedule(candidates, p.targetTitle || p.slots.title, function (target) {
      TM.ui.confirm({
        title: '取消安排',
        body: '确认取消「' + esc(target.title) + '」？' + '<div class="small muted mt8">' + TM.time.fmt(target.start, 'fulltime') + (target.location ? ' · ' + esc(target.location) : '') + '</div>',
        confirmText: '确认取消',
        danger: true
      }).then(function (ok) {
        if (!ok) return;
        TM.store.removeSchedule(target.id);
        TM.ui.toast('已取消「' + target.title + '」', {
          action: {
            label: '撤销', onClick: function () {
              TM.store.restoreSchedule(target.id);
              TM.ui.toast('已恢复该安排');
            }
          }
        });
        TM.ui.go('#/today');
      });

  /* ---------------- 查询 ---------------- */
  function queryRange(key) {
    var now = new Date();
    if (key === 'today') return { from: TM.time.startOfDay(now), to: TM.time.endOfDay(now), label: '今天' };
    if (key === 'month') {
      var m = new Date(now.getFullYear(), now.getMonth(), 1);
      return { from: TM.time.startOfDay(m), to: TM.time.endOfDay(new Date(now.getFullYear(), now.getMonth() + 1, 0)), label: '本月' };
    }
    if (key === 'nextweek') {
      var nextMon = TM.time.addDays(now, ((8 - now.getDay()) % 7) || 7);
      return { from: TM.time.startOfDay(nextMon), to: TM.time.endOfDay(TM.time.addDays(nextMon, 6)), label: '下周' };
    }
    var mon = TM.time.addDays(now, -((now.getDay() + 6) % 7));
    return { from: TM.time.startOfDay(mon), to: TM.time.endOfDay(TM.time.addDays(mon, 6)), label: '本周' };
  }
  function handleQuery(p) {
    var range = queryRange(p.slots.range ? p.slots.range.key : 'week');
    if (p.slots.topic === 'expense') {
      var sum = TM.store.monthSummary();
      TM.ui.openSheet({
        title: '本月支出',
        subtitle: range.label + ' · 共 ' + TM.store.transactions({ month: sum.month }).length + ' 笔记录',
        body: '<div class="stats"><div class="stat"><div class="stat-v mono">' + TM.util.money(sum.expense) + '</div><div class="stat-k">本月支出</div></div>' +
          '<div class="stat"><div class="stat-v mono">' + sum.ratio + '%</div><div class="stat-k">预算使用</div></div>' +
          '<div class="stat"><div class="stat-v mono">' + TM.util.money(sum.balance) + '</div><div class="stat-k">结余</div></div></div>' +
          '<div class="mt16 small muted">主要支出：' + esc((sum.byCategory.filter(function (c) { return c.spent > 0; })[0] || {}).name || '暂无') + '</div>',
        actions: [{ label: '查看账本', kind: 'primary' }, { label: '知道了', kind: 'ghost' }],
        onMount: function (sheet, close) {
          sheet.querySelectorAll('[data-mact]')[0].addEventListener('click', function () { close(); TM.ui.go('#/ledger'); });
        }
      });
      return;
    }
    var list = TM.store.schedules({ from: range.from, to: range.to });
    var meetings = list.filter(function (s) { return s.category === 'meeting' || s.category === 'work'; });
    var body = '<div class="stats"><div class="stat"><div class="stat-v">' + list.length + '</div><div class="stat-k">' + range.label + '安排</div></div>' +
      '<div class="stat"><div class="stat-v">' + meetings.length + '</div><div class="stat-k">会议/工作</div></div>' +
      '<div class="stat"><div class="stat-v">' + list.filter(function (s) { return s.category === 'travel'; }).length + '</div><div class="stat-k">出行</div></div></div>' +
      '<div class="mt16">' + (list.length ? '<div class="list">' + list.slice(0, 5).map(function (s) {
        return '<div class="li"><div class="li-main"><div class="li-t">' + esc(s.title) + '</div><div class="li-s">' + TM.time.fmt(s.start, 'fulltime') + '</div></div></div>';
      }).join('') + '</div>' : '<div class="empty"><div class="empty-d">' + range.label + '还没有安排，说一句就能创建。</div></div>') + '</div>' +
      (list.length > 5 ? '<div class="small muted mt8">还有 ' + (list.length - 5) + ' 项安排，可在行程视图查看全部</div>' : '');
    TM.ui.openSheet({
      title: range.label + '的安排',
      subtitle: '小行为你统计（只读，不会修改日程）',
      body: body,
      actions: [{ label: '查看行程视图', kind: 'primary' }, { label: '知道了', kind: 'ghost' }],
      onMount: function (sheet, close) {
        sheet.querySelectorAll('[data-mact]')[0].addEventListener('click', function () { close(); TM.ui.go('#/trips'); });
      }
    });
  }

  /* ---------------- 记账 ---------------- */
  function handleExpense(p) {
    var amount = p.slots.amount;
    var cat = p.slots.category || '其他';
    var now = new Date();
    var body = '<div class="voice-quote">“' + esc(p.raw) + '”</div>' +
      '<label class="field mt12"><span class="field-k">金额（元）<em>*</em>' + (amount == null ? '<span class="tag tag--orange">待确认</span>' : '') + '</span>' +
      '<input class="input mono" id="ve-amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="请输入金额" value="' + (amount != null ? amount : '') + '"></label>' +
      '<div class="form-row"><label class="field"><span class="field-k">分类</span><select class="input" id="ve-cat">' +
      TM.CATEGORIES.map(function (c) { return '<option' + (c.name === cat ? ' selected' : '') + '>' + c.name + '</option>'; }).join('') + '</select></label>' +
      '<label class="field"><span class="field-k">发生时间</span><input class="input" type="datetime-local" id="ve-time" value="' + dtLocal(now) + '"></label></div>' +

      '<label class="field"><span class="field-k">关联行程（自动推测）</span><select class="input" id="ve-trip">' + tripsOptions((TM.store.guessTripFor(now) || {}).id || '') + '</select></label>' +

      title: '确认记账',

      onMount: function (sheet, close) {

  /* ---------------- 健康 ---------------- */
  function handleHealth(p) {
    var metric = p.slots.metric || 'steps';
    var value = p.slots.amount;

      '<div class="banner banner--green mt12">' + TM.icon('heart', 18) + '<div>健康数据默认仅保存在本地与服务端加密存储区，不参与跨用户分析。</div></div>';
    TM.ui.openSheet({
      title: '健康打卡',
      body: body,

        sheet.querySelectorAll('[data-mact]')[0].addEventListener('click', function () {
          var v = parseFloat(sheet.querySelector('#vh-value').value);

          close();
          TM.ui.toast('已记录健康数据');
          TM.ui.go('#/health');
        });
      }
    });
  }

  /* ---------------- 低置信度：让用户选择意图 ---------------- */
  function openIntentChooser(text, p) {
    var body = '<div class="voice-quote">“' + esc(text) + '”</div>' +
      '<div class="small muted mt8">小行不太确定这句话想做什么，请选择：</div>' +
      '<div class="col gap8 mt12">' +
      '<button class="btn btn--ghost" data-choice="create">' + TM.icon('calendar', 18) + ' 新建一条日程</button>' +
      '<button class="btn btn--ghost" data-choice="expense">' + TM.icon('wallet', 18) + ' 记一笔消费</button>' +
      '<button class="btn btn--ghost" data-choice="query">' + TM.icon('search', 18) + ' 查询我的安排</button>' +
      '<button class="btn btn--ghost" data-choice="health">' + TM.icon('heart', 18) + ' 健康打卡</button>' +
      '<button class="btn btn--ghost" data-choice="note">' + TM.icon('doc', 18) + ' 只存为文字速记</button>' +
      '</div>';
    TM.ui.openSheet({
      title: '请确认你想做什么',
      subtitle: '置信度较低，小行不猜测',
      body: body,
      onMount: function (sheet, close) {
        sheet.querySelectorAll('[data-choice]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var c = btn.dataset.choice;
            close();
            if (c === 'note') { saveAsNote(text); return; }
            var np = TM.nlp.parse(text);
            np.intent = c;
            if (c === 'create') handleCreate(np, 2);
            else if (c === 'expense') handleExpense(Object.assign(np, { slots: Object.assign(np.slots, { amount: (/(\d+(?:\.\d+)?)/.exec(text) || [])[1] || null, category: '其他' }) }));
            else if (c === 'query') handleQuery(np);
            else handleHealth(np);
          });
        });
      }
    });
  }

  /* ---------------- 速记箱 ---------------- */
  function renderVoiceNotes() {
    var notes = TM.store.voiceNotes();
    return '<section class="screen">' + TM.ui.head({ title: '速记箱', sub: '离线或低置信度的语音会保存在这里' }) +
      '<div class="scr-body">' +
      (notes.length ? '<div class="list">' + notes.map(function (n) {
        return '<div class="li"><div class="li-main"><div class="li-t">' + esc(n.text) + '</div>' +
          '<div class="li-s">' + TM.time.fmt(n.at, 'fulltime') + ' · ' + (n.status === 'pending' ? '待处理' : '已处理') + '</div></div>' +
          '<button class="btn btn--xs btn--soft" data-note-to="' + n.id + '">转日程</button>' +
          '<button class="icon-btn" data-note-del="' + n.id + '" aria-label="删除">' + TM.icon('trash', 18) + '</button></div>';
      }).join('') + '</div>' : '<div class="card card--dashed">' + TM.ui.empty('doc', '速记箱是空的', '离线记录或暂时无法结构化的内容会存放在这里，联网后可继续完善。',
        '<button class="btn btn--primary mt8" data-act="voice">语音记录</button>') + '</div>') +
      '<button class="btn btn--ghost btn--block mt16" data-act="voice">' + TM.icon('mic', 18) + ' 再记一条</button>' +
      '</div></section>';
  }

  /* ---------------- 暴露 API ---------------- */
  TM.voice = {
    start: function (mode) {
      if (voiceOpen) return;
      while (TM.ui.overlayCount() > 0) TM.ui.closeOverlay();
      openListening(mode || 'create');
    },
    simulate: function (text) { handleText(text); },
    parse: function (text) { return TM.nlp.parse(text); }
  };

  TM.screens.register('voice-notes', {
    route: /^#\/voice-notes(?:\?.*)?$/i,
    tab: null,
    render: renderVoiceNotes,
    mount: function (root) {
      root.addEventListener('click', function (e) {
        var el = e.target.closest('[data-note-to], [data-note-del], [data-act="voice"]');
        if (!el) return;
        if (el.dataset.noteTo) {
          var note = TM.store.voiceNotes().filter(function (n) { return n.id === el.dataset.noteTo; })[0];
          if (note) { TM.voice.start('create'); setTimeout(function () { TM.voice.simulate(note.text); }, 60); }
        } else if (el.dataset.noteDel) {
          var n2 = el.dataset.noteDel;
          TM.store.state.voiceNotes = TM.store.voiceNotes().filter(function (n) { return n.id !== n2; });
          TM.store.save();
          TM.ui.toast('已删除该速记');
        } else if (el.dataset.act === 'voice') {
          TM.voice.start();
        }
      });
    }
  });
})();

/* ===== 90-me.js ===== */
/* 90-me.js —— 我的：账户、同步中心、通知中心、设置、隐私与安全、帮助与反馈 */
(function () {

  const TM = window.TM;

  const U = TM.util;
  const T = TM.time;

  const IC = function (n, s) { return TM.icon ? (TM.icon(n, s) || '') : ''; };

  const money = function (n) { return U.money(Number(n) || 0); };

  function S() { return TM.store || {}; }
  function safe(fn, fb) { try { return fn(); } catch (e) { return fb; } }

  const SUG_TYPE = { conflict: '冲突消解', schedule: '日程体检', commute: '通勤优化', budget: '费用提醒', health: '健康节奏', weekly: '周复盘' };

  /* ---------------- 读取辅助 ---------------- */
  function profile() { return safe(function () { return S().profile || {}; }, {}); }
  function settings() { return safe(function () { return S().settings || {}; }, {}); }
  function syncInfo() {
    const s = safe(function () { return S().sync || {}; }, {});
    return { lastSync: s.lastSync || null, pending: Number(s.pending) || 0, online: s.online !== false };
  }
  function unread() { return safe(function () { return Number(S().unreadCount()) || 0; }, 0); }
  function notifList() { return safe(function () { return S().notifications() || []; }, []); }
  function maskPhone(p) {
    const s = String(p || '');
    if (!s) return '未绑定手机号';
    if (s.indexOf('*') >= 0) return s;
    if (s.length < 7) return s;
    return s.slice(0, 3) + '****' + s.slice(-4);
  }
  function applySettings() {
    safe(function () { if (TM.ui.applySettings) TM.ui.applySettings(); }, null);
  }
  function weekStats() {
    const now = T.now();
    const monday = T.startOfDay(T.addDays(now, -((now.getDay() + 6) % 7)));
    const end = T.endOfDay(T.addDays(monday, 6));
    const list = safe(function () { return S().schedules({ from: monday, to: end }) || []; }, []);
    const done = list.filter(function (s) { return T.parse(s.end || s.start).getTime() <= Date.now() || s.status === 'done'; }).length;
    const sum = safe(function () { return S().monthSummary(); }, null);
    return { count: list.length, done: done, expense: sum ? sum.expense : 0 };
  }

  function exportData() {

  }

  function mountMe(root) {
    root.addEventListener('click', function (e) {
      const el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el) return;
      const act = el.dataset.act;
      if (act === 'me-go') { TM.ui.go(el.dataset.go || '#/me'); return; }
      if (act === 'me-export') { exportData(); return; }
      if (act === 'me-demo') { loadDemoData(); return; }
      if (act === 'me-reset') { resetUserData(); return; }
    });
  }

  /* ---------------- 同步中心 ---------------- */
  function syncErrorList(sy) {
    const raw = safe(function () {
      const s = S().sync || {};
      return s.errors || s.anomalies || null;
    }, null);
    if (Array.isArray(raw) && raw.length) {
      return raw.map(function (e) {
        if (typeof e === 'string') return { title: '同步异常', desc: e, time: '' };
        return {
          title: e.title || e.message || '同步异常',
          desc: e.desc || e.detail || '',
          time: e.time || (e.at ? T.fmt(e.at, 'ago') : '')
        };
      });
    }
    const out = [];
    if (!sy.online) out.push({ title: '网络不可用', desc: '当前离线，本地变更已进入待同步队列，恢复在线后自动补传。', time: '刚刚' });
    if (sy.pending > 0) out.push({ title: '同步延迟', desc: '有 ' + sy.pending + ' 条变更等待上传，网络恢复后会自动重试。', time: sy.lastSync ? T.fmt(sy.lastSync, 'ago') : '—' });
    return out;
  }

  function renderSync() {
    const sy = syncInfo();
    const errors = syncErrorList(sy);
    const errHtml = errors.length
      ? errors.map(function (er) {
        return '<div class="me-err"><span class="me-err-dot"></span><div class="me-err-main">'
          + '<div class="me-err-t">' + E(er.title) + '</div>'
          + '<div class="me-err-s">' + E(er.desc) + '</div>'
          + (er.time ? '<div class="me-err-time">' + E(er.time) + '</div>' : '')
          + '</div></div>';
      }).join('')
      : TM.ui.empty('check', '没有同步异常', '最近同步正常，未发现冲突或失败记录。');
    return '<section class="screen">'
      + TM.ui.head({ title: '同步中心', back: true })
      + '<div class="scr-body">'
      + '<div class="card me-hero">'
      + '<div class="me-hero-top">'
      + '<span class="tag ' + (sy.online ? 'tag--green' : 'tag--orange') + '">' + (sy.online ? '在线' : '离线') + '</span>'
      + '<button class="switch ' + (sy.online ? 'switch--on' : '') + '" role="switch" aria-checked="' + (sy.online ? 'true' : 'false') + '" data-act="me-online" aria-label="在线模式"></button>'
      + '</div>'
      + '<div class="me-hero-t">' + (sy.online
        ? (sy.pending ? '还有 ' + sy.pending + ' 条变更待同步' : '所有数据已同步')
        : '当前离线，变更已保存在本地') + '</div>'
      + '<div class="me-hero-s">最后同步：' + (sy.lastSync ? E(T.fmt(sy.lastSync, 'ago')) : '从未同步') + ' · 本机 1 台设备</div>'
      + '<div class="me-hero-stats">'
      + '<div class="me-hero-stat"><b>' + sy.pending + '</b><span>待同步</span></div>'
      + '<div class="me-hero-stat"><b>' + (sy.online ? '在线' : '离线') + '</b><span>网络状态</span></div>'
      + '<div class="me-hero-stat"><b>自动</b><span>增量同步</span></div>'
      + '</div>'
      + '<button class="btn btn--primary btn--block mt12" data-act="me-sync-now">' + IC('refresh', 16) + ' 立即同步</button>'
      + '</div>'
      + (sy.online ? '' : '<div class="banner banner--orange mt12">' + IC('alert', 18) + '<div>离线模拟中：写操作先落本地并立即反馈成功，恢复在线后自动增量同步。</div></div>')
      + '<div class="sec"><div class="sec-t">异常记录</div><div class="sec-x">近 7 天</div></div>'
      + errHtml
      + '<div class="sec"><div class="sec-t">同步策略</div></div>'
      + '<div class="card me-note">'
      + '<div class="me-note-row">' + IC('sync', 16) + '<div><b>离线优先</b>所有写操作先落本地，界面立即反馈成功，后台再增量同步到云端。</div></div>'
      + '<div class="me-note-row">' + IC('shield', 16) + '<div><b>字段级最后写入优先</b>同一字段冲突时保留用户最后一次操作；日程时间冲突时保留最后操作的一端。</div></div>'
      + '<div class="me-note-row">' + IC('users', 16) + '<div><b>多端一致</b>同一账户最多同时在线 5 台设备，其他设备通过变更序列拉取更新。</div></div>'
      + '</div>'
      + '</div></section>';
  }

  function doSync() {
    const sy = syncInfo();
    if (!sy.online) { toast('离线状态下无法同步，请先打开在线模式'); return; }
    const btn = document.querySelector('[data-act="me-sync-now"]');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = IC('refresh', 16) + ' 同步中…';
    }
    let p = null;
    try { p = S().triggerSync(); } catch (e) { toast('同步失败，请稍后重试'); return; }
    Promise.resolve(p).then(function (r) {
      toast('同步完成' + (r && r.pending === 0 ? '，全部变更已上传' : ''));
    }).catch(function (err) {
      toast((err && err.message) ? err.message : '同步失败，请稍后重试');
    }).then(function () {
      safe(function () { TM.ui.refresh(); }, null);
    });
  }

  function toggleOnline() {
    const sy = syncInfo();
    const next = !sy.online;
    safe(function () { S().setOnline(next); }, null);
    if (next) {
      toast('已切换为在线模式，正在同步…');
      window.setTimeout(function () {
        const p = safe(function () { return S().triggerSync(); }, null);
        if (p && p.then) {
          p.then(function () { toast('已恢复同步'); }).catch(function () { /* ignore */ });
        }
      }, 300);
    } else {
      toast('已切换为离线模式，写操作会先保存在本地');
    }
  }

  function mountSync(root) {
    root.addEventListener('click', function (e) {
      const el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el) return;
      const act = el.dataset.act;
      if (act === 'me-online') { toggleOnline(); return; }
      if (act === 'me-sync-now') { doSync(); return; }
    });
  }

  /* ---------------- 通知中心 ---------------- */
  const NOTIF_META = {
    schedule: { label: '日程提醒', icon: 'clock' },
    ai: { label: '小行建议', icon: 'spark' },
    system: { label: '系统通知', icon: 'bell' }
  };
  const meState = { notifFilter: 'all', grants: { mic: true, location: false, health: true, notify: true } };

  function notifCard(n) {
    const kind = n.kind || 'system';
    const meta = NOTIF_META[kind] || NOTIF_META.system;
    const read = !!(n.read || n.isRead);
    return '<div class="card me-notif' + (read ? '' : ' me-notif--unread') + '" role="button" tabindex="0" data-act="me-notif" data-id="' + E(n.id) + '">'
      + '<span class="me-notif-ic' + (kind === 'ai' ? ' me-notif-ic--ai' : (kind === 'schedule' ? ' me-notif-ic--sc' : '')) + '">' + IC(meta.icon, 18) + '</span>'
      + '<div class="me-notif-main">'
      + '<div class="me-notif-t">' + E(n.title || '通知') + (read ? '' : '<i class="me-dot" aria-label="未读"></i>') + '</div>'
      + (n.body ? '<div class="me-notif-b">' + E(n.body) + '</div>' : '')
      + '<div class="me-notif-time">' + E(n.at ? T.fmt(n.at, 'ago') : '') + ' · ' + E(meta.label) + '</div>'
      + '</div>'
      + '<span class="li-arrow">' + IC('chevron', 18) + '</span>'
      + '</div>';

  function renderNotifications() {
    const all = notifList();
    const u = unread();
    const f = meState.notifFilter;
    const list = f === 'all' ? all : all.filter(function (n) { return (n.kind || 'system') === f; });
    const chips = [['all', '全部'], ['schedule', '日程提醒'], ['ai', '小行建议'], ['system', '系统通知']].map(function (c) {
      return '<button class="chip me-chip' + (f === c[0] ? ' chip--on' : '') + '" data-act="me-filter" data-f="' + c[0] + '">' + c[1] + '</button>';
    }).join('');
    const body = list.length
      ? list.map(notifCard).join('')
      : TM.ui.empty('bell', f === 'all' ? '还没有通知' : '这个分类暂时没有消息', '日程提醒、小行建议与系统通知会聚合在这里，支持筛选与批量已读。',
        f === 'all' ? '' : '<button class="btn btn--sm btn--ghost mt12" data-act="me-filter" data-f="all">查看全部通知</button>');
    return '<section class="screen">'
      + TM.ui.head({
        title: '通知中心', back: true,
        right: u ? '<button class="btn btn--sm btn--ghost" data-act="me-read-all">全部已读</button>' : ''
      })
      + '<div class="scr-body">'
      + '<div class="chips me-chips">' + chips + '</div>'
      + (u ? '<div class="banner banner--blue mb12">' + IC('bell', 18) + '<div>有 <b>' + u + '</b> 条未读消息，点击可跳转到对应页面。</div></div>' : '')
      + body
      + (list.length ? '<div class="me-list-tip">' + IC('alert', 14) + ' 通知仅保留最近 60 条，更早的记录可在消息中心历史中查看（V1.1）。</div>' : '')
      + '</div></section>';
  }

  function openNotif(id) {
    const n = notifList().filter(function (x) { return String(x.id) === String(id); })[0];
    if (!n) return;
    safe(function () { S().markRead(id); }, null);
    const kind = n.kind || 'system';
    const title = String(n.title || '');
    let dest = '#/me';
    if (kind === 'schedule') dest = '#/today';
    else if (kind === 'ai') dest = '#/suggestions';
    else if (/同步/.test(title)) dest = '#/sync';
    else if (/反馈/.test(title)) dest = '#/notifications';
    else if (/设置|深色|大字/.test(title)) dest = '#/settings';
    TM.ui.go(dest);
  }

  function mountNotifications(root) {
    root.addEventListener('click', function (e) {
      const el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el) return;
      const act = el.dataset.act;
      if (act === 'me-filter') {
        meState.notifFilter = el.dataset.f || 'all';
        TM.ui.refresh();
        return;
      }
      if (act === 'me-read-all') {
        safe(function () { S().markAllRead(); }, null);
        toast('已全部标为已读');
        safe(function () { TM.ui.refresh(); }, null);
        return;
      }
      if (act === 'me-notif') { openNotif(el.dataset.id); return; }
    });
  }

  /* ---------------- 设置 ---------------- */

    return '<button class="switch ' + (on ? 'switch--on' : '') + '" role="switch" aria-checked="' + (on ? 'true' : 'false') + '" data-act="' + act + '" aria-label="' + E(label) + '"></button>';

      const name = SUG_TYPE[d.id] || ('建议 ' + d.id);

    const next = !set.largeText;
    safe(function () { S().updateSettings({ largeText: next }); }, null);
    applySettings();
    toast(next ? '已开启大字模式' : '已关闭大字模式');
    safe(function () { TM.ui.refresh(); }, null);

  function toggleVoice(key) {
    const set = settings();
    const ve = Object.assign({}, set.voiceEntries || {});
    const cur = ve[key] !== false;
    if (cur) {
      const others = ['floating', 'lock', 'widget', 'notification'].filter(function (k) { return k !== key && ve[k] !== false; });
      if (!others.length) { toast('至少保留一个语音入口'); return; }
      ve[key] = false;
    } else {
      ve[key] = true;
    }
    safe(function () { S().updateSettings({ voiceEntries: ve }); }, null);
    toast(ve[key] ? '已开启该语音入口' : '已关闭该语音入口');
    safe(function () { TM.ui.refresh(); }, null);
  }

    safe(function () { S().updateSettings({ quietHours: !set.quietHours }); }, null);

            safe(function () { S().logout(); }, null);
            close();
            toast('已退出登录');
            window.setTimeout(function () { TM.ui.go('#/welcome'); }, 260);
          }
        }
      ]
    });
  }

  function mountSettings(root) {
    root.addEventListener('click', function (e) {
      const el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el) return;
      const act = el.dataset.act;
      if (act === 'me-dark') { toggleDark(); return; }
      if (act === 'me-large') { toggleLarge(); return; }
      if (act === 'me-voice') { toggleVoice(el.dataset.k); return; }
      if (act === 'me-quiet') { toggleQuiet(); return; }
      if (act === 'me-restore') { restoreType(el.dataset.id); return; }
      if (act === 'me-clear-dismissed') { clearDismissed(); return; }
      if (act === 'me-logout') { logout(); return; }
      if (act === 'me-go') { TM.ui.go(el.dataset.go || '#/me'); return; }
    });
  }

  /* ---------------- 隐私与安全 ---------------- */
  function renderPrivacy() {
    const g = meState.grants;
    const grants = [
      { k: 'mic', icon: 'mic', title: '麦克风', sub: '用于语音速记与实时转写' },
      { k: 'location', icon: 'pin', title: '位置信息', sub: '用于出发提醒与通勤时间估算' },
      { k: 'health', icon: 'heart', title: '健康数据', sub: '用于日程负荷评估与健康提醒' },
      { k: 'notify', icon: 'bell', title: '通知权限', sub: '用于日程提醒与小行建议推送' }
    ].map(function (o) {
      const on = !!g[o.k];
      return '<div class="li me-li"><span class="li-ico">' + IC(o.icon, 20) + '</span>'
        + '<div class="li-main"><div class="li-t">' + E(o.title) + '</div><div class="li-s">' + E(o.sub) + '</div></div>'
        + '<div class="li-r"><span class="me-grant-state ' + (on ? 'me-grant-state--on' : '') + '">' + (on ? '已授权' : '未授权') + '</span>'
        + sw(on, 'me-grant', o.title).replace('data-act="me-grant"', 'data-act="me-grant" data-k="' + o.k + '"')
        + '</div></div>';
    }).join('');
    return '<section class="screen">'
      + TM.ui.head({ title: '隐私与安全', back: true })
      + '<div class="scr-body">'
      + '<div class="card me-priv-intro">'
      + '<div class="me-priv-t">' + IC('shield', 18) + ' 你的数据，你说了算</div>'
      + '<div class="me-priv-s">全部数据优先保存在本机；定位与健康数据默认仅端侧计算，云端只保存聚合摘要，不参与任何跨用户分析。</div>'
      + '</div>'
      + '<div class="sec"><div class="sec-t">授权清单</div><div class="sec-x">可随时回收</div></div>'
      + '<div class="list">' + grants + '</div>'
      + '<div class="banner banner--grey mt12">' + IC('help', 18) + '<div>拒绝授权不会阻断使用：语音不可用时可文字输入，健康提醒会退化为按日程时长判断。</div></div>'
      + '<div class="sec"><div class="sec-t">数据与存储</div></div>'
      + '<div class="list">'
      + setRow('本地存储', '行程、日程、账本、健康原始记录保存在本机浏览器 localStorage', '<span class="tag tag--green">仅本机</span>')
      + setRow('云端同步', '联网时增量同步加密备份，可随时关闭', '<span class="tag tag--blue">增量</span>')
      + setRow('行为日志', '原始行为日志保留 90 天，用于模型效果评估，到期自动删除', '')
      + '<div class="li me-li li--press" role="button" tabindex="0" data-act="me-export"><span class="li-ico">' + IC('download', 20) + '</span>'
      + '<div class="li-main"><div class="li-t">导出我的数据</div><div class="li-s">生成包含行程、日程、账本与健康的 JSON 文件</div></div>'
      + '<div class="li-r">' + IC('chevron', 18) + '</div></div>'
      + '</div>'
      + '<div class="sec"><div class="sec-t">注销说明</div></div>'
      + '<div class="card me-danger-card">'
      + '<div class="me-danger-t">' + IC('alert', 18) + ' 注销账号不可恢复</div>'
      + '<ul class="me-danger-list">'
      + '<li>注销后，云端备份将在 7 天内删除，本机数据会立即清除。</li>'
      + '<li>已导出的数据文件不受影响，建议先导出留存。</li>'
      + '<li>注销后同一手机号可重新注册，但历史数据无法找回。</li>'
      + '</ul>'
      + '<button class="btn btn--danger-ghost btn--block mt12" data-act="me-delete">申请注销账号</button>'
      + '</div>'
      + '<div class="me-list-tip">' + IC('shield', 14) + ' 我们不会把你的数据用于广告投放，也不会出售给第三方。</div>'
      + '</div></section>';
  }

  function toggleGrant(key) {
    const next = !meState.grants[key];
    meState.grants[key] = next;
    if (!next && key === 'mic') toast('已关闭麦克风授权，语音入口不可用，可使用文字输入');
    else toast(next ? '已授权' : '已撤销该授权');
    safe(function () { TM.ui.refresh(); }, null);
  }

  function openDeleteAccount() {
    TM.ui.openModal({
      title: '注销账号',
      body: '<div class="me-modal-body">注销会清空本机的账号与全部记录，且不可恢复。试用版不上传云端，清除后无法找回；建议先在「数据导出」保存备份。</div>',
      actions: [
        { label: '再想想', kind: 'ghost' },
        {
          label: '确认注销', kind: 'danger',
          onClick: function (close) {
            close();
            safe(function () { S().deleteAccount(); }, null);
            toast('账号已注销，本机数据已清除');
            window.setTimeout(function () { TM.ui.go('#/welcome'); }, 300);
          }
        }
      ]
    });
  }

  function mountPrivacy(root) {
    root.addEventListener('click', function (e) {
      const el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el) return;
      const act = el.dataset.act;
      if (act === 'me-grant') { toggleGrant(el.dataset.k); return; }
      if (act === 'me-export') { exportData(); return; }
      if (act === 'me-delete') { openDeleteAccount(); return; }
    });
  }

  /* ---------------- 帮助与反馈 ---------------- */
  const FAQ = [
    ['怎么快速添加一条日程？', '点击任意页面右下角的悬浮麦克风，直接说“明天下午三点见王总”；也可以在语音解析卡里修改字段后确认写入。文字输入在小行对话里同样可用。'],
    ['小行能做什么，不能做什么？', '小行只做三件事：解释现状、给出建议、代你执行已授权的操作。它不做通用闲聊，超出范围的问题会统一引导回行程、日程、记账和健康。'],
    ['改了日程后能撤销吗？', '可以。小行建议的采纳与对话改期都提供 10 秒撤销入口；超过 10 秒可在日程变更记录中回滚。'],
    ['数据会上传到云端吗？', 'V1.0 是离线优先：所有数据先保存在本机，联网时增量同步。定位与健康数据默认仅端侧计算，只同步聚合结果。'],
    ['如何导出我的数据？', '在「我的」或「隐私与安全」中点击“数据导出”，会下载完整 JSON 文件，包含行程、日程、账本与健康记录。'],
    ['大字模式和深色模式在哪里开？', '「我的 → 设置 → 外观」，两个开关即时生效并保存在本机。']
  ];

  function renderHelp() {
    const faq = FAQ.map(function (item) {
      return '<details class="me-faq"><summary>' + E(item[0]) + '</summary><div class="me-faq-a">' + E(item[1]) + '</div></details>';
    }).join('');
    return '<section class="screen">'
      + TM.ui.head({ title: '帮助与反馈', back: true })
      + '<div class="scr-body">'
      + '<div class="card me-help-hero">'
      + '<div class="me-help-t">遇到问题？先看看这里</div>'
      + '<div class="me-help-s">小行和行程管家会在 1 个工作日内处理你的反馈，紧急问题请先查看常见问题。</div>'
      + '</div>'
      + '<div class="sec"><div class="sec-t">常见问题</div></div>'
      + faq
      + '<div class="sec"><div class="sec-t">反馈</div></div>'
      + '<div class="card me-form">'
      + '<label class="field"><span class="field-k">反馈类型</span>'
      + '<select class="input" data-fb-type aria-label="反馈类型">'
      + '<option>功能建议</option><option>问题反馈</option><option>体验问题</option><option>其他</option>'
      + '</select></label>'
      + '<label class="field"><span class="field-k">问题描述 <em>*</em></span>'
      + '<textarea class="input me-textarea" data-fb-text maxlength="500" placeholder="说说遇到了什么，或你希望增加什么功能（至少 5 个字）" aria-label="问题描述"></textarea></label>'
      + '<label class="field"><span class="field-k">联系方式（选填）</span>'
      + '<input class="input" data-fb-contact maxlength="40" placeholder="手机号或邮箱，方便我们回复" aria-label="联系方式"></label>'
      + '<button class="btn btn--primary btn--block" data-act="me-fb-submit">提交反馈</button>'
      + '<div class="me-form-tip">提交后会收到一条系统通知；试用版反馈仅保存在本机。</div>'
      + '</div>'
      + '<div class="sec"><div class="sec-t">联系我们</div></div>'
      + '<div class="list">'
      + setRow('客服邮箱', 'support@tripmate.app（演示地址）', '')
      + setRow('版本', '行程管家 V' + E(TM.version || '1.0.0'), '')
      + '<div class="li me-li li--press" role="button" tabindex="0" data-act="me-go" data-go="#/privacy"><div class="li-main"><div class="li-t">隐私与安全</div><div class="li-s">查看授权清单与数据说明</div></div><div class="li-r">' + IC('chevron', 18) + '</div></div>'
      + '</div>'
      + '</div></section>';
  }

  function submitFeedback(root) {
    const ta = root.querySelector('[data-fb-text]');
    const sel = root.querySelector('[data-fb-type]');
    const ct = root.querySelector('[data-fb-contact]');
    const text = ta ? String(ta.value || '').trim() : '';
    const type = sel ? sel.value : '功能建议';
    const contact = ct ? String(ct.value || '').trim() : '';
    if (text.length < 5) {
      toast('请至少写 5 个字描述你的问题');
      if (ta) { try { ta.focus(); } catch (e) { /* ignore */ } }
      return;
    }
    let saved = false;
    safe(function () {
      if (!S().addNotification) return;
      S().addNotification({
        kind: 'system', title: '反馈已提交',
        body: type + '：' + text.slice(0, 60) + (contact ? '（联系方式：' + contact + '）' : '')
      });
      saved = true;
    }, null);
    toast(saved ? '反馈已提交，谢谢你' : '提交失败，请稍后重试');
    if (saved) {
      if (ta) ta.value = '';
      if (ct) ct.value = '';
    }
  }

  function mountHelp(root) {
    root.addEventListener('click', function (e) {
      const el = e.target.closest ? e.target.closest('[data-act]') : null;
      if (!el) return;
      const act = el.dataset.act;
      if (act === 'me-fb-submit') { submitFeedback(root); return; }
      if (act === 'me-go') { TM.ui.go(el.dataset.go || '#/help'); return; }
    });
  }

  /* ---------------- 注册 ---------------- */
  TM.screens.register('me', {
    route: /^#\/me(?:\?.*)?$/i,
    tab: 'me',
    render: renderMe,
    mount: mountMe
  });
  TM.screens.register('sync', {
    route: /^#\/sync(?:\?.*)?$/i,
    tab: 'me',
    render: renderSync,
    mount: mountSync
  });
  TM.screens.register('notifications', {
    route: /^#\/notifications(?:\?.*)?$/i,
    tab: 'me',
    render: renderNotifications,
    mount: mountNotifications
  });
  TM.screens.register('settings', {
    route: /^#\/settings(?:\?.*)?$/i,
    tab: 'me',
    render: renderSettings,
    mount: mountSettings
  });
  TM.screens.register('privacy', {
    route: /^#\/privacy(?:\?.*)?$/i,
    tab: 'me',
    render: renderPrivacy,
    mount: mountPrivacy
  });
  TM.screens.register('help', {
    route: /^#\/help(?:\?.*)?$/i,
    tab: 'me',
    render: renderHelp,
    mount: mountHelp
  });
})();
/* ===== 99-boot.js ===== */
/* ============================================================
   99-boot.js  ·  应用启动
   ============================================================ */
(function () {
  'use strict';
  var TM = window.TM;

  function boot() {
    try {
      var hash = location.hash || '';
      var authPage = /^#\/(welcome|register|login|onboarding)(?:\?|$)/.test(hash);
      if (!TM.store.isLoggedIn()) {
        if (!/^#\/(welcome|register|login)(?:\?|$)/.test(hash)) {
          history.replaceState(null, '', '#/welcome');
        }
      } else if (authPage) {
        history.replaceState(null, '', '#/today');
      }
      TM.ui.init();
      window.__TM_READY__ = true;
      if (window.console) console.log('%c行程管家 TripMate 试用版 v' + TM.version + ' 已启动', 'color:#2F6BFF;font-weight:600');
    } catch (e) {
      if (window.console) console.error('[TripMate] 启动失败', e);
      var screen = document.getElementById('screen');
      if (screen) {
        screen.innerHTML = '<section class="screen"><div class="scr-body"><div class="banner banner--red mt16">' +
          '<div><b>应用启动失败</b><div class="mt4 small">' + TM.util.esc(e && e.message || '未知错误') + '</div></div></div></div></section>';
      }
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  window.addEventListener('error', function (e) {
    if (window.console) console.error('[TripMate] 运行时错误', e.message);
  });
})();

</script>
