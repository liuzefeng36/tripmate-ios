    if (!validPhone(phone)) { fieldError('err-phone', '请输入正确的 11 位手机号'); markInput('rg-phone', true); ok = false; }
    if (!/^\d{6}$/.test(code) || (sentCode && code !== sentCode) || (!sentCode && code !== '123456')) {
      fieldError('err-code', sentCode ? '验证码不正确' : '请先获取验证码（试用版固定 123456）'); markInput('rg-code', true); ok = false;
    }
    if (!agree) { fieldError('err-agree', '请先阅读并同意用户协议与隐私政策'); ok = false; }
    if (!ok) { toast('请完善必填的人员信息'); return; }
    if (codeTarget && codeTarget !== normPhone(phone)) {
      fieldError('err-code', '手机号与获取验证码的手机号不一致'); markInput('rg-code', true); return;
    }
    TM.store.register({ name: name, phone: phone, city: city, identity: identity });
    TM.store.addNotification({ kind: 'system', title: '欢迎使用行程管家试用版', body: '账号已创建。用右下角麦克风记录第一件事，或在「我的」完善资料。' });
    toast('试用账号已创建');
    TM.ui.go('#/onboarding');
  }

  function submitLogin(root) {
    var phone = root.querySelector('#lg-phone').value;
    var code = (root.querySelector('#lg-code').value || '').trim();
    fieldError('err-lg-phone', '');
    fieldError('err-lg-code', '');
    if (!validPhone(phone)) { fieldError('err-lg-phone', '请输入正确的 11 位手机号'); markInput('lg-phone', true); return; }
    if (!/^\d{6}$/.test(code) || code !== '123456') { fieldError('err-lg-code', '验证码不正确（试用版固定 123456）'); markInput('lg-code', true); return; }
    if (!TM.store.login(phone)) {
      fieldError('err-lg-phone', '本机没有该手机号的试用账号，请先注册');
      markInput('lg-phone', true);
      return;
    }
    toast('登录成功');
    TM.ui.go('#/today');
  }

  /* ---------------- 个人资料 ---------------- */
  function renderProfileEdit() {
    var p = TM.store.profile;
    return '<section class="screen auth-screen auth-form-screen">' +
      TM.ui.head({ title: '个人资料' }) +
      '<div class="scr-body auth-form-body">' +
      '<div class="card auth-card">' +
      '<label class="field"><span class="field-k">昵称</span><input class="input" id="pf-name" maxlength="20" value="' + E(p.name) + '"></label>' +
      '<label class="field"><span class="field-k">手机号</span><input class="input" id="pf-phone" value="' + E(p.phone) + '" disabled></label>' +
      '<div class="field"><span class="field-k">所在城市</span><select class="input" id="pf-city">' +
      CITIES.map(function (c) { return '<option' + (c === p.city ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><span class="field-k">身份</span><div class="chips" id="pf-identity">' +
      IDENTITIES.map(function (v) { return '<button type="button" class="chip' + (v === p.identity ? ' chip--on' : '') + '" data-pf-identity="' + v + '">' + v + '</button>'; }).join('') + '</div></div>' +
      '<div class="banner banner--grey mt16">' + IC('shield', 16) + '<div>资料仅用于本机展示；手机号不可修改。</div></div>' +
      '</div>' +
      '<button class="btn btn--primary btn--block auth-main-btn" data-act="save-profile">保存资料</button>' +
      '</div></section>';
  }

  function mountProfileEdit(root) {
    root.addEventListener('click', function (e) {
      var idBtn = e.target.closest('[data-pf-identity]');
      if (idBtn) {
        root.querySelectorAll('[data-pf-identity]').forEach(function (b) { b.classList.toggle('chip--on', b === idBtn); });
        return;
      }
      var el = e.target.closest('[data-act]');
      if (!el) return;
      if (el.dataset.act === 'save-profile') {
        var name = (root.querySelector('#pf-name').value || '').trim();
        if (name.length < 2) { toast('昵称至少 2 个字符'); return; }
        var idEl = root.querySelector('#pf-identity .chip--on');
        TM.store.updateProfile({
          name: name,
          city: root.querySelector('#pf-city').value,
          identity: idEl ? idEl.dataset.pfIdentity : TM.store.profile.identity
        });
        toast('资料已保存');
        TM.ui.go('#/me');
      }
    });
  }

  /* ---------------- 路由与守卫 ---------------- */
  TM.screens.register('welcome', {
    route: [/^#\/welcome(?:\?.*)?$/i, /^#\/$/],
    hideTabs: true,
    hideFab: true,
    render: renderWelcome,
    mount: function (root) {
      root.addEventListener('click', function (e) {
        var el = e.target.closest('[data-act]');
        if (!el) return;
        if (el.dataset.act === 'to-register') TM.ui.go('#/register');
        else if (el.dataset.act === 'terms') openTermsModal();
      });
    }
  });
  TM.screens.register('register', {
    route: /^#\/register(?:\?.*)?$/i, hideTabs: true, hideFab: true,
    render: renderRegister,
    mount: function (root) { mountForm(root, 'register'); }
  });
  TM.screens.register('login', {
    route: /^#\/login(?:\?.*)?$/i, hideTabs: true, hideFab: true,
    render: renderLogin,
    mount: function (root) { mountForm(root, 'login'); }
  });
  TM.screens.register('onboarding', {
    route: /^#\/onboarding(?:\?.*)?$/i, hideTabs: true, hideFab: true,
    render: renderOnboarding,
    mount: function (root) {
      root.addEventListener('click', function (e) {
        var el = e.target.closest('[data-act]');
        if (!el) return;
        if (el.dataset.act === 'start') { TM.ui.go('#/today'); }
        else if (el.dataset.act === 'load-demo') {
          TM.store.loadDemoData();
          TM.ui.toast('已载入示例数据（体验用）');
          TM.ui.go('#/today');
        }
      });
    }
  });
  TM.screens.register('profile-edit', {
    route: /^#\/profile-edit(?:\?.*)?$/i,
    render: renderProfileEdit,
    mount: mountProfileEdit
  });

  /* 未登录时禁止进入业务页面；已登录时不再停留在欢迎/登录页 */
  window.addEventListener('hashchange', function () {
    var h = normalizeHash(location.hash);
    var authOnly = /^#\/(welcome|register|login)(?:\?|$)/.test(h);
    if (!TM.store.isLoggedIn() && !authOnly) {
      TM.ui.replace('#/welcome');
    } else if (TM.store.isLoggedIn() && authOnly) {
      TM.ui.replace('#/today');
    }
  });
  function normalizeHash(h) { return h || '#/welcome'; }
})();

/* ===== 30-home.js ===== */
/* ============================================================
   30-home.js  ·  今日首页（下一个安排 / 时间轴 / 小行建议 / 健康与账本）
   ============================================================ */
(function () {
  'use strict';
  var TM = window.TM;
  var expanded = false;
  var timer = null;

  var TONE = {
    conflict: { label: '冲突消解', cls: 'orange', icon: 'alert' },
    schedule: { label: '日程体检', cls: 'blue', icon: 'chart' },
    commute: { label: '通勤优化', cls: 'orange', icon: 'route' },
    budget: { label: '费用提醒', cls: 'orange', icon: 'wallet' },
    health: { label: '健康节奏', cls: 'green', icon: 'heart' },
    weekly: { label: '周复盘', cls: 'blue', icon: 'refresh' }
  };
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function greet() {
    var h = new Date().getHours();
    if (h < 6) return '夜深了';
    if (h < 9) return '早上好';
    if (h < 12) return '上午好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  }
  function cdText(target, mode) {
    var ms = target.getTime() - Date.now();
    if (ms <= 0) return mode === 'end' ? '进行中' : '即将开始';
    var total = Math.floor(ms / 1000);
    var h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    if (h > 0) return pad(h) + ':' + pad(m) + ':' + pad(s);
    return pad(m) + ':' + pad(s);
  }
  function catOf(key) { return TM.SCHEDULE_CATEGORIES[key] || TM.SCHEDULE_CATEGORIES.work; }

  function nextSchedule(list, now) {
    var upcoming = list.filter(function (s) { return s.end.getTime() > now.getTime(); });
    if (!upcoming.length) return null;
    var s = upcoming[0];
    return { s: s, ongoing: s.start.getTime() <= now.getTime() };
  }
  function tomorrowFirst() {
    var list = TM.store.schedulesOfDay(TM.time.key(TM.time.addDays(new Date(), 1)));
    return list[0] || null;
  }

  function heroHtml(next, list) {
    if (!next) {
      if (!list.length) {
        return '<div class="hero home-hero">' +
          '<div class="row between"><span class="hero-k">今天</span><span class="hero-chip">试用版</span></div>' +
          '<div class="home-hero-title mt12">今天还没有安排</div>' +
          '<div class="home-hero-meta">点右下角麦克风说一句话，小行帮你生成第一条日程。</div>' +
          '<div class="home-hero-foot"><span class="home-hero-depart">例如「明天下午三点见王总」</span>' +
          '<button class="btn btn--sm home-hero-btn" data-act="voice">语音记录</button></div></div>';
      }
      var t = tomorrowFirst();
      return '<div class="hero home-hero home-hero--done">' +
        '<div class="row between"><span class="hero-k">今日安排</span><span class="hero-chip">' + TM.icon('check', 14) + ' 全部完成</span></div>' +
        '<div class="home-hero-title mt12">今天辛苦了，好好休息</div>' +
        '<div class="home-hero-meta">' + (t ? '明天 ' + TM.time.fmt(t.start, 'time') + ' · ' + TM.util.esc(t.title) : '明天暂无安排，可以睡个懒觉') + '</div>' +
        '<div class="home-hero-foot"><span>没有待处理提醒</span>' +
        '<button class="btn btn--sm home-hero-btn" data-act="voice">说一句安排</button></div></div>';
    }
    var s = next.s;
    var cat = catOf(s.category);
    var prev = null;
    list.forEach(function (x) { if (x.end.getTime() <= s.start.getTime() && x.id !== s.id) prev = x; });
    var commute = TM.store.estimateCommute(prev ? prev.location : '家', s.location);
    var departLine = '';
    if (s.reminder && s.reminder.departure && commute.minutes > 0) {
      var departAt = TM.time.addMin(s.start, -commute.minutes);
      departLine = '出发提醒 · 建议 ' + TM.time.fmt(departAt, 'time') + ' 出发（' + commute.text + '）';
    } else if (s.location) {
      departLine = s.location;
    } else {
      departLine = '未设置地点';
    }
    var meta = TM.time.fmt(s.start, 'time') + '\u2013' + TM.time.fmt(s.end, 'time') + (s.location ? ' · ' + TM.util.esc(s.location) : '');
    return '<div class="hero home-hero" data-act="open-schedule" data-id="' + s.id + '" role="button" tabindex="0">' +
      '<div class="row between"><span class="hero-k">' + (next.ongoing ? '正在进行' : '下一个安排') + '</span>' +
      '<span class="hero-chip">' + cat.name + ' · ' + (next.ongoing ? '剩余' : '距开始') + '</span></div>' +
      '<div class="home-cd mono" data-cd-start="' + s.start.toISOString() + '" data-cd-end="' + s.end.toISOString() + '" data-cd-mode="' + (next.ongoing ? 'end' : 'start') + '">' +
      cdText(next.ongoing ? s.end : s.start, next.ongoing ? 'end' : 'start') + '</div>' +
      '<div class="home-hero-title">' + TM.util.esc(s.title) + '</div>' +
      '<div class="home-hero-meta">' + meta + '</div>' +
      (s.participants && s.participants.length ? '<div class="home-hero-people">' + TM.icon('users', 14) + ' ' + TM.util.esc(s.participants.join('、')) + '</div>' : '') +
      '<div class="home-hero-foot"><span class="home-hero-depart">' + TM.icon('route', 15) + ' ' + TM.util.esc(departLine) + '</span>' +
      '<button class="btn btn--sm home-hero-btn" data-act="open-schedule" data-id="' + s.id + '">查看详情</button></div></div>';
  }

  function timelineHtml(list, now) {
    var items = list;
    var fold = items.length > 8 && !expanded;
    if (fold) items = items.slice(0, 6);
    var html = '<div class="tl">';
    var nowInserted = false;
    items.forEach(function (s) {
      if (!nowInserted && s.end.getTime() > now.getTime()) {
        html += '<div class="now-line"><span>' + TM.time.fmt(now, 'time') + '</span></div>';
        nowInserted = true;
      }
      var cat = catOf(s.category);
      var done = s.end.getTime() <= now.getTime();
      var ongoing = s.start.getTime() <= now.getTime() && s.end.getTime() > now.getTime();
      var conflicts = TM.store.checkConflicts(s, s.id);
      var hard = conflicts.filter(function (c) { return c.type === 'hard'; })[0];
      var soft = conflicts.filter(function (c) { return c.type === 'soft'; })[0];
      html += '<div class="tl-item' + (done ? ' tl-item--done' : '') + (ongoing ? ' tl-item--now' : '') + '">' +
        '<span class="tl-time">' + TM.time.fmt(s.start, 'time') + '</span>' +
        '<span class="tl-dot" style="border-color:' + cat.color + '"></span>' +
        '<div class="tl-card tl-card--press" data-act="open-schedule" data-id="' + s.id + '" role="button" tabindex="0" style="border-left:3px solid ' + cat.color + '">' +
        '<div class="row between gap8"><div class="tl-title ellipsis">' + TM.util.esc(s.title) + '</div>' +
        (hard ? '<span class="tag tag--red">' + TM.icon('alert', 12) + '冲突</span>' : (soft ? '<span class="tag tag--orange">' + TM.icon('clock', 12) + (soft.type === 'commute' ? '通勤不足' : '间隔 ' + soft.minutes + ' 分') + '</span>' : '')) +
        '</div>' +
        '<div class="tl-meta">' + TM.time.fmt(s.start, 'time') + '\u2013' + TM.time.fmt(s.end, 'time') +
        (s.location ? ' · ' + TM.util.esc(s.location) : '') + '</div>' +
        ((s.participants && s.participants.length) || s.important || ongoing
          ? '<div class="tl-tags">' + (ongoing ? '<span class="tag tag--blue">进行中</span>' : '') +
          (s.important ? '<span class="tag tag--orange">重要</span>' : '') +
          (s.participants && s.participants.length ? '<span class="tag">' + TM.icon('users', 12) + TM.util.esc(s.participants.join('、')) + '</span>' : '') + '</div>'
          : '') +
        '</div></div>';
    });
    if (!nowInserted && items.length) html += '<div class="now-line"><span>' + TM.time.fmt(now, 'time') + '</span></div>';
    html += '</div>';
    if (items.length > 8 && !expanded) {
      html += '<button class="btn btn--ghost btn--block mt12" data-act="expand">展开全部 ' + list.length + ' 项安排</button>';
    } else if (expanded && list.length > 8) {
      html += '<button class="btn btn--ghost btn--block mt12" data-act="collapse">收起</button>';
    }
    return html;
  }

  function suggestionsHtml(sugs) {
    if (!sugs.length) {
      return '<div class="card card--soft sugg-empty">' + TM.icon('spark', 20) +
        '<div><div class="sem">小行暂时没有需要提醒的事项</div><div class="small muted mt4">有冲突、预算或负荷变化时会在这里提醒</div></div></div>';
    }
    return '<div class="sugg-scroll">' + sugs.map(function (s) {
      var tone = TONE[s.type] || TONE.schedule;
      return '<div class="sugg-card sugg-card--' + tone.cls + '">' +
        '<div class="row between gap8"><span class="tag tag--' + tone.cls + '">' + tone.label + '</span><span class="small muted">小行</span></div>' +
        '<div class="sugg-t">' + TM.util.esc(s.title) + '</div>' +
        '<div class="sugg-r clamp2">' + TM.util.esc(s.reason) + '</div>' +
        '<div class="sugg-actions">' +
        '<button class="btn btn--sm btn--primary" data-act="adopt" data-id="' + s.id + '">' + TM.util.esc((s.actions && s.actions[0] && s.actions[0].label) || '采纳') + '</button>' +
        '<button class="btn btn--sm btn--ghost" data-act="ignore" data-id="' + s.id + '">忽略</button>' +
        '</div></div>';
    }).join('') + '</div>';
  }

  function duoHtml(load, budget) {
    var loadColor = load.tone === 'green' ? 'var(--green)' : load.tone === 'blue' ? 'var(--primary)' : load.tone === 'orange' ? 'var(--orange)' : 'var(--red)';
    var budgetColor = budget.level === 'over' ? 'var(--red)' : budget.level === 'warn' ? 'var(--orange)' : 'var(--green)';
    return '<div class="duo">' +
      '<button class="duo-card" data-act="go-health" aria-label="健康节奏详情">' +
      '<div class="duo-head"><span class="duo-k">健康节奏</span>' + TM.icon('heart', 18) + '</div>' +
      '<div class="duo-body"><div class="ring-wrap">' + TM.ui.ring(load.index, 64, { color: loadColor, label: String(load.index), labelSize: 18, sub: '', strokeWidth: 7 }) + '</div>' +
      '<div class="duo-info"><div class="duo-v">' + load.level + '</div><div class="duo-s">' + Math.round(load.minutes / 60 * 10) / 10 + ' 小时安排</div></div></div>' +
      '</button>' +
      '<button class="duo-card" data-act="go-ledger" aria-label="本月支出详情">' +
      '<div class="duo-head"><span class="duo-k">本月支出</span>' + TM.icon('wallet', 18) + '</div>' +
      '<div class="duo-body duo-body--ledger"><div><div class="duo-v mono">' + TM.util.money(budget.spent) + '</div>' +
      '<div class="duo-s">预算 ' + TM.util.money(budget.budget) + ' · 已用 ' + budget.ratio + '%</div></div>' +
      '<div class="bar bar--sm mt8" style="width:100%"><i style="width:' + Math.min(100, budget.ratio) + '%;background:' + budgetColor + '"></i></div></div>' +
      '</button></div>';
  }

  function render() {
    var now = new Date();
    var todayKey = TM.time.todayKey();
    var list = TM.store.schedulesOfDay(todayKey);
    var next = nextSchedule(list, now);
    var load = TM.store.computeLoad(todayKey);
    var budget = TM.store.budgetStatus();
    var sugs = TM.store.suggestions();
    var unread = TM.store.unreadCount();
    var profile = TM.store.profile;
    var fullBanner = list.length > 8 ? '<div class="banner banner--orange mb12">' + TM.icon('alert', 18) +
      '<div><b>今日安排较满</b><div class="mt4">共 ' + list.length + ' 项安排，建议为日程留出缓冲，或使用小行优化。</div></div></div>' : '';
    var offline = !TM.store.sync.online ? '<div class="banner banner--grey mb12">' + TM.icon('sync', 18) + '<div>当前离线，语音速记将保存在本地速记箱，联网后自动补传。</div></div>' : '';

    return '<section class="screen home">' +
      '<header class="home-head">' +
      '<div class="row between">' +
      '<div><div class="home-greet">' + greet() + '，' + TM.util.esc(profile.name) + '</div>' +
      '<div class="home-date">' + TM.time.fmt(now, 'full') + ' · ' + TM.util.esc(profile.city || '北京') + ' · 多云 8°</div></div>' +
      '<div class="row gap8">' +
      '<button class="icon-btn icon-btn--ghost" data-act="search" aria-label="搜索">' + TM.icon('search', 20) + '</button>' +
      '<button class="icon-btn icon-btn--ghost home-bell" data-act="bell" aria-label="通知中心">' + TM.icon('bell', 20) +
      (unread ? '<i class="badge home-bell-badge">' + unread + '</i>' : '') + '</button>' +
      '</div></div></header>' +
      '<div class="scr-body">' + offline + fullBanner +
      '<div class="home-grid">' +
      '<div class="home-main">' +
      heroHtml(next, list) +
      '<div class="sec"><div class="sec-t">今日时间轴</div><div class="sec-x">共 ' + list.length + ' 项</div></div>' +
      (list.length ? timelineHtml(list, now)
        : '<div class="card card--dashed">' + TM.ui.empty('today', '今天还没有安排', '说一句话，小行帮你把行程安排进日历。',
          '<button class="btn btn--primary mt8" data-act="voice">语音记录</button>') + '</div>') +
      '</div>' +
      '<div class="home-side">' +
      '<div class="sec"><div class="sec-t">小行建议</div><div class="sec-x" data-act="go-suggestions">全部' + (sugs.length ? ' ' + sugs.length : '') + TM.icon('chevron', 14) + '</div></div>' +
      suggestionsHtml(sugs) +
      '<div class="sec"><div class="sec-t">健康与账本</div></div>' +
      duoHtml(load, budget) +
      '<div class="quick-row">' +
      '<button class="quick-btn" data-act="quick-expense">' + TM.icon('wallet', 20) + '<span>记一笔</span></button>' +
      '<button class="quick-btn" data-act="quick-schedule">' + TM.icon('calendar', 20) + '<span>新建日程</span></button>' +
      '<button class="quick-btn quick-btn--mic" data-act="voice">' + TM.icon('mic', 20) + '<span>语音速记</span></button>' +
      '</div>' +
      '</div></div>' +
      '</div></section>';
  }

  function mount(root) {
    root.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]');
      if (!el) return;
      var act = el.dataset.act;
      var id = el.dataset.id;
      if (act === 'open-schedule') { TM.ui.go('#/schedule/' + id); }
      else if (act === 'bell') TM.ui.go('#/notifications');
      else if (act === 'search') TM.ui.go('#/search');
      else if (act === 'go-suggestions') TM.ui.go('#/suggestions');
      else if (act === 'go-health') TM.ui.go('#/health');
      else if (act === 'go-ledger') TM.ui.go('#/ledger');
      else if (act === 'quick-expense') TM.ui.go('#/ledger-add');
      else if (act === 'quick-schedule') TM.ui.go('#/schedule-edit/new');
      else if (act === 'voice') { if (TM.voice) TM.voice.start(); }
      else if (act === 'expand') { expanded = true; TM.ui.refresh(); }
      else if (act === 'collapse') { expanded = false; TM.ui.refresh(); }
      else if (act === 'adopt') {
        var res = TM.store.adoptSuggestion(id);
        if (!res.ok) { TM.ui.toast(res.message || '该建议已失效'); return; }
        TM.ui.haptic();
        TM.ui.toast(res.message, {
          action: res.undoToken ? {
            label: '撤销',
            onClick: function () {
              if (TM.store.undoAdopt(res.undoToken)) TM.ui.toast('已撤销本次调整');
              else TM.ui.toast('撤销窗口已过期');
            }
          } : null
        });
        if (res.route) TM.ui.go(res.route);
      } else if (act === 'ignore') {
        TM.store.ignoreSuggestion(id, false);
        TM.ui.toast('已忽略该建议，24 小时内不再提示');
      }
    });

    if (timer) clearInterval(timer);
    timer = setInterval(function () {
      var el = document.querySelector('[data-cd-start]');
      if (!el || !document.body.contains(el)) { clearInterval(timer); timer = null; return; }
      var mode = el.dataset.cdMode;
      var target = mode === 'end' ? el.dataset.cdEnd : el.dataset.cdStart;
      el.textContent = cdText(TM.time.parse(target), mode);
    }, 1000);
  }

  TM.screens.register('today', {
    route: [/^#\/today$/i, /^#\/$/],
    tab: 'today',
    render: render,
    mount: mount
  });
})();

/* ===== 40-trips.js ===== */
/* ==========================================================================
 * 40-trips.js · 行程与日程模块
 * 覆盖：行程中心 / 行程详情 / 日·周·月日历 / 日程详情 / 日程编辑 /
 *       全局搜索 / 冲突检测与替代时段 / 长按快捷菜单
 * 约定：只读写 TM.store，颜色与尺寸走 CSS 变量，模块样式统一 tr- 前缀。
 * ========================================================================== */
(function () {
  'use strict';

  const TM = window.TM;
  if (!TM || !TM.util || !TM.time || !TM.store || !TM.ui || !TM.screens) {
    return;
  }

  const U = TM.util;
  const T = TM.time;
  const UI = TM.ui;

  const esc = function (v) { return U.esc(v == null ? '' : String(v)); };
  const icon = function (name, size) {
    try { return TM.icon(name, size) || ''; } catch (e) { return ''; }
  };
  const money = function (v) {
    const n = Number(v);
    return U.money(isFinite(n) ? n : 0);
  };

  /* ======================= 通用小工具 ======================= */

  function warn(e) {
    try { if (window.console && console.warn) console.warn('[trips]', e); } catch (_) {}
  }

  function safe(fn, fallback) {
    try {
      const v = fn();
      return v == null ? fallback : v;
    } catch (e) { warn(e); return fallback; }
  }

  function queryObj() {
    const q = safe(function () { return UI.query(); }, {});
    return q && typeof q === 'object' ? q : {};
  }

  /* #screen 是复用节点，mount 的监听必须绑到本次渲染新建的 .screen 上，
     否则多次导航后旧页面的委托监听会残留。 */
  function hostOf(root) {
    if (!root) return root;
    try { return root.querySelector('.screen') || root; } catch (e) { return root; }
  }

  function pad2(n) { return U.pad2 ? U.pad2(n) : (n < 10 ? '0' + n : '' + n); }

  function dt(v) {
    try { return T.parse(v); } catch (e) { return new Date(); }
  }

  function startOf(o) {
    return dt(o.start != null ? o.start : (o.startAt != null ? o.startAt : o.start_at));
  }

  function endOf(o) {
    const raw = o.end != null ? o.end : (o.endAt != null ? o.endAt : o.end_at);
    if (raw == null) return T.addMin(startOf(o), 60);
    return dt(raw);
  }

  function schStart(s) { return startOf(s); }

  function schEnd(s) {
    const raw = s.end != null ? s.end : (s.endAt != null ? s.endAt : s.end_at);
    if (raw == null) return T.addMin(schStart(s), 60);
    return dt(raw);
  }

  function hm(v) {
    const d = dt(v);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function dateKeyValue(v) { return T.key(dt(v)); }

  function durMin(a, b) {
    const n = T.diffMin(dt(b), dt(a));
    return n > 0 ? n : 0;
  }

  function durLabel(min) {
    min = Math.max(0, Math.round(min));
    if (min < 60) return min + ' 分钟';
    const h = Math.floor(min / 60);
    const m = min % 60;
    return h + ' 小时' + (m ? ' ' + m + ' 分钟' : '');
  }

  function rangeText(st, en) {
    const a = T.fmt(st, 'md');
    const b = T.fmt(en, 'md');
    return a === b ? a : a + '–' + b;
  }

  function isCrossDay(st, en) {
    return T.key(st) !== T.key(T.addMin(en, -1));
  }

  function dayCount(st, en) {
    return Math.max(1, Math.round(durMin(T.startOfDay(st), T.startOfDay(en)) / 1440) + 1);
  }

  function weekdayShort(d) {
    return String(T.weekdayCN(dt(d)) || '').replace('周', '') || '一';
  }

  /* 分类与状态字典（键与 TM.SCHEDULE_CATEGORIES 对齐） */
  const CAT_TONE = {
    meeting: 'blue',
    work: 'blue',
    travel: 'purple',
    meal: 'orange',
    health: 'green',
    personal: 'gray'
  };

  const CAT_FALLBACK = {
    food: 'orange',
    dining: 'orange',
    study: 'blue',
    sport: 'green',
    other: 'gray'
  };

  function catNameOf(key) {
    const meta = TM.SCHEDULE_CATEGORIES && TM.SCHEDULE_CATEGORIES[key];
    if (meta && meta.name) return meta.name;
    const fb = {
      meeting: '会议', work: '工作', travel: '出行', meal: '用餐',
      health: '健康', personal: '个人', food: '用餐', study: '学习', other: '其他'
    };
    return fb[key] || '其他';
  }

  function catToneOf(key) {
    return CAT_TONE[key] || CAT_FALLBACK[key] || 'gray';
  }

  function catKeys() {
    const src = TM.SCHEDULE_CATEGORIES;
    if (src) {
      const keys = Object.keys(src);
      if (keys.length) return keys;
    }
    return ['meeting', 'work', 'travel', 'meal', 'health', 'personal'];
  }

  function catOf(s) {
    const key = (s && s.category) || 'work';
    return { key: key, name: catNameOf(key), tone: catToneOf(key) };
  }

  const SCH_STATUS = {
    pending: { text: '待确认', cls: 'tag--orange' },
    confirmed: { text: '已确认', cls: 'tag--blue' },
    done: { text: '已完成', cls: 'tag--green' },
    canceled: { text: '已取消', cls: 'tag--red' }
  };

  function schStatusTag(status) {
    const meta = SCH_STATUS[status] || SCH_STATUS.confirmed;
    return '<span class="tag ' + meta.cls + '">' + meta.text + '</span>';
  }

  const TRIP_STATUS = {
    planned: { text: '已规划', cls: 'tag--blue' },
    ongoing: { text: '进行中', cls: 'tag--green' },
    done: { text: '已结束', cls: '' },
    canceled: { text: '已取消', cls: 'tag--red' }
  };

  function tripMeta(tp) {
    const st = startOf(tp);
    const en = endOf(tp);
    const now = T.now();
    let status = tp.status;
    if (status !== 'canceled') status = en < now ? 'done' : (st <= now ? 'ongoing' : 'planned');
    return { st: st, en: en, status: status };
  }

  function tripStatusTag(status) {
    const meta = TRIP_STATUS[status] || TRIP_STATUS.planned;
    return '<span class="tag ' + meta.cls + '">' + meta.text + '</span>';
  }

  function participantsOf(s) {
    let p = s.participants != null ? s.participants : (s.people != null ? s.people : s.attendees);
    if (!p) p = s.participant;
    if (!p) return [];
    if (Array.isArray(p)) {
      return p.map(function (x) { return String(x); }).filter(Boolean);
    }
    return String(p).split(/[，,、\s/]+/).map(function (x) { return x.trim(); }).filter(Boolean);
  }

  /* ======================= 数据读取（统一走 store） ======================= */

  function allSchedules() {
    let r = safe(function () { return TM.store.schedules({}); }, null);
    if (!Array.isArray(r)) {
      r = safe(function () { return TM.store.state && TM.store.state.schedules; }, null);
      if (Array.isArray(r)) r = r.filter(function (x) { return !x.deletedAt; });
    }
    return Array.isArray(r) ? r : [];
  }

  function allTrips() {
    const r = safe(function () { return TM.store.trips(); }, []);
    return Array.isArray(r) ? r : [];
  }

  function allTx() {
    let r = safe(function () { return TM.store.transactions({}); }, null);
    if (!Array.isArray(r)) {
      r = safe(function () { return TM.store.state && TM.store.state.transactions; }, null);
      if (Array.isArray(r)) r = r.filter(function (x) { return !x.deletedAt; });
    }
    return Array.isArray(r) ? r : [];
  }

  function schedulesOfTrip(id) {
    const r = safe(function () { return TM.store.schedulesOfTrip(id); }, null);
    if (Array.isArray(r)) return r;
    return allSchedules().filter(function (s) { return s.tripId === id; })
      .sort(function (a, b) { return schStart(a) - schStart(b); });
  }

  function overlapSchedules(list, key) {
    const from = T.startOfDay(T.at(key, '00:00'));
    const to = T.endOfDay(from);
    return list.filter(function (s) {
      const st = schStart(s);
      const en = schEnd(s);
      return st < to && en > from;
    }).sort(function (a, b) { return schStart(a) - schStart(b); });
  }

  function daySchedules(key) {
    return overlapSchedules(allSchedules(), key);
  }

  function getScheduleById(id) {
    const s = safe(function () { return TM.store.getSchedule(id); }, null);
    if (!s) return null;
    if (s.deletedAt) return null;
    return s;
  }

  function getTripById(id) {
    const tp = safe(function () { return TM.store.getTrip(id); }, null);
    if (!tp || tp.deletedAt) return null;
    return tp;
  }

  function tripSpendOf(id) {
    const r = safe(function () { return TM.store.tripSpend(id); }, null);
    if (!r || typeof r !== 'object') return { total: 0, perPerson: 0, items: [] };
    return {
      total: Number(r.total) || 0,
      perPerson: Number(r.perPerson) || 0,
      items: Array.isArray(r.items) ? r.items : []
    };
  }

  function tripBudget(tp) {
    const raw = tp.budget != null ? tp.budget
      : (tp.expectedCost != null ? tp.expectedCost
        : (tp.estimatedCost != null ? tp.estimatedCost : tp.budgetAmount));
    if (raw == null || raw === '') return null;
    const n = Number(raw);
    return isFinite(n) ? n : null;
  }

  function conflictsOf(data, excludeId) {
    const r = safe(function () { return TM.store.checkConflicts(data, excludeId); }, []);
    return Array.isArray(r) ? r : [];
  }

  function conflictText(c) {
    if (!c) return '存在时间冲突';
    if (c.message) return String(c.message);
    const other = (c.other && c.other.title) || '其他日程';
    if (c.type === 'hard') return '与「' + other + '」重叠 ' + (c.minutes || 0) + ' 分钟';
    if (c.type === 'soft') return '与「' + other + '」仅间隔 ' + (c.minutes || 0) + ' 分钟';
    return '与「' + other + '」之间通勤时间不足';
  }

  function commuteOf(a, b) {
    const r = safe(function () { return TM.store.estimateCommute(a, b); }, null);
    if (!r || typeof r !== 'object') return { minutes: 30, km: 15, text: '' };
    return { minutes: Number(r.minutes) || 0, km: Number(r.km) || 0, text: r.text || '' };
  }

  function suggestSlotsFor(s) {
    const st = schStart(s);
    const en = schEnd(s);
    const base = T.key(st);
    const dur = durMin(st, en) || 60;
    const finish = function (list) {
      return (Array.isArray(list) ? list : []).slice(0, 3).map(function (x) {
        if (x && x.baseKey == null) x.baseKey = base;
        return x;
      });
    };
    const opt = { start: st, end: en, excludeId: s.id, count: 3 };
    const got = safe(function () { return TM.store.suggestSlots(Object.assign({ dateKey: base }, opt)); }, []);
    if (Array.isArray(got) && got.length) return finish(got);
    const nxt = T.addDays(st, 1);
    const got2 = safe(function () {
      return TM.store.suggestSlots({ dateKey: T.key(nxt), start: nxt, end: T.addMin(nxt, dur), excludeId: s.id, count: 3 });
    }, []);
    return finish(got2);
  }

  function slotLabel(sl) {
    if (!sl) return '替代时段';
    const body = sl.label ? String(sl.label) : (hm(sl.start) + '–' + hm(sl.end));
    if (sl.baseKey && T.key(sl.start) !== sl.baseKey) return T.fmt(sl.start, 'md') + ' ' + body;
    return body;
  }

  /* ======================= 通用渲染片段 ======================= */

  function screenWrap(headHtml, bodyHtml, cls) {
    return '<section class="screen ' + (cls || '') + '">' + headHtml +
      '<div class="scr-body"><div class="tr-pad">' + bodyHtml + '</div></div></section>';
  }

  function head(title, opts) {
    opts = opts || {};
    return UI.head({ title: title, back: opts.back !== false, right: opts.right || '' });
  }

  function emptyState(iconName, title, desc, actionHtml) {
    return UI.empty(iconName || 'trip', title, desc || '', actionHtml || '');
  }

  function notFoundScreen(title, desc) {
    return screenWrap(
      head(title, { back: true }),
      emptyState('alert', '内容不存在', desc || '可能已被删除，返回列表继续查看',
        '<button class="btn btn--primary btn--sm" data-act="to-trips">返回行程中心</button>')
    );
  }

  function secTitle(text, rightHtml) {
    return '<div class="sec"><div class="sec-t">' + esc(text) + '</div>' +
      (rightHtml ? '<div class="sec-x">' + rightHtml + '</div>' : '') + '</div>';
  }

  function schedRow(s, opts) {
    opts = opts || {};
    const st = schStart(s);
    const en = schEnd(s);
    const cat = catOf(s);
    const cross = isCrossDay(st, en);
    const people = participantsOf(s);
    const meta = [];
    if (s.location) meta.push(icon('pin', 13) + ' ' + esc(s.location));
    if (people.length) meta.push(icon('users', 13) + ' ' + esc(people.join('、')));
    if (!meta.length) meta.push(esc(cat.name) + (cross ? ' · 跨天' : ''));
    const tags = [];
    if (opts.conflict) tags.push('<span class="tag tag--orange">冲突</span>');
    if (s.important) tags.push('<span class="tr-star" aria-label="重要">★</span>');
    return '<div class="tr-row tr-c-' + cat.tone + (opts.flash ? ' tr-row--flash' : '') + '"' +
      ' data-sched="' + esc(s.id) + '" data-act="open-sched" data-id="' + esc(s.id) + '"' +
      ' role="button" tabindex="0">' +
      '<div class="tr-row-time"><b>' + hm(st) + '</b><span>' + (cross ? '次日 ' : '') + hm(en) + '</span></div>' +
      '<div class="tr-row-main">' +
      '<div class="tr-row-t">' + esc(s.title) + ' ' + tags.join(' ') + '</div>' +
      '<div class="tr-row-s">' + meta.join(' · ') + '</div>' +
      '</div>' +
      '<div class="tr-row-r">' + (opts.showStatus === false ? '' : schStatusTag(s.status)) + '</div>' +
      '</div>';
  }

  /* 冲突日程集合（any：硬/软/通勤冲突，用于橙色警示；hard：用于红色阻断） */
  function conflictMaps(list) {
    const hard = {};
    const any = {};
    (list || []).forEach(function (s) {
      const cs = conflictsOf({ start: schStart(s), end: schEnd(s), location: s.location }, s.id);
      cs.forEach(function (c) {
        if (!c) return;
        any[s.id] = true;
        if (c.type === 'hard') {
          hard[s.id] = true;
          if (c.other && c.other.id) { hard[c.other.id] = true; any[c.other.id] = true; }
        }
      });
    });
    return { hard: hard, any: any };
  }

  /* ======================= 1. 行程中心 #/trips ======================= */

  function renderTrips() {
    const list = allTrips();
    const now = T.now();
    const groups = { ongoing: [], planned: [], done: [] };
    list.forEach(function (tp) {
      const meta = tripMeta(tp);
      if (meta.status === 'ongoing') groups.ongoing.push(tp);
      else if (meta.status === 'done' || meta.status === 'canceled') groups.done.push(tp);
      else groups.planned.push(tp);
    });

    let body = '';

    /* 搜索入口 */
    body += '<button class="tr-searchbar" data-act="search" aria-label="搜索行程与日程">' +
      icon('search', 18) + '<span>搜索日程、行程、消费</span></button>';

    if (!list.length) {
      body += emptyState('trip', '还没有行程', '说一句「下周去上海出差」，小行就能帮你建好行程；也可以手动添加。',
        '<button class="btn btn--primary btn--sm" data-act="new-trip">新建行程</button>');
    } else {
      if (groups.ongoing.length) {
        body += secTitle('进行中', '<span class="tr-link" data-act="cal">日历</span>');
        body += groups.ongoing.map(tripCard).join('');
      }
      if (groups.planned.length) {
        body += secTitle('未来行程', '<span class="tr-link" data-act="new-trip">+ 新建</span>');
        body += groups.planned.map(tripCard).join('');
      }
      if (groups.done.length) {
        body += secTitle('已结束', '');
        body += groups.done.slice(0, 3).map(tripCard).join('');
      }
      if (!groups.ongoing.length && !groups.planned.length) {
        body += '<div class="banner banner--blue mt12">' + icon('spark', 16) +
          ' 近期没有新的出行安排，说一句「周末去杭州」即可快速创建行程。</div>';
      }
    }

    return screenWrap(
      head('行程', {
        back: false,
        right: '<button class="btn btn--ghost btn--sm" data-act="cal">' + icon('calendar', 16) + ' 日历</button>'
      }),
      body
    );
  }

  function tripCard(tp) {
    const meta = tripMeta(tp);
    const spend = tripSpendOf(tp.id);
    const budget = tripBudget(tp);
    const expected = budget != null ? budget : spend.total;
    const schs = schedulesOfTrip(tp.id);
    const total = Math.max(1, durMin(meta.st, meta.en));
    const passed = Math.min(total, Math.max(0, durMin(meta.st, T.now())));
    const pct = total > 0 ? Math.round(passed / total * 100) : 0;
    return '<div class="card tr-trip tr-tap" data-act="open-trip" data-id="' + esc(tp.id) + '" role="button" tabindex="0">' +
      '<div class="tr-trip-top">' +
      '<div class="tr-trip-title">' + esc(tp.title) + '</div>' +
      tripStatusTag(meta.status) +
      '</div>' +
      '<div class="tr-trip-sub">' + icon('pin', 13) + ' ' +
      esc(tp.destination || '未填目的地') + ' · ' + esc(rangeText(meta.st, meta.en)) +
      ' · ' + dayCount(meta.st, meta.en) + ' 天</div>' +
      (meta.status === 'ongoing'
        ? '<div class="bar mt12"><i style="width:' + pct + '%"></i></div>' +
          '<div class="tr-trip-progress muted small">行程已进行 ' + pct + '%</div>'
        : '') +
      '<div class="tr-trip-stats">' +
      '<div class="tr-trip-stat"><b>' + schs.length + '</b><span>日程</span></div>' +
      '<div class="tr-trip-stat"><b>' + money(expected) + '</b><span>预计花费</span></div>' +
      '<div class="tr-trip-stat"><b>' + money(spend.total) + '</b><span>实际花费</span></div>' +
      '</div>' +
      '</div>';
  }

  TM.screens.register('trips', {
    route: /^#\/trips(?:\?[^#]*)?$/i,
    tab: 'trips',
    render: function () { return renderTrips(); },
    mount: function (root) {
      const host = hostOf(root);
      bindLongPress(host);
      screenClick(host, function (act, el) {
        if (act === 'open-trip') UI.go('#/trip/' + el.dataset.id);
        else if (act === 'cal') UI.go('#/calendar/week/' + T.todayKey());
        else if (act === 'new-trip') openTripForm(null);
        else if (act === 'search') UI.go('#/search');
      });
    }
  });

  /* ======================= 2. 行程详情 #/trip/:id ======================= */

  function renderTripDetail(params) {
    const id = params && params[0];
    const tp = id ? getTripById(id) : null;
    if (!tp) return notFoundScreen('行程详情', '这个行程可能已被删除');

    const meta = tripMeta(tp);
    const schs = schedulesOfTrip(tp.id);
    const spend = tripSpendOf(tp.id);
    const budget = tripBudget(tp);
    const expected = budget != null ? budget : spend.total;
    const pct = expected > 0 ? Math.min(100, Math.round(spend.total / expected * 100)) : 0;
    const over = expected > 0 && spend.total > expected;
    const cm = conflictMaps(schs);
    const conflictCount = Object.keys(cm.any).length;
    const totalMin = schs.reduce(function (n, s) { return n + durMin(schStart(s), schEnd(s)); }, 0);

    let body = '';

    /* 头部信息卡 */
    body += '<div class="card tr-hero">' +
      '<div class="tr-hero-dest">' + icon('pin', 18) + ' ' + esc(tp.destination || '未填目的地') + '</div>' +
      '<div class="tr-hero-title">' + esc(tp.title) + '</div>' +
      '<div class="tr-hero-meta">' + esc(rangeText(meta.st, meta.en)) + ' · ' +
      dayCount(meta.st, meta.en) + ' 天 · 共 ' + schs.length + ' 项日程</div>' +
      '<div class="tr-hero-tags">' + tripStatusTag(meta.status) +
      '<span class="tag">' + durLabel(totalMin) + ' 已排期</span>' +
      (conflictCount ? '<span class="tag tag--orange">' + conflictCount + ' 处冲突</span>' : '') +
      '</div></div>';

    /* 花费概览 */
    body += secTitle('花费概览', '<span class="tr-link" data-act="to-ledger">账本明细</span>');
    body += '<div class="card tr-spend">' +
      '<div class="tr-spend-row">' +
      '<div class="stat"><div class="stat-v">' + money(expected) + '</div><div class="stat-k">预计花费</div></div>' +
      '<div class="stat"><div class="stat-v">' + money(spend.total) + '</div><div class="stat-k">实际花费</div></div>' +
      '<div class="stat"><div class="stat-v">' + money(spend.perPerson) + '</div><div class="stat-k">人均</div></div>' +
      '</div>' +
      '<div class="bar mt12"><i style="width:' + pct + '%"></i></div>' +
      '<div class="tr-spend-note ' + (over ? 'tr-spend-note--over' : '') + '">' +
      (expected > 0
        ? (over ? '已超出预计预算 ' + money(spend.total - expected) : '已使用预计预算的 ' + pct + '%')
        : '还没有记录行程花费') + '</div>' +
      (spend.items.length
        ? '<div class="tr-spend-items">' + spend.items.slice(0, 4).map(function (t) {
          return '<div class="tr-spend-item" data-act="open-tx" data-id="' + esc(t.id) + '">' +
            '<span>' + esc(t.merchant || t.categoryName || '消费') + '</span>' +
            '<b>' + money(t.amount) + '</b></div>';
        }).join('') + '</div>'
        : '') +
      '</div>';

    /* 添加日程 */
    body += '<button class="btn btn--primary btn--block mt12" data-act="add-sched" data-date="' +
      T.key(meta.st) + '">' + icon('plus', 18) + ' 添加日程</button>';

    /* 按天分组日程 */
    if (!schs.length) {
      body += '<div class="mt16">' + emptyState('calendar', '这个行程还没有日程',
        '把「客户拜访」「返程高铁」加进来，行程花费与健康负荷会自动归集。',
        '<button class="btn btn--primary btn--sm" data-act="add-sched" data-date="' + T.key(meta.st) + '">添加第一条日程</button>') + '</div>';
    } else {
      const keys = [];
      T.dayKeysBetween(T.key(meta.st), T.key(meta.en)).forEach(function (k) { keys.push(k); });
      schs.forEach(function (s) {
        const k = T.key(schStart(s));
        if (keys.indexOf(k) === -1) keys.push(k);
      });
      keys.sort();

      const dayGroups = [];
      keys.forEach(function (k) {
        const items = schs.filter(function (s) { return T.key(schStart(s)) === k; });
        if (items.length) dayGroups.push({ key: k, items: items });
      });

      body += '<div class="sec mt16"><div class="sec-t">行程日程</div><div class="sec-x muted">' +
        dayGroups.length + ' 天有安排</div></div>';

      dayGroups.forEach(function (g) {
        const d = T.at(g.key, '00:00');
        const today = g.key === T.todayKey();
        body += '<div class="card tr-day">' +
          '<div class="tr-day-head">' +
          '<div class="tr-day-date">' + T.fmt(d, 'md') + ' <span>' + T.weekdayCN(d) + '</span>' +
          (today ? '<span class="tag tag--blue">今天</span>' : '') + '</div>' +
          '<div class="tr-day-right"><span class="muted small">' + g.items.length + ' 项</span>' +
          '<button class="tr-mini-add" data-act="add-sched" data-date="' + g.key + '" aria-label="在这天添加日程">+</button></div>' +
          '</div>' +
          '<div class="tr-rows">' +
          g.items.map(function (s) {
            return schedRow(s, { conflict: !!cm.any[s.id] });
          }).join('') +
          '</div></div>';
      });
    }

    body += '<div class="tr-hint muted small">长按任意日程卡片，可改期、复制、删除或关联记账。</div>';

    return screenWrap(head(tp.title || '行程详情', {
      back: true,
      right: '<button class="btn btn--ghost btn--sm" data-act="trip-edit">编辑</button>'
    }), body);
  }

  TM.screens.register('trip-detail', {
    route: /^#\/trip\/([\w-]+)(?:\?[^#]*)?$/i,
    tab: 'trips',
    render: function (params) { return renderTripDetail(params); },
    mount: function (root, params) {
      const id = params && params[0];
      const tp = getTripById(id);
      const host = hostOf(root);
      bindLongPress(host);
      screenClick(host, function (act, el) {
        if (act === 'open-sched') UI.go('#/schedule/' + el.dataset.id);
        else if (act === 'add-sched') {
          let hash = '#/schedule-edit?date=' + (el.dataset.date || T.todayKey());
          if (tp) hash += '&tripId=' + encodeURIComponent(tp.id);
          UI.go(hash);
        } else if (act === 'trip-edit' && tp) openTripForm(tp);
        else if (act === 'to-trips') UI.go('#/trips');
        else if (act === 'to-ledger') UI.go('#/ledger');
        else if (act === 'open-tx') UI.go('#/tx/' + el.dataset.id);
      });
    }
  });

  /* 新建 / 编辑行程（模态） */
  function openTripForm(tp) {
    const isEdit = !!tp;
    const st = isEdit ? startOf(tp) : T.at(T.todayKey(), '09:00');
    const en = isEdit ? endOf(tp) : T.addDays(st, 2);
    const budget = isEdit ? tripBudget(tp) : null;
    const body = '' +
      '<label class="field"><span class="field-k">行程名称</span>' +
      '<input class="input" id="tr-tp-title" value="' + esc(isEdit ? tp.title : '') + '" placeholder="如：上海出差"></label>' +
      '<label class="field mt12"><span class="field-k">目的地</span>' +
      '<input class="input" id="tr-tp-dest" value="' + esc(isEdit ? (tp.destination || '') : '') + '" placeholder="如：上海"></label>' +
      '<div class="row gap12 mt12">' +
      '<label class="field grow"><span class="field-k">开始日期</span>' +
      '<input class="input" type="date" id="tr-tp-start" value="' + T.key(st) + '"></label>' +
      '<label class="field grow"><span class="field-k">结束日期</span>' +
      '<input class="input" type="date" id="tr-tp-end" value="' + T.key(en) + '"></label>' +
      '</div>' +
      '<label class="field mt12"><span class="field-k">预计花费（元，选填）</span>' +
      '<input class="input" type="number" inputmode="decimal" id="tr-tp-budget" value="' +
      (budget == null ? '' : esc(budget)) + '" placeholder="如：3000"></label>';

    const actions = [
      { label: '取消', kind: 'ghost', onClick: function (close) { close(); } },
      { label: isEdit ? '保存修改' : '创建行程', kind: 'primary', onClick: function (close) {
        const title = (valOf('tr-tp-title') || '').trim();
        const dest = (valOf('tr-tp-dest') || '').trim();
        const startKey = valOf('tr-tp-start') || T.todayKey();
        let endKey = valOf('tr-tp-end') || startKey;
        if (endKey < startKey) endKey = startKey;
        const budgetRaw = valOf('tr-tp-budget');
        if (!title) { UI.toast('请填写行程名称'); return; }
        const start = T.at(startKey, '09:00');
        const end = T.at(endKey, '18:00');
        const data = {
          title: title,
          destination: dest,
          start: start,
          end: end,
          status: isEdit ? (tp.status || 'planned') : 'planned',
          source: isEdit ? (tp.source || 'manual') : 'manual'
        };
        if (budgetRaw !== '' && isFinite(Number(budgetRaw))) data.budget = Number(budgetRaw);
        if (isEdit) {
          TM.store.updateTrip(tp.id, data);
          TM.store.save();
          close();
          UI.toast('已保存行程修改');
        } else {
          const created = TM.store.addTrip(data);
          TM.store.save();
          close();
          UI.toast('已创建行程「' + title + '」');
          if (created && created.id) UI.go('#/trip/' + created.id);
        }
      } }
    ];

    if (isEdit) {
      actions.splice(1, 0, {
        label: '删除行程', kind: 'danger', onClick: function (close) {
          UI.confirm({
            title: '删除行程',
            body: '删除「' + tp.title + '」后，行程内的日程会保留但不再归集花费。',
            confirmText: '删除',
            danger: true
          }).then(function (ok) {
            if (!ok) return;
            close();
            TM.store.removeTrip(tp.id);
            TM.store.save();
            UI.toast('已删除行程');
            UI.go('#/trips');
          });
        }
      });
    }

    UI.openModal({
      title: isEdit ? '编辑行程' : '新建行程',
      subtitle: isEdit ? tp.title : '行程是日程与花费的容器',
      body: body,
      actions: actions
    });
  }

  function valOf(id) {
    const el = document.getElementById(id);
    return el ? el.value : '';
  }

  /* ======================= 3. 日历（日 / 周 / 月） #/calendar/:view/:date ======================= */

  const CAL_VIEWS = { day: true, week: true, month: true };

  function calState(params) {
    const rawView = params && params[0];
    const view = rawView && CAL_VIEWS[rawView] ? rawView : 'day';
    let key = params && params[1];
    if (!key || !/^\d{4}-\d{2}-\d{2}$/.test(key)) key = T.todayKey();
    return { view: view, key: key, focus: T.at(key, '00:00') };
  }

  function periodLabel(view, focus) {
    if (view === 'month') return T.fmt(focus, 'month');
    if (view === 'week') {
      const ws = weekStart(focus);
      return T.fmt(ws, 'md') + '–' + T.fmt(T.addDays(ws, 6), 'md');
    }
    return T.fmt(focus, 'full');
  }

  function weekStart(focus) {
    const d = T.startOfDay(focus);
    const wd = d.getDay();
    return T.startOfDay(T.addDays(d, wd === 0 ? -6 : 1 - wd));
  }

  function dayViewHTML(focus) {
    const key = T.key(focus);
    const schs = daySchedules(key);
    const allDay = schs.filter(function (s) { return !!s.allDay; });
    const timed = schs.filter(function (s) { return !s.allDay; });
    const cm = conflictMaps(schs);
    const hardCount = Object.keys(cm.hard).length;
    const softCount = Object.keys(cm.any).length - hardCount;

    let html = '';

    if (schs.length > 8) {
      html += '<div class="banner banner--orange mt12">' + icon('alert', 16) +
        ' 今日安排较满，共 ' + schs.length + ' 条，建议合并或顺延部分安排。</div>';
    }
    if (hardCount) {
      html += '<div class="banner banner--red mt12">' + icon('alert', 16) +
        ' ' + hardCount + ' 个日程存在时间冲突，点击日程查看替代时段。</div>';
    } else if (softCount) {
      html += '<div class="banner banner--orange mt12">' + icon('clock', 16) +
        ' ' + softCount + ' 个日程间隔过近或通勤时间不足，建议预留缓冲。</div>';
    }

    html += '<div class="tr-cal-sum">' +
      '<span>' + schs.length + ' 个日程</span>' +
      '<span>' + durLabel(timed.reduce(function (n, s) { return n + durMin(schStart(s), schEnd(s)); }, 0)) + '</span>' +
      (allDay.length ? '<span>全天 ' + allDay.length + '</span>' : '') +
      '</div>';

    if (!schs.length) {
      html += emptyState('calendar', '这一天还没有安排',
        '点右上角「+」新建日程，或长按语音说一句「明天下午三点见王总」。',
        '<button class="btn btn--primary btn--sm" data-act="add-sched">添加日程</button>');
      return html;
    }

    if (allDay.length) {
      html += '<div class="tr-allday">' + allDay.map(function (s) {
        return '<button class="tr-allday-chip tr-c-' + catOf(s).tone + '" data-sched="' + esc(s.id) +
          '" data-act="open-sched" data-id="' + esc(s.id) + '">' + esc(s.title) + '</button>';
      }).join('') + '</div>';
    }

    /* 位置计算 */
    const segs = [];
    timed.forEach(function (s) {
      segmentsOfDay(s, key).forEach(function (seg) { segs.push({ s: s, seg: seg }); });
    });
    segs.sort(function (a, b) { return a.seg.from - b.seg.from; });

    let startH = 8;
    let endH = 22;
    if (segs.length) {
      const minMin = Math.min.apply(null, segs.map(function (x) { return x.seg.from.getHours() * 60 + x.seg.from.getMinutes(); }));
      const maxMin = Math.max.apply(null, segs.map(function (x) { return x.seg.to.getHours() * 60 + x.seg.to.getMinutes(); }));
      startH = Math.max(0, Math.min(8, Math.floor(minMin / 60)));
      endH = Math.min(24, Math.max(22, Math.ceil(maxMin / 60)));
    }
    if (endH <= startH) endH = startH + 1;

    const hourH = 52;
    const gridStart = T.addMin(T.startOfDay(focus), startH * 60);
    const height = (endH - startH) * hourH;
    const flat = segs.map(function (x) { return x.seg; });
    assignLanes(flat);

    let axis = '';
    for (let h = startH; h <= endH; h++) {
      axis += '<span style="top:' + ((h - startH) * hourH) + 'px">' + pad2(h) + ':00</span>';
    }
    const blocks = segs.map(function (x) {
      return evBlockHTML(x.seg, x.s, hourH, gridStart, !!cm.any[x.s.id]);
    }).join('');

    html += '<div class="tr-dgrid" style="height:' + height + 'px;--hour-h:' + hourH + 'px">' +
      '<div class="tr-dgrid-axis">' + axis + '</div>' +
      '<div class="tr-dgrid-col" style="height:' + height + 'px">' + blocks + '</div>' +
      '</div>';

    html += '<div class="tr-hint muted small">左右滑动切换日期 · 长按日程可快捷改期</div>';
    return html;
  }

  function weekViewHTML(focus) {
    const ws = weekStart(focus);
    const keys = [];
    for (let i = 0; i < 7; i++) keys.push(T.key(T.addDays(ws, i)));
    const all = allSchedules();
    const todayKey = T.todayKey();
    const busy = [];
    keys.forEach(function (k) {
      overlapSchedules(all, k).forEach(function (s) { busy.push(s); });
    });
    const conflictIds = conflictMaps(busy);

    let html = '';
    if (busy.length > 40) {
      html += '<div class="banner banner--orange mt12">' + icon('alert', 16) + ' 本周安排密集，注意留出通勤与休息时间。</div>';
    }

    /* 日期条 */
    html += '<div class="tr-wk-head"><div class="tr-wk-axis-h"></div>' + keys.map(function (k) {
      const d = T.at(k, '00:00');
      const on = k === T.key(focus);
      const isToday = k === todayKey;
      return '<button class="tr-wk-d' + (on ? ' tr-wk-d--on' : '') + (isToday ? ' tr-wk-d--today' : '') + '"' +
        ' data-act="week-day" data-key="' + k + '">' +
        '<span>' + weekdayShort(d) + '</span><b>' + d.getDate() + '</b></button>';
    }).join('') + '</div>';

    /* 全天事件条 */
    const allDayCells = keys.map(function (k) {
      const items = overlapSchedules(all, k).filter(function (s) { return !!s.allDay; });
      return '<div class="tr-wk-allday-cell">' + items.map(function (s) {
        return '<button class="tr-allday-chip tr-c-' + catOf(s).tone + '" data-sched="' + esc(s.id) +
          '" data-act="open-sched" data-id="' + esc(s.id) + '">' + esc(s.title) + '</button>';
      }).join('') + '</div>';
    }).join('');
    if (allDayCells.replace(/<[^>]+>/g, '').length) {
      html += '<div class="tr-wk-allday"><div class="tr-wk-axis-h"></div>' + allDayCells + '</div>';
    }

    /* 时间网格：按周内最早/最晚日程动态取范围（覆盖 07:00 与 22:00 的日程） */
    const weekSegs = [];
    keys.forEach(function (k) {
      overlapSchedules(all, k).forEach(function (s) {
        if (s.allDay) return;
        segmentsOfDay(s, k).forEach(function (seg) { weekSegs.push({ s: s, seg: seg, key: k }); });
      });
    });
    let startH = 8;
    let endH = 22;
    if (weekSegs.length) {
      let minMin = 24 * 60;
      let maxMin = 0;
      weekSegs.forEach(function (x) {
        const a = x.seg.from.getHours() * 60 + x.seg.from.getMinutes();
        const b = x.seg.to.getHours() * 60 + x.seg.to.getMinutes();
        if (a < minMin) minMin = a;
        if (b > maxMin) maxMin = b;
      });
      startH = Math.max(0, Math.min(8, Math.floor(minMin / 60)));
      endH = Math.min(24, Math.max(22, Math.ceil(maxMin / 60)));
    }
    if (endH <= startH) endH = startH + 1;
    const hourH = 46;
    const height = (endH - startH) * hourH;
    let axis = '';
    for (let h = startH; h <= endH; h += 1) {
      axis += '<span style="top:' + ((h - startH) * hourH) + 'px">' + pad2(h) + '</span>';
    }

    const cols = keys.map(function (k) {
      const segs = weekSegs.filter(function (x) { return x.key === k; });
      segs.sort(function (a, b) { return a.seg.from - b.seg.from; });
      const flat = segs.map(function (x) { return x.seg; });
      assignLanes(flat);
      /* 每列必须用「本列当天 00:00 + startH」作为基准，否则周二之后的事件会整体偏移 */
      const colGridStart = T.addMin(T.startOfDay(T.at(k, '00:00')), startH * 60);
      const blocks = segs.map(function (x) {
        return evBlockHTML(x.seg, x.s, hourH, colGridStart, !!conflictIds.any[x.s.id], true);
      }).join('');
      return '<div class="tr-wk-col' + (k === T.key(focus) ? ' tr-wk-col--on' : '') + '" data-key="' + k + '">' + blocks + '</div>';
    }).join('');

    html += '<div class="tr-wk-grid" style="height:' + height + 'px;--hour-h:' + hourH + 'px" data-swipe="1">' +
      '<div class="tr-wk-axis">' + axis + '</div>' + cols + '</div>';

    html += '<div class="tr-hint muted small">左右滑动切换周 · 点击日期条进入日视图 · 长按日程快捷操作</div>';
    return html;
  }

  function monthViewHTML(focus) {
    const y = focus.getFullYear();
    const m = focus.getMonth();
    const first = new Date(y, m, 1);
    const firstKey = T.key(first);
    const offset = (first.getDay() + 6) % 7;
    let gridStart = T.startOfDay(T.addDays(first, -offset));
    const cells = [];
    for (let i = 0; i < 42; i++) cells.push(T.addDays(gridStart, i));

    const all = allSchedules();
    const todayKey = T.todayKey();
    const selKey = T.key(focus);
    const monthStartKey = firstKey;
    const monthEndKey = T.key(new Date(y, m + 1, 0));

    let monthCount = 0;
    const conflictDays = {};
    const allCm = conflictMaps(all);

    const cellHtml = cells.map(function (d) {
      const k = T.key(d);
      const items = overlapSchedules(all, k);
      const inMonth = d.getMonth() === m;
      if (inMonth) monthCount += items.length;
      let bars = '';
      const limited = items.slice(0, 2);
      items.forEach(function (s) { if (allCm.any[s.id]) conflictDays[k] = true; });
      limited.forEach(function (s) {
        const cat = catOf(s);
        bars += '<i class="tr-mbar tr-c-' + cat.tone + (allCm.any[s.id] ? ' tr-mbar--warn' : '') + '"></i>';
      });
      const more = items.length - limited.length;
      return '<button class="tr-mday' + (inMonth ? '' : ' tr-mday--out') +
        (k === selKey ? ' tr-mday--on' : '') + (k === todayKey ? ' tr-mday--today' : '') + '"' +
        ' data-act="month-day" data-key="' + k + '" aria-label="' + T.fmt(d, 'full') + '">' +
        '<span class="tr-mday-n">' + d.getDate() + '</span>' +
        '<span class="tr-mday-bars">' + bars + (more > 0 ? '<em>+' + more + '</em>' : '') + '</span>' +
        (conflictDays[k] ? '<span class="tr-mday-warn" aria-label="有冲突"></span>' : '') +
        '</button>';
    }).join('');

    const selSchs = daySchedules(selKey);
    const selCm = conflictMaps(selSchs);

    let html = '';
    html += '<div class="tr-month-sum">' + T.fmt(focus, 'month') + ' · 本月 ' + monthCount + ' 个日程' +
      (Object.keys(conflictDays).length ? ' · ' + Object.keys(conflictDays).length + ' 天有冲突' : '') + '</div>';

    html += '<div class="tr-month-head">' +
      ['一', '二', '三', '四', '五', '六', '日'].map(function (w) { return '<span>' + w + '</span>'; }).join('') +
      '</div>';
    html += '<div class="tr-month-grid">' + cellHtml + '</div>';

    /* 选中日列表 */
    const selDate = T.at(selKey, '00:00');
    html += '<div class="sec mt16"><div class="sec-t">' + T.fmt(selDate, 'full') + '</div>' +
      '<div class="sec-x"><span class="tr-link" data-act="open-day">日视图</span></div></div>';

    if (selSchs.length) {
      html += '<div class="card tr-day"><div class="tr-rows">' +
        selSchs.map(function (s) { return schedRow(s, { conflict: !!selCm.any[s.id] }); }).join('') +
        '</div></div>';
      html += '<button class="btn btn--ghost btn--block btn--sm mt12" data-act="add-sched">' +
        icon('plus', 16) + ' 在这天添加日程</button>';
    } else {
      html += '<div class="card card--dashed tr-empty-mini">' +
        '<div class="muted">这一天还没有安排</div>' +
        '<button class="btn btn--ghost btn--sm mt8" data-act="add-sched">添加日程</button></div>';
    }
    return html;
  }

  function renderCalendar(params) {
    const st = calState(params);
    const body =
      '<div class="seg tr-seg">' +
      '<button class="seg-i' + (st.view === 'day' ? ' seg-i--on' : '') + '" data-act="view" data-view="day">日</button>' +
      '<button class="seg-i' + (st.view === 'week' ? ' seg-i--on' : '') + '" data-act="view" data-view="week">周</button>' +
      '<button class="seg-i' + (st.view === 'month' ? ' seg-i--on' : '') + '" data-act="view" data-view="month">月</button>' +
      '</div>' +
      '<div class="tr-period">' +
      '<button class="tr-period-btn" data-act="prev" aria-label="上一周期">' + icon('chevron', 18) + '</button>' +
      '<div class="tr-period-t">' + esc(periodLabel(st.view, st.focus)) + '</div>' +
      '<button class="tr-period-btn tr-period-btn--r" data-act="next" aria-label="下一周期">' + icon('chevron', 18) + '</button>' +
      '</div>' +
      (st.view === 'day' ? dayViewHTML(st.focus)
        : st.view === 'week' ? weekViewHTML(st.focus) : monthViewHTML(st.focus)) +
      '<div class="tr-back-today"><button class="btn btn--ghost btn--sm btn--block" data-act="today">回到今天</button></div>';

    return screenWrap(head('日历', {
      back: true,
      right: '<button class="btn btn--ghost btn--sm" data-act="add-sched" aria-label="新建日程">' + icon('plus', 18) + '</button>'
    }), body);
  }

  function navCal(view, key, replace) {
    const hash = '#/calendar/' + view + '/' + key;
    if (replace) UI.replace(hash); else UI.go(hash);
  }

  function stepCal(view, focus, dir) {
    let next;
    if (view === 'day') next = T.addDays(focus, dir);
    else if (view === 'week') next = T.addDays(focus, 7 * dir);
    else {
      const d = new Date(focus.getFullYear(), focus.getMonth() + dir, 1);
      next = d;
    }
    navCal(view, T.key(next), true);
  }

  TM.screens.register('calendar', {
    route: /^#\/calendar(?:\/(day|week|month))?(?:\/(\d{4}-\d{2}-\d{2}))?(?:\?[^#]*)?$/i,
    tab: 'trips',
    render: function (params) { return renderCalendar(params); },
    mount: function (root, params) {
      const st = calState(params);
      const focus = st.focus;
      const host = hostOf(root);
      bindLongPress(host);
      bindSwipe(host, function (dir) { stepCal(st.view, focus, dir); });
      screenClick(host, function (act, el) {
        if (act === 'view') navCal(el.dataset.view, T.key(focus), true);
        else if (act === 'prev') stepCal(st.view, focus, -1);
        else if (act === 'next') stepCal(st.view, focus, 1);
        else if (act === 'today') navCal(st.view, T.todayKey(), true);
        else if (act === 'open-day') navCal('day', T.key(focus), false);
        else if (act === 'week-day') navCal('day', el.dataset.key, false);
        else if (act === 'month-day') navCal('month', el.dataset.key, true);
        else if (act === 'add-sched') UI.go('#/schedule-edit?date=' + T.key(focus));
        else if (act === 'open-sched') UI.go('#/schedule/' + el.dataset.id);
        else if (act === 'to-trips') UI.go('#/trips');
      });
    }
  });

  /* 单日切段（跨天事件分两段渲染） */
  function segmentsOfDay(s, dayKey) {
    const dayStart = T.startOfDay(T.at(dayKey, '00:00'));
    const dayEnd = T.endOfDay(dayStart);
    const st = schStart(s);
    const en = schEnd(s);
    if (st >= dayEnd || en <= dayStart) return [];
    const from = st < dayStart ? dayStart : st;
    let to = en > dayEnd ? dayEnd : en;
    if (to <= from) return [];
    return [{
      from: from,
      to: to,
      contStart: st < dayStart,
      contEnd: en > dayEnd
    }];
  }

  /* 重叠事件分列 */
  function assignLanes(segs) {
    let cluster = [];
    let clusterEnd = 0;
    const clusters = [];
    segs.forEach(function (sg) {
      if (cluster.length && +sg.from >= clusterEnd) {
        clusters.push(cluster);
        cluster = [];
        clusterEnd = 0;
      }
      cluster.push(sg);
      if (+sg.to > clusterEnd) clusterEnd = +sg.to;
    });
    if (cluster.length) clusters.push(cluster);
    clusters.forEach(function (cl) {
      const lanes = [];
      cl.forEach(function (sg) {
        let lane = -1;
        for (let i = 0; i < lanes.length; i++) {
          if (lanes[i] <= +sg.from) { lane = i; break; }
        }
        if (lane === -1) { lane = lanes.length; lanes.push(+sg.to); }
        else { lanes[lane] = +sg.to; }
        sg.lane = lane;
      });
      cl.forEach(function (sg) { sg.lanes = lanes.length; });
    });
    return segs;
  }

  function evBlockHTML(seg, s, hourH, gridStart, conflict, compact) {
    const top = ((seg.from - gridStart) / 3600000) * hourH;
    const h = Math.max(compact ? 22 : 26, ((seg.to - seg.from) / 3600000) * hourH);
    const lanes = seg.lanes || 1;
    const lane = seg.lane || 0;
    const width = 100 / lanes;
    const left = lane * width;
    const cat = catOf(s);
    const style = 'top:' + top.toFixed(1) + 'px;height:' + h.toFixed(1) + 'px;' +
      'left:calc(' + left + '% + 2px);width:calc(' + width + '% - 4px)';
    const timeText = hm(seg.from) + (seg.contStart ? ' 续' : '');
    return '<div class="tr-ev tr-c-' + cat.tone + (conflict ? ' tr-ev--conflict' : '') +
      (h < 38 ? ' tr-ev--sm' : '') + '" style="' + style + '" data-sched="' + esc(s.id) +
      '" data-act="open-sched" data-id="' + esc(s.id) + '">' +
      '<div class="tr-ev-t">' + esc(s.title) + '</div>' +
      '<div class="tr-ev-s">' + timeText + (compact ? '' : (s.location ? ' · ' + esc(s.location) : '')) + '</div>' +
      (conflict ? '<span class="tr-ev-flag" aria-label="冲突">!</span>' : '') +
      '</div>';
  }

    body += '<div class="card mt12">' + rows.map(function (r) {

      '<button class="btn btn--ghost" data-act="duplicate">复制</button>' +

      back: true,

  function statusText(status) {
    return (SCH_STATUS[status] || SCH_STATUS.confirmed).text;
  }

  function sourceText(src) {
    const map = { voice: '语音速记', manual: '手动创建', import: '日历导入', ocr: '票据识别', ai: '小行建议' };
    return map[src] || '手动创建';
  }

  function normRepeat(r) {
    if (!r) return null;
    if (typeof r === 'string') return { type: r };
    if (typeof r === 'object') return r;
    return null;
  }

  function repeatLabel(r0) {
    const r = normRepeat(r0);
    if (!r) return '';
    const t = r.type;
    const names = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    let base = '';
    if (t === 'daily') base = '每天';
    else if (t === 'weekday') base = '每工作日';
    else if (t === 'monthly') base = '每月' + (r.day ? ' ' + r.day + ' 日' : '同日');
    else if (t === 'weekly') {
      const days = Array.isArray(r.days) ? r.days : [];
      base = days.length ? '每周' + days.map(function (d) { return names[(Number(d) || 0) % 7]; }).join('、') : '每周';
    } else if (t === 'custom') base = '每 ' + (r.interval || 1) + ' 天';
    else base = '重复';
    if (r.until) base += '，至 ' + T.fmt(r.until, 'md');
    else if (r.count) base += '，共 ' + r.count + ' 次';
    return base;
  }

  function normReminder(s) {
    const r = (s && s.reminder) || {};
    return {
      advance: r.advance != null ? r.advance : 15,
      departure: !!r.departure,
      geo: !!r.geo,
      second: !!r.second,
      daily: !!r.daily
    };
  }

  function reminderTypesOf(s) {
    const r = normReminder(s);
    const out = [];
    if (r.advance != null) out.push('normal');
    if (r.departure) out.push('depart');
    if (r.geo) out.push('geo');
    if (r.second) out.push('second');
    if (r.daily) out.push('daily');
    return out;
  }

  function reminderRowsHTML(s, st) {
    const types = reminderTypesOf(s);
    const defs = [
      { key: 'normal', label: '常规提醒', desc: '提前 15 分钟 · ' + hm(T.addMin(st, -15)) },
      { key: 'depart', label: '出发提醒', desc: '按通勤动态计算' },
      { key: 'geo', label: '地理提醒', desc: '到达 / 离开指定范围 200 米' },
      { key: 'second', label: '二次提醒', desc: '首次提醒后 5 分钟未处理' },
      { key: 'daily', label: '每日简报', desc: '每晚 21:00 汇总次日安排' }
    ];
    return defs.map(function (d) {
      const on = types.indexOf(d.key) >= 0;
      return '<div class="tr-kv tr-kv--rem">' +
        '<div class="tr-kv-k">' + d.label + '</div>' +
        '<div class="tr-kv-v">' + d.desc + '</div>' +
        '<span class="tag ' + (on ? 'tag--green' : '') + '">' + (on ? '已开启' : '未开启') + '</span>' +
        '</div>';
    }).join('');
  }

  function commuteBlockHTML(s) {
    if (!s.location) {
      return '<div class="muted">未填写地点，无法估算通勤时间。' +
        '<button class="btn btn--ghost btn--sm mt8" data-act="edit">补充地点</button></div>';
    }
    const st = schStart(s);
    const all = daySchedules(T.key(st));
    let prev = null;
    all.forEach(function (x) {
      if (x.id === s.id) return;
      const e = schEnd(x);
      if (e <= st && (!prev || e > schEnd(prev))) prev = x;
    });
    const fromLoc = (prev && prev.location) ? prev.location : '公司';
    const est = commuteOf(fromLoc, s.location);
    const depart = T.addMin(st, -est.minutes);
    let html = '';
    if (prev) {
      html += '<div class="tr-commute-line">上一站：<b>' + esc(prev.location || prev.title) + '</b>' +
        '（' + hm(schEnd(prev)) + ' 结束）</div>';
    } else {
      html += '<div class="tr-commute-line">默认从「' + esc(fromLoc) + '」出发</div>';
    }
    if (!est.minutes) {
      html += '<div class="tr-commute-main">' + icon('car', 18) +
        ' 同地点或线上进行，<b>无需通勤</b>。</div>';
      html += '<div class="tr-commute-depart">' + hm(st) + ' 开始前保持在线即可。</div>';
      return html;
    }
    html += '<div class="tr-commute-main">' + icon('car', 18) +
      ' 从「' + esc(fromLoc) + '」到「' + esc(s.location) + '」预计 <b>' + est.minutes + ' 分钟</b>' +
      (est.km ? '（约 ' + est.km + ' 公里）' : '') + '</div>';
    html += '<div class="tr-commute-depart">建议 <b>' + hm(depart) + '</b> 出发，' +
      hm(st) + ' 开始前到达' + (prev ? '，当前间隔 ' + durLabel(durMin(schEnd(prev), st)) : '') + '。</div>';
    return html;
  }

  TM.screens.register('schedule-detail', {

  /* ======================= 5. 新建 / 编辑日程 #/schedule-edit/:id? ======================= */

  const REM_DEFS = [
    { key: 'normal', label: '常规提醒 · 提前 15 分钟' },
    { key: 'depart', label: '出发提醒 · 动态通勤' },
    { key: 'geo', label: '地理提醒 · 200 米' },
    { key: 'second', label: '二次提醒 · 5 分钟后' },
    { key: 'daily', label: '每日简报 · 21:00' }
  ];

  function defaultStart() {
    const now = T.now();
    if (now.getHours() < 8) return T.at(T.todayKey(), '09:00');
    const d = new Date(now.getTime());
    d.setSeconds(0, 0);
    if (d.getMinutes() < 30) d.setMinutes(30);
    else { d.setHours(d.getHours() + 1); d.setMinutes(0); }
    return d;
  }

  function editIdOf(params) {
    const raw = params && params[0];
    if (!raw || raw === 'new') return null;
    return raw;
  }

    const existing = id ? getScheduleById(id) : null;
    if (id && !existing) return notFoundScreen('编辑日程', '这个日程可能已被删除');

    if (isEdit) {
      start = schStart(existing);
      end = schEnd(existing);

      const dateKey = /^\d{4}-\d{2}-\d{2}$/.test(q.date || '') ? q.date : T.todayKey();
      if (q.start && /^\d{2}:\d{2}$/.test(q.start)) {
        start = T.at(dateKey, q.start);
        end = T.addMin(start, q.end && /^\d{2}:\d{2}$/.test(q.end) ? durMin(T.at(dateKey, q.start), T.at(dateKey, q.end)) : 60);
        if (+end <= +start) end = T.addMin(start, 60);
      } else {
        start = dateKey === T.todayKey() ? defaultStart() : T.at(dateKey, '09:00');
        end = T.addMin(start, 60);
      }
    }

    const tripId = isEdit ? (existing.tripId || '') : (q.tripId || '');
    const repeat = isEdit ? normRepeat(existing.repeat) : null;
    const remTypes = isEdit ? reminderTypesOf(existing) : ['normal', 'depart'];

    const repeatType = repeat ? (repeat.type || 'none') : 'none';

      ['none', '不重复'], ['daily', '每天'], ['weekly', '每周指定星期'],

        '<button class="seg-i seg-i--on" data-act="scope" data-scope="本次">仅本次</button>' +
        '<button class="seg-i" data-act="scope" data-scope="本次及以后">本次及以后</button>' +
        '<button class="seg-i" data-act="scope" data-scope="全部">全部</button></div></div>'
