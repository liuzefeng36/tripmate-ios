name: iOS Build Check

# 用途：在没有 Mac 的情况下，用 GitHub 提供的 macOS 运行器验证 Xcode 工程能否编译通过。
# 不管仓库根目录是 ios/ 的内容，还是包含 ios/ 子目录，都能自动识别。
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build for iOS Simulator (no signing)
        run: |
          set -o pipefail
          if [ -f ios/TripMate.xcodeproj/project.pbxproj ]; then
            cd ios
          fi
          xcodebuild \
            -project TripMate.xcodeproj \
            -scheme TripMate \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
